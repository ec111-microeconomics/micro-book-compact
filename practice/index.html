nswer": true, "why": "Accounting profit subtracts only explicit costs from total revenue. Economic profit subtracts both explicit and implicit costs, such as the salary the owner gave up. If the implicit costs are larger than the accounting profit, the economic profit is negative even though the accounting profit is positive.", "key": "ch14-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Economic profit", "stem": "Priya leaves a job that paid $90,000 a year to run her own consulting firm. She starts the firm with $50,000 of her own savings, which would otherwise have earned 4 percent a year. In its first year the firm takes in $210,000 of revenue and pays $85,000 in rent, staff wages and software. What is the firm's economic profit for the year?", "options": ["$125,000", "$35,000", "$123,000", "$33,000"], "answer": 3, "why": "Economic profit is total revenue minus explicit and implicit costs. Explicit costs are $85,000, so accounting profit is $210,000 − $85,000 = $125,000. Implicit costs are the $90,000 salary she gave up plus the interest her savings would have earned, 4% × $50,000 = $2,000, for a total of $92,000. Economic profit is $125,000 − $92,000 = $33,000. $125,000 ignores the implicit costs, $35,000 leaves out the forgone interest, and $123,000 leaves out the forgone salary.", "reasons": ["$125,000 is accounting profit. It leaves out the implicit costs: the salary and the interest she gave up.", "$35,000 subtracts the $90,000 salary she gave up but leaves out the interest her savings would have earned.", "$123,000 subtracts the forgone interest but leaves out the $90,000 salary she gave up.", ""], "key": "ch14-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Average total cost", "stem": "The table shows a firm's total cost at each level of output. At which quantity is average total cost lowest?", "table": {"header": ["Output (units)", "Total cost"], "rows": [["0", "$100"], ["1", "$140"], ["2", "$170"], ["3", "$210"], ["4", "$270"], ["5", "$350"]]}, "options": ["2 units", "3 units", "4 units", "5 units"], "answer": 2, "why": "Average total cost is total cost divided by output: $140 at 1 unit, $170 ÷ 2 = $85 at 2 units, $210 ÷ 3 = $70 at 3 units, $270 ÷ 4 = $67.50 at 4 units, and $350 ÷ 5 = $70 at 5 units. The lowest is $67.50, at 4 units. The marginal costs confirm it. The 4th unit costs $270 − $210 = $60, which is below the $70 average at 3 units, so the average falls. The 5th unit costs $350 − $270 = $80, which is above the $67.50 average at 4 units, so the average rises.", "reasons": ["At 2 units average total cost is $170 ÷ 2 = $85, and it is lower at another output.", "At 3 units average total cost is $210 ÷ 3 = $70, and it is lower at another output.", "", "At 5 units average total cost is $350 ÷ 5 = $70, and it is lower at another output."], "key": "ch14-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Marginal cost and average total cost", "stem": "Producing 20 units costs a firm $300 in total, an average of $15 a unit. Making a 21st unit adds $12 to total cost. With 21 units, the firm's average total cost", "options": ["rises above $15.", "falls below $15.", "stays at exactly $15.", "falls to $12."], "answer": 1, "why": "Total cost at 20 units is 20 × $15 = $300. Adding the 21st unit at $12 makes total cost $312, so average total cost is $312 ÷ 21 ≈ $14.86, which is below $15. The general rule: when marginal cost is below average total cost, producing one more unit pulls the average down. It does not fall all the way to $12, because the $12 unit is averaged with the 20 units that came before it.", "reasons": ["The 21st unit costs $12, less than the $15 average, so adding it cannot raise the average.", "", "The average stays the same only if the extra unit costs exactly the average, $15. This one costs $12.", "The $12 unit is averaged with the 20 units already made, so the average does not fall all the way to $12."], "key": "ch14-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Diminishing marginal product", "stem": "A restaurant hires a sixth cook and its meals served per night rise, but by less than they rose when it hired the fifth cook. The restaurant's total output must therefore be falling.", "answer": false, "why": "The sixth cook still adds to output, because meals served rise. What falls is the marginal product: the sixth cook adds fewer meals than the fifth did. That is diminishing marginal product. Total output keeps rising as long as marginal product is positive; it falls only if an extra cook adds a negative amount.", "key": "ch14-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Economies of scale", "stem": "In the long run, a furniture maker's total cost is $40,000 to make 100 tables and $72,000 to make 200 tables. Over this range of output, the firm has", "options": ["economies of scale, because long-run average total cost falls from $400 to $360 per table.", "diseconomies of scale, because long-run total cost rises from $40,000 to $72,000.", "constant returns to scale, because output doubles.", "diseconomies of scale, because the extra 100 tables add $32,000 to total cost."], "answer": 0, "why": "Economies of scale are judged by long-run average total cost, not total cost. Average cost is $40,000 ÷ 100 = $400 per table at 100 tables and $72,000 ÷ 200 = $360 per table at 200 tables. Average cost falls as output rises, so the firm has economies of scale. Total cost always rises when output rises, so a rising total cost says nothing about scale. Constant returns would require average cost to stay the same, which it does not.", "reasons": ["", "Scale is judged by average cost, not total cost. Total cost always rises when output rises.", "Constant returns would need average cost to stay the same. Compare $40,000 ÷ 100 with $72,000 ÷ 200.", "The extra 100 tables cost $32,000 ÷ 100 = $320 each, less than the $400 average before, so they pull the average down, not up."], "key": "ch14-M5"}]}, {"chapter": 15, "title": "Firms in Competitive Markets", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Price takers", "stem": "A wheat farmer is one of thousands of sellers of identical wheat. If she set her price above the market price, she would", "options": ["sell the same amount, because her regular buyers would stay with her.", "lose all her sales, because buyers can get identical wheat from other farmers at the market price.", "raise her total revenue, because each bushel would bring in more.", "push the market price up."], "reasons": ["Her wheat is identical to everyone else's, so buyers have no reason to pay her more than the market price.", "", "Each bushel would bring in more only if someone bought it. At a price above the market price no one does.", "She is one seller among thousands. Her output is too small a part of the market to move the market price."], "answer": 1, "why": "In a competitive market the product is identical and there are many sellers, so each firm is a price taker. Buyers can get the same wheat from other farmers at the market price. A farmer who asks more than that sells nothing.", "key": "ch15-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Marginal revenue", "stem": "A firm in a competitive market sells T-shirts at the market price of $12 each. Its marginal revenue from selling one more T-shirt is", "options": ["$0.", "less than $12, because selling more lowers the price.", "$12.", "more than $12 if demand is strong."], "reasons": ["Each extra T-shirt sold brings in the $12 price, so the extra revenue is not zero.", "A competitive firm is a price taker. It can sell more without lowering the price, so the extra revenue is the full $12.", "", "The firm cannot charge more than the market price, so one more T-shirt cannot bring in more than $12."], "answer": 2, "why": "Marginal revenue is the change in total revenue from selling one more unit. A competitive firm can sell as much as it wants at the market price, so each extra T-shirt adds exactly the price, $12, to total revenue. For a competitive firm, marginal revenue equals the price.", "key": "ch15-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Shutdown rule", "stem": "In the short run, a competitive firm should shut down if the price is below its", "options": ["average variable cost.", "average total cost.", "marginal cost at its current output.", "average fixed cost."], "reasons": ["", "A price below average total cost but above average variable cost means a loss, yet staying open covers the variable cost and part of the fixed cost. Shutting down would lose more.", "A price below marginal cost at the current output means the firm should produce less, not that it should close.", "Fixed cost must be paid in the short run whether the firm operates or not, so it plays no part in the decision to shut down."], "answer": 0, "why": "If the firm shuts down in the short run, it still pays its fixed cost but saves its variable cost. Staying open is worth it only if revenue covers variable cost, that is, if the price is at least average variable cost. When the price is below average variable cost, each unit sold loses money beyond the fixed cost, so the firm shuts down.", "key": "ch15-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Long-run equilibrium", "stem": "When entry and exit are free, competition drives the economic profit of a typical firm in a competitive industry to zero once the market has fully adjusted.", "answer": true, "why": "If firms earn positive profit, new firms enter, market supply rises and the price falls. If they make losses, firms exit and the price rises. Entry and exit stop only when profit is zero, which happens when the price equals the minimum of average total cost.", "key": "ch15-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Profit maximization", "stem": "To get the most profit, a price-taking firm should aim for the output level where its cost per unit is at its minimum.", "answer": false, "why": "A competitive firm maximizes profit by producing the quantity at which marginal cost equals the price. If the price is above the minimum of average total cost, that quantity is larger than the one where average total cost is lowest. The two coincide only in long-run equilibrium, when the price equals the minimum of average total cost.", "key": "ch15-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Profit-maximizing quantity", "stem": "A firm in a competitive market can sell as many units as it wants at $8 each. Its total cost is shown in the table. What quantity maximizes its profit?", "table": {"header": ["Quantity", "Total cost"], "rows": [["0", "$10"], ["1", "$13"], ["2", "$17"], ["3", "$22"], ["4", "$29"], ["5", "$38"], ["6", "$49"]]}, "options": ["3 units", "5 units", "6 units", "4 units"], "reasons": ["The 4th unit adds $8 to revenue and $29 − $22 = $7 to cost, so producing it raises profit by $1. Stopping at 3 units is too few.", "The 5th unit adds $8 to revenue but $38 − $29 = $9 to cost, so producing it lowers profit by $1.", "At 6 units revenue is $48 and cost is $49, a loss of $1. The 6th unit costs $11 and brings in only $8.", ""], "answer": 3, "why": "The marginal cost of each unit is the rise in total cost: $3, $4, $5, $7, $9 and $11. The firm produces each unit whose marginal cost is no more than the $8 price. Units 1 to 4 pass; the 5th, at $9, does not. Profit at 4 units is $32 − $29 = $3, more than at 3 units ($24 − $22 = $2) or at 5 units ($40 − $38 = $2).", "key": "ch15-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Measuring profit", "stem": "A price-taking firm produces 500 units and sells them for $20 apiece. Counting all its costs, each unit costs it $16 on average. How much profit does it make?", "options": ["$10,000.", "$2,000.", "$8,000.", "$4."], "reasons": ["$10,000 is total revenue, 500 × $20. Profit subtracts total cost.", "", "$8,000 is total cost, 500 × $16. Profit is revenue minus that cost.", "$4 is the profit on each unit, $20 − $16. Total profit multiplies it by the 500 units sold."], "answer": 1, "why": "Profit is (price − average total cost) × quantity. Here that is ($20 − $16) × 500 = $2,000. Put another way, total revenue is $10,000 and total cost is $8,000, so profit is $2,000.", "key": "ch15-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Shutdown decision", "stem": "A bakery in a competitive market has fixed costs of $3,000 a month, which it must pay even if it closes for the month. If it stays open, its revenue will be $9,000 and its variable costs $8,000. In the short run, the bakery should", "options": ["stay open, because revenue covers variable costs and leaves $1,000 toward fixed costs.", "shut down, because it would lose money by staying open.", "shut down, because revenue is less than the total cost of $11,000.", "stay open, because it earns a profit of $1,000."], "reasons": ["", "Staying open loses $2,000, but closing loses the whole $3,000 of fixed costs. Staying open loses less.", "The $3,000 of fixed costs is paid whether the bakery opens or not, so comparing revenue with total cost is the wrong test in the short run.", "Its profit is $9,000 − $8,000 − $3,000 = −$2,000, a loss. The $1,000 is what is left after variable costs only."], "answer": 0, "why": "If the bakery closes, it loses its $3,000 of fixed costs. If it stays open, it loses $9,000 − $8,000 − $3,000 = $2,000. Staying open loses $1,000 less, because revenue more than covers variable cost. In the short run a firm stays open when revenue is at least variable cost.", "key": "ch15-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Entry in the long run", "stem": "Existing firms in a competitive industry are making positive economic profit, and nothing stops new firms from joining. Over time,", "options": ["the market price rises and profits grow.", "the market price stays the same and profits stay positive.", "market supply rises, the price falls, and profits fall toward zero.", "the number of firms in the market falls."], "reasons": ["Entry adds to market supply, which pushes the price down, not up.", "Profits attract new firms, and their extra output lowers the price. Positive profits cannot last.", "", "Positive profits attract firms into the market. Firms leave only when they make losses."], "answer": 2, "why": "Positive profits draw new firms into the market. Their output shifts the market supply curve to the right, so the price falls. Entry continues until the price has fallen to the minimum of average total cost and economic profit is zero.", "key": "ch15-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "The firm's supply curve", "stem": "In the short run, the quantity a competitive firm supplies at each price is read off its marginal-cost curve, but only at prices at or above its average variable cost.", "answer": true, "why": "At any price, the firm produces where marginal cost equals the price, so the marginal-cost curve shows how much it supplies. Below average variable cost, the firm shuts down and supplies nothing. So the short-run supply curve is the marginal-cost curve above average variable cost.", "key": "ch15-M5"}]}, {"chapter": 16, "title": "Monopoly", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Barriers to entry", "stem": "Which of the following can keep rival firms out of a market and so let a single firm be its only seller?", "options": ["A patent that gives the firm the sole right to sell a new drug.", "Many firms selling an identical product.", "Low costs of setting up a new firm.", "Buyers who know the price charged by every seller."], "reasons": ["", "Many firms selling the same product is the opposite of a monopoly. It describes a competitive market.", "Low setup costs make it easy for new firms to enter, so they work against a monopoly.", "Well-informed buyers make it harder for a seller to charge more than its rivals. This is not a barrier to entry."], "answer": 0, "why": "A monopoly lasts only if other firms cannot enter the market. A patent is a legal barrier: for its term, no other firm may sell the drug. That lets the patent holder be the only seller.", "key": "ch16-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Profit maximization", "stem": "A profit-maximizing monopolist produces the quantity at which", "options": ["price equals marginal cost.", "average total cost is lowest.", "total revenue is as large as possible.", "marginal revenue equals marginal cost."], "reasons": ["Price equals marginal cost in a competitive market. A monopolist charges a price above marginal cost.", "The quantity where average total cost is lowest is the efficient scale. A monopolist has no reason to produce there.", "Total revenue is largest where marginal revenue is zero. Producing there ignores what the extra units cost.", ""], "answer": 3, "why": "Profit rises when a unit adds more to revenue than to cost, that is, when marginal revenue exceeds marginal cost. A monopolist expands output until marginal revenue equals marginal cost. It then charges the highest price the demand curve allows for that quantity.", "key": "ch16-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Natural monopoly", "stem": "Economists use the term natural monopoly for a market in which", "options": ["one firm controls a key natural resource, such as a mineral spring.", "one firm can serve the entire market at a lower cost per unit than several firms sharing it.", "the government sets the price.", "marginal cost rises steeply as output increases."], "reasons": ["Owning a key resource is a separate source of monopoly. A natural monopoly arises from costs, not from who owns an input.", "", "A price set by the government is regulation. It does not explain why there is a single firm.", "Steeply rising marginal cost favors many small firms, not one large one."], "answer": 1, "why": "A natural monopoly arises when average total cost keeps falling over the relevant range of output, usually because fixed costs are large. One firm can then serve the whole market more cheaply than several firms could. Water distribution, with its expensive network of pipes, is the standard example.", "key": "ch16-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Monopoly and demand", "stem": "Because it has no competitors, a monopolist can charge any price it likes and still sell as much as it wants.", "answer": false, "why": "A monopolist faces the downward-sloping market demand curve. If it raises its price, buyers purchase less. It can choose the price or the quantity, but not both: it can sell only the combinations that lie on the demand curve.", "key": "ch16-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Marginal revenue", "stem": "To sell one more unit, a monopolist must lower its price, so its marginal revenue from that unit is less than its price.", "answer": true, "why": "A monopolist that sells one more unit gains the price of that unit but loses revenue on the units it was already selling, because they now sell at the lower price too. Marginal revenue is the price minus that loss, so it is less than the price.", "key": "ch16-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Monopoly price from a table", "stem": "A monopolist faces the demand shown in the table. Each unit costs $5 to produce, and there are no fixed costs. What price maximizes its profit?", "table": {"header": ["Price", "Quantity demanded"], "rows": [["$10", "1"], ["$9", "2"], ["$8", "3"], ["$7", "4"], ["$6", "5"]]}, "options": ["$5", "$9", "$8", "$7"], "reasons": ["$5 is the marginal cost. A monopolist charges more than marginal cost, and at $5 it would earn no profit.", "At $9 the firm sells 2 units. The 3rd unit adds $24 − $18 = $6 to revenue and only $5 to cost, so selling it raises profit.", "", "At $7 the firm sells 4 units. The 4th unit adds only $28 − $24 = $4 to revenue but $5 to cost, so selling it lowers profit."], "answer": 2, "why": "Total revenue is $10, $18, $24, $28 and $30, so marginal revenue is $10, $8, $6, $4 and $2. The firm sells each unit whose marginal revenue is at least the $5 marginal cost: units 1 to 3. To sell 3 units it charges $8. Profit is $24 − $15 = $9, higher than at 2 units ($18 − $10 = $8) or 4 units ($28 − $20 = $8).", "key": "ch16-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Welfare cost of monopoly", "stem": "Compared with a competitive market with the same costs, a profit-maximizing monopoly", "options": ["produces less, charges more, and causes a deadweight loss.", "produces more and charges less.", "produces the same quantity but charges more, so there is no deadweight loss.", "produces less, but total surplus is unchanged because the monopolist's profit makes up for buyers' loss."], "reasons": ["", "A monopolist restricts output to keep its price up, so it produces less and charges more, not the reverse.", "A monopolist does not produce the competitive quantity. It stops where marginal revenue equals marginal cost, which is a smaller quantity.", "The profit is only part of what buyers lose. The units that are no longer produced were worth more to buyers than they cost, and that surplus is lost to everyone."], "answer": 0, "why": "A monopolist produces where marginal revenue equals marginal cost, which is less than the quantity where demand meets marginal cost. It then charges a price above marginal cost. Units that buyers value above their cost go unproduced, so total surplus is smaller. That lost surplus is the deadweight loss of monopoly.", "key": "ch16-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Perfect price discrimination", "stem": "Suppose a monopolist could charge each buyer exactly that buyer's willingness to pay. Compared with charging a single monopoly price, this would", "options": ["raise consumer surplus.", "remove the deadweight loss, with all the surplus going to the monopolist.", "lower total surplus.", "leave the quantity sold unchanged."], "reasons": ["Each buyer pays exactly what the good is worth to her, so consumer surplus falls to zero.", "", "Every buyer who values the good above its cost now buys it, so total surplus rises to its largest possible size.", "The firm now sells to every buyer whose willingness to pay is at least marginal cost, which is more than it sells at a single monopoly price."], "answer": 1, "why": "When the monopolist charges each buyer her willingness to pay, it no longer has to cut the price on other units to make an extra sale. So it sells to every buyer who values the good at least at its marginal cost. That is the efficient quantity, so the deadweight loss disappears. Because each buyer pays her full willingness to pay, the whole surplus is profit.", "key": "ch16-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Marginal revenue", "stem": "At a price of $50 a monopolist sells 10 units. Selling an 11th unit requires a price of $48, charged on all 11 units. How much does the 11th unit add to total revenue?", "options": ["$48.", "$50.", "$2.", "$28."], "reasons": ["$48 is what the 11th unit sells for, but the price cut also loses $2 on each of the first 10 units.", "$50 is the old price. The 11th unit can be sold only at $48.", "$2 is the price cut on each unit, not the change in total revenue.", ""], "answer": 3, "why": "Total revenue at 10 units is 10 × $50 = $500. At 11 units it is 11 × $48 = $528. Marginal revenue is $528 − $500 = $28. Put another way, the firm gains $48 from the 11th unit but loses $2 on each of the first 10 units: $48 − $20 = $28.", "key": "ch16-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Welfare cost of monopoly", "stem": "The main social cost of monopoly is that the monopolist's profit takes surplus away from consumers.", "answer": false, "why": "The profit moves surplus from buyers to the firm's owners. It does not shrink total surplus. The social cost of monopoly is the deadweight loss: the monopolist produces too little, so units that buyers value above their cost are never produced.", "key": "ch16-M5"}]}, {"chapter": 17, "title": "Monopolistic Competition", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Market structures", "stem": "Many sellers, differentiated products and free entry: which market below has all three?", "options": ["Wheat, sold by thousands of farmers", "Tap water in a city, supplied by one company", "Restaurants in a large city, each with a somewhat different menu", "Commercial jet aircraft, built by two large firms"], "reasons": ["Wheat is an identical product sold by many sellers, which makes it perfect competition.", "A single supplier is a monopoly.", "", "A market with only a few sellers is an oligopoly."], "answer": 2, "why": "Monopolistic competition has many sellers, products that are similar but not identical, and free entry. City restaurants fit: there are many of them, each offers something a little different, and new ones can open.", "key": "ch17-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "The firm's demand curve", "stem": "The demand curve facing a single firm in monopolistic competition", "options": ["slopes downward, because its product differs from its rivals' products.", "is horizontal at the market price.", "is vertical.", "slopes upward."], "reasons": ["", "A horizontal demand curve belongs to a competitive firm selling an identical product. A firm with a differentiated product keeps some customers when it raises its price.", "A vertical demand curve would mean buyers purchase the same amount at any price. Customers buy less from the firm when it raises its price.", "Demand curves slope down: buyers purchase less at a higher price."], "answer": 0, "why": "Each firm sells a product that is somewhat different from its rivals' products. If it raises its price, some customers switch to rivals, but others stay. So it sells less at a higher price, without losing all its sales: its demand curve slopes downward.", "key": "ch17-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Long-run equilibrium", "stem": "In the long run, economic profit falls to zero for firms selling differentiated products under monopolistic competition because", "options": ["the government regulates their prices.", "new firms enter when there are profits, and firms leave when there are losses.", "each firm produces at its efficient scale.", "the firms agree to keep their prices low."], "reasons": ["Prices in monopolistic competition are set by the firms, not by the government.", "", "Firms in monopolistic competition produce below their efficient scale, not at it. Zero profit comes from entry and exit.", "Agreements to fix prices are illegal, and with many firms they would be hard to keep. Zero profit comes from entry and exit."], "answer": 1, "why": "Profits attract new firms, which take customers away and shift each firm's demand curve to the left. Losses lead firms to leave, which shifts the remaining firms' demand curves to the right. Entry and exit stop only when price equals average total cost, so profit is zero.", "key": "ch17-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Profit maximization", "stem": "A firm in monopolistic competition chooses the quantity at which marginal revenue equals marginal cost.", "answer": true, "why": "Like a monopolist, the firm faces a downward-sloping demand curve. It raises its profit by producing each unit that adds more to revenue than to cost, so it stops where marginal revenue equals marginal cost. It then charges the price its demand curve allows for that quantity.", "key": "ch17-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Markup", "stem": "In the long run, entry under monopolistic competition pushes each firm's price down until it matches the extra cost of producing one more unit.", "answer": false, "why": "The firm's demand curve slopes downward, so its marginal revenue is less than its price. It produces where marginal revenue equals marginal cost, so its price is above marginal cost. That gap is the markup, and it remains in the long run.", "key": "ch17-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Excess capacity", "stem": "Under monopolistic competition, where does a typical firm's output sit in the long run?", "options": ["at its efficient scale, where average total cost is lowest.", "more than its efficient scale.", "where price equals marginal cost.", "less than its efficient scale, where average total cost is still falling."], "reasons": ["Producing at the efficient scale happens in a competitive market. Here the firm stops short of it.", "The firm's downward-sloping demand curve touches average total cost where that curve is still falling, so it produces less, not more.", "The firm charges a markup, so its price is above marginal cost.", ""], "answer": 3, "why": "In the long run, profit is zero, so the firm's demand curve just touches its average-total-cost curve. Because the demand curve slopes downward, the point where they touch is on the falling part of the average-total-cost curve. The firm therefore produces less than its efficient scale. This is called excess capacity.", "key": "ch17-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Markup from a table", "stem": "A firm in monopolistic competition faces the demand shown in the table. Each unit costs $6 to produce. At its profit-maximizing output, the firm's markup of price over marginal cost is", "table": {"header": ["Price", "Quantity demanded"], "rows": [["$12", "1"], ["$10", "2"], ["$8", "3"], ["$6", "4"]]}, "options": ["$4.", "$10.", "$8.", "$6."], "reasons": ["", "$10 is the price itself. The markup subtracts the $6 marginal cost.", "$8 is the marginal revenue of the 2nd unit, $20 − $12. The markup compares price with marginal cost.", "$6 is the marginal cost. The markup is the price minus the marginal cost."], "answer": 0, "why": "Total revenue is $12, $20, $24 and $24, so marginal revenue is $12, $8, $4 and $0. The firm produces each unit whose marginal revenue is at least the $6 marginal cost: units 1 and 2. To sell 2 units it charges $10. The markup is $10 − $6 = $4.", "key": "ch17-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Entry", "stem": "Firms in a monopolistically competitive market are earning profits. As new firms enter, the demand curve facing each existing firm", "options": ["shifts to the right.", "does not change, because each firm's product is different.", "shifts to the left, as some customers buy from the new firms.", "becomes horizontal."], "reasons": ["New firms take customers away from existing firms, so each existing firm's demand falls, not rises.", "Products differ, but they are close substitutes. When new varieties appear, some customers switch to them.", "", "Each firm still sells a product that differs from its rivals', so its demand curve still slopes downward."], "answer": 2, "why": "New firms offer products that compete with those already sold. Some customers switch to them, so each existing firm sells less at every price: its demand curve shifts left. Entry continues until the demand curve just touches average total cost and profit is zero.", "key": "ch17-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Advertising", "stem": "Which statement reflects the view that advertising makes markets more competitive?", "options": ["Advertising builds brand loyalty, so demand for each firm's product becomes less elastic.", "Advertising tells buyers about prices and about new firms, so firms find it harder to charge high markups.", "Advertising adds to firms' costs, so it raises prices.", "Advertising persuades buyers that products differ when in fact they do not."], "reasons": ["Making demand less elastic lets firms raise their markups. This is the critics' view of advertising.", "", "This is a criticism of advertising: it says advertising raises prices, not that it promotes competition.", "This is the critics' view: advertising creates the impression of differences between products, which weakens competition."], "answer": 1, "why": "Defenders of advertising argue that it gives buyers information about prices, products and new sellers. Better-informed buyers can find the best deal, and new firms can attract customers. Demand for each firm becomes more elastic, and markups fall. The other three statements are the critics' case.", "key": "ch17-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Markup", "stem": "In long-run equilibrium, a firm in monopolistic competition would raise its profit if one more customer came along willing to pay its current price.", "answer": true, "why": "The firm's price is above its marginal cost. A customer who pays the current price therefore brings in more than the cost of serving her, so profit rises. A competitive firm, whose price equals marginal cost, would gain nothing from such a customer.", "key": "ch17-M5"}]}, {"chapter": 18, "title": "Oligopoly", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Market structures", "stem": "A market has only a handful of sellers, and each must watch what the others do. Which market below fits that description?", "options": ["Corn, grown by thousands of farmers", "Commercial jet aircraft, built by a few large firms", "Local electricity distribution, supplied by one regulated firm", "Hair salons in a large city, each somewhat different"], "reasons": ["Thousands of sellers of an identical product is perfect competition.", "", "A single supplier is a monopoly.", "Many sellers of somewhat different products, with free entry, is monopolistic competition."], "answer": 1, "why": "An oligopoly is a market with only a few sellers offering similar or identical products. Because there are so few, each firm's profit depends on what the others do. Jet aircraft, built by a handful of large firms, fit that description.", "key": "ch18-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Cartels", "stem": "A cartel is", "options": ["a firm that is the only seller of a product.", "a market with many firms selling identical products.", "a law that limits the number of firms in a market.", "a group of firms that agree on output and prices so as to act together like a monopoly."], "reasons": ["A single seller is a monopoly. A cartel is several firms acting together.", "Many firms selling identical products is perfect competition.", "A legal limit on the number of firms is a barrier to entry, not a cartel.", ""], "answer": 3, "why": "A cartel is a group of firms acting in unison. By agreeing to restrict output and keep prices up, its members try to earn the profit a monopoly would earn and share it among themselves.", "key": "ch18-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "The prisoners' dilemma", "stem": "Two players each gain by breaking a joint agreement, whatever the other player does. In this prisoners' dilemma, each player", "options": ["pursues its own interest, and both end up worse off than if they had cooperated.", "cooperates, because cooperating gives each player its best outcome.", "has no dominant strategy.", "ends up better off than if the two had cooperated."], "reasons": ["", "Each player gains by breaking the agreement whatever the other does, so neither cooperates.", "Each player has a dominant strategy: to look after its own interest.", "The outcome is worse for both than the cooperative one. That is what makes it a dilemma."], "answer": 0, "why": "In the prisoners' dilemma, each player does better by acting in its own interest, whatever the other does. So both act in their own interest. The result is worse for both than if they had cooperated, which shows why cooperation is hard to keep up even when it is in everyone's interest.", "key": "ch18-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Dominant strategies", "stem": "A player with a dominant strategy can choose it without needing to guess what the other players will do.", "answer": true, "why": "A dominant strategy is the player's best choice whatever the other players choose. Since it is best in every case, the player does not need to predict the others' choices to know what to do.", "key": "ch18-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Oligopoly outcome", "stem": "When oligopolists each pursue their own interest without cooperating, they produce the same quantity a monopoly would.", "answer": false, "why": "Each oligopolist gains by producing a little more than its share of the monopoly output, because it keeps the profit on the extra units while the lower price is shared with its rivals. So together they produce more than a monopoly would, though less than a competitive market. The price ends up below the monopoly price and above marginal cost.", "key": "ch18-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Cartel output from a table", "stem": "Two firms are the only sellers in a market with the demand shown in the table. Each unit costs $10 to produce, and there are no fixed costs. If the two firms form a cartel and act like a monopoly, what total quantity do they produce?", "table": {"header": ["Price", "Quantity demanded"], "rows": [["$60", "10"], ["$50", "20"], ["$40", "30"], ["$30", "40"], ["$20", "50"], ["$10", "60"]]}, "options": ["20", "60", "30", "40"], "reasons": ["At 20 units the price is $50 and profit is ($50 − $10) × 20 = $800, less than the cartel can earn at 30 units.", "60 units is the competitive outcome, where price equals the $10 marginal cost and profit is zero.", "", "At 40 units the price is $30 and profit is ($30 − $10) × 40 = $800, less than at 30 units."], "answer": 2, "why": "A cartel chooses the quantity that makes joint profit largest, as a monopoly would. Profit is (price − $10) × quantity: $500, $800, $900, $800, $500 and $0 for 10 to 60 units. The largest is $900, at 30 units and a price of $40.", "key": "ch18-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Output effect and price effect", "stem": "Two firms agree to split the monopoly output between them. Each then finds that producing a little more than its share would raise its own profit. The reason is that", "options": ["the profit on the extra units outweighs the loss from the lower price on its existing units, and its rival bears part of the price fall.", "the market price rises when it produces more.", "its marginal cost falls as it produces more.", "its rival is required by law to cut output in response."], "reasons": ["", "A larger total quantity lowers the market price. It does not raise it.", "The incentive does not depend on falling costs. It comes from the firm keeping the gain on extra units while sharing the price fall with its rival.", "Nothing requires the rival to cut output. Such agreements usually cannot be enforced in court."], "answer": 0, "why": "Selling one more unit has two effects on a firm's profit. The output effect: it earns the price, above marginal cost, on the extra unit. The price effect: the market price falls a little on every unit it sells. A monopolist weighs the price fall on all units in the market, but each oligopolist counts it only on its own units. So each finds it profitable to expand beyond its share, and the agreement breaks down.", "key": "ch18-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Nash equilibrium", "stem": "Two airlines each decide whether to run a large advertising campaign. The table shows each airline's annual profit for every combination of choices. What is the Nash equilibrium?", "table": {"header": ["", "B does not advertise", "B advertises"], "rows": [["A does not advertise", "A: $10m, B: $10m", "A: $4m, B: $14m"], ["A advertises", "A: $14m, B: $4m", "A: $7m, B: $7m"]]}, "options": ["Neither advertises; each earns $10 million.", "Only Airline A advertises.", "Only Airline B advertises.", "Both advertise; each earns $7 million."], "reasons": ["Both would be better off here, but each can raise its profit from $10 million to $14 million by advertising, so this outcome does not last.", "Airline B would then earn $4 million. By advertising too it earns $7 million, so it would change its choice.", "Airline A would then earn $4 million. By advertising too it earns $7 million, so it would change its choice.", ""], "answer": 3, "why": "Advertising is a dominant strategy for each airline. If the rival does not advertise, advertising earns $14 million instead of $10 million. If the rival advertises, advertising earns $7 million instead of $4 million. So both advertise and each earns $7 million. Neither can do better by changing its choice alone, so this is the Nash equilibrium, even though both would earn more if neither advertised.", "key": "ch18-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Sustaining cooperation", "stem": "Oligopolists who have agreed to hold output down are most likely to abandon the deal when", "options": ["only two or three firms share the market.", "many firms share the market.", "the same firms face each other year after year.", "every firm sells an identical product."], "reasons": ["With only two or three firms it is easier to agree and to spot a firm that breaks the agreement.", "", "Repeated dealings make cooperation easier, because a firm that cheats today can be punished by its rivals later.", "Identical products make it easier to agree on a single price and to see when a rival cuts it."], "answer": 1, "why": "Each firm in an oligopoly is tempted to produce more than the agreed amount. With many firms, each one's share of the price fall it causes is small, so the gain from cheating is larger, and any one firm's cheating is harder to spot. That makes an agreement harder to hold together.", "key": "ch18-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Number of firms", "stem": "Suppose many new firms enter an oligopoly until it has hundreds of sellers. The market price then moves close to marginal cost, and quantity close to the competitive level.", "answer": true, "why": "With more firms, each one's output has a smaller effect on the market price, so the price effect of extra output matters less to it. Each firm keeps producing as long as the price is above marginal cost. As the number of firms grows very large, the market behaves like a competitive one: price approaches marginal cost and quantity approaches the efficient level.", "key": "ch18-M5"}]}, {"chapter": 22, "title": "The Theory of Consumer Choice", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "The budget constraint", "stem": "An analyst has $600 a month to spend on concert tickets, at $60 each, and restaurant dinners, at $40 each. If she spends it all on concert tickets, how many can she buy?", "options": ["6", "15", "10", "6 tickets and 6 dinners"], "reasons": ["6 divides $600 by $100, the price of a ticket and a dinner together. Only the ticket price matters here.", "15 is the number of dinners she could buy, $600 / $40.", "", "6 tickets and 6 dinners cost exactly $600, so that bundle is on her budget line, but it includes dinners. The question asks how many tickets she can buy with all $600."], "answer": 2, "why": "If she buys only tickets, she can buy $600 / $60 = 10. That is where her budget line meets the ticket axis. The other end, all dinners, is $600 / $40 = 15 dinners.", "key": "ch22-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Slope of the budget line", "stem": "A budget line is drawn with pizza on the horizontal axis and soda on the vertical axis. Its slope measures", "options": ["the price of pizza relative to the price of soda.", "the consumer's income.", "the rate at which the consumer is willing to trade soda for pizza.", "the consumer's total satisfaction."], "reasons": ["", "Income sets where the budget line sits, not its slope.", "The rate at which the consumer is willing to trade is the marginal rate of substitution, the slope of the indifference curve.", "The budget line shows what the consumer can afford, not how satisfied she is."], "answer": 0, "why": "The slope of the budget line is the rate at which the market lets the consumer trade one good for the other. Buying one more pizza means giving up soda worth the price of a pizza, so the slope equals the price of pizza divided by the price of soda.", "key": "ch22-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Indifference curves", "stem": "On a graph of two goods, a single indifference curve joins", "options": ["every bundle of goods the consumer can afford.", "bundles of goods that give the consumer the same level of satisfaction.", "combinations of the two goods' prices.", "the consumer's income at different dates."], "reasons": ["The bundles a consumer can afford are shown by the budget line.", "", "Prices set the slope of the budget line. An indifference curve reflects the consumer's preferences, not prices.", "An indifference curve compares bundles of goods at a moment in time. It says nothing about income."], "answer": 1, "why": "An indifference curve joins all the bundles of two goods that leave the consumer equally satisfied. Higher curves represent more satisfaction. The curves describe the consumer's preferences, separately from what she can afford.", "key": "ch22-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Normal and inferior goods", "stem": "When a consumer's income rises, she always buys more of every good.", "answer": false, "why": "She buys more of a normal good when her income rises, but less of an inferior good. Generic store-brand groceries are a common example of an inferior good: as income rises, some people switch to name brands.", "key": "ch22-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "The optimum", "stem": "At the consumer's best affordable bundle, her marginal rate of substitution equals the relative price of the two goods.", "answer": true, "why": "The best affordable bundle is where the budget line just touches the highest indifference curve it can reach. At that point the two have the same slope. The slope of the indifference curve is the marginal rate of substitution, and the slope of the budget line is the relative price, so the two are equal.", "key": "ch22-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Moving toward the optimum", "stem": "Coffee costs $4 and muffins cost $2. At her current bundle, a consumer would give up 3 muffins to get 1 more coffee and be just as well off. Spending the same total, she can become better off by", "options": ["buying more muffins and less coffee.", "keeping the same bundle, because she is already at her best bundle.", "spending less in total.", "buying more coffee and fewer muffins."], "reasons": ["She values a coffee at 3 muffins, but it costs only 2. Giving up coffee for muffins moves her the wrong way.", "She is at her best bundle only when her marginal rate of substitution equals the relative price. Here it is 3 against 2.", "The question holds her total spending fixed. Spending less would not make her better off.", ""], "answer": 3, "why": "Her marginal rate of substitution is 3 muffins per coffee: that is what a coffee is worth to her. The market price of a coffee is $4 / $2 = 2 muffins. Since a coffee is worth more to her than it costs, she gains by buying more coffee and fewer muffins. She keeps doing so until her marginal rate of substitution falls to 2.", "key": "ch22-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "The substitution effect", "stem": "The price of coffee falls while the prices of other goods stay the same. The substitution effect of this change", "options": ["makes the consumer buy less coffee.", "depends on whether coffee is a normal or an inferior good.", "makes the consumer buy more coffee, because coffee is now cheaper relative to other goods.", "is zero if the consumer's income does not change."], "reasons": ["The substitution effect of a lower price always leads the consumer toward the good that has become cheaper.", "Whether a good is normal or inferior decides the direction of the income effect, not the substitution effect.", "", "The substitution effect comes from the change in relative prices. It works even when income is unchanged."], "answer": 2, "why": "The substitution effect is the change in what the consumer buys because relative prices have changed, holding her satisfaction fixed. When coffee becomes cheaper relative to other goods, she moves along her indifference curve toward more coffee. It always works in that direction. The income effect, which depends on whether coffee is normal or inferior, comes on top.", "key": "ch22-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Inferior goods", "stem": "A worker's income rises, and she takes fewer bus rides, with prices unchanged. For her, bus rides are", "options": ["an inferior good.", "a normal good.", "a Giffen good.", "a luxury good."], "reasons": ["", "A normal good is one a person buys more of when income rises. She buys fewer bus rides.", "A Giffen good is defined by its response to its own price, not to income. Here only income has changed.", "A luxury is a normal good whose purchases rise faster than income. She buys fewer bus rides, not more."], "answer": 0, "why": "A good is inferior when a rise in income, with prices unchanged, lowers the quantity bought. She takes fewer bus rides as her income rises, perhaps because she can now afford to drive, so for her bus rides are an inferior good.", "key": "ch22-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Perfect complements", "stem": "A consumer always eats one hamburger patty with exactly one bun and has no use for an extra patty or an extra bun. Her indifference curves for patties and buns are", "options": ["straight lines.", "right angles.", "upward sloping.", "bowed outward from the origin."], "reasons": ["Straight-line indifference curves describe perfect substitutes, goods the consumer will swap at a fixed rate. Patties and buns are used together, not swapped.", "", "Indifference curves slope upward only if one good is unwanted. Here both are wanted, in fixed pairs.", "Bowed-outward curves would mean the consumer prefers extremes to mixtures. She uses the two goods only in pairs."], "answer": 1, "why": "Patties and buns are perfect complements here: one of each makes a burger, and an extra patty without a bun adds nothing. So 5 patties and 5 buns are as good as 7 patties and 5 buns. Each indifference curve has a corner at an equal number of each and runs straight out from it, which gives a right angle.", "key": "ch22-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Labor supply", "stem": "A rise in the hourly wage always leads people to work more hours.", "answer": false, "why": "A higher wage has two effects. The substitution effect raises hours worked, because each hour of leisure now costs more in lost pay. The income effect can lower hours worked, because a person who earns more may choose more leisure. If the income effect is the larger, a higher wage leads to fewer hours worked.", "key": "ch22-M5"}]}];
const app = document.getElementById("app");
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("ec111-practice") || "{}"); } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem("ec111-practice", JSON.stringify(v)); } catch(e){} }
};
let progress = store.get();
let pick = {chapters: new Set(), level: "Both"};
let run = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chosen(){
  const qs = [];
  for (const c of CHAPTERS) if (pick.chapters.has(c.chapter))
    for (const q of c.questions) if (pick.level === "Both" || q.difficulty === pick.level) qs.push({...q, chapter: c.chapter, name: c.label ? "Chapters " + c.label : "Chapter " + c.chapter});
  return qs.sort((a,b) => a.chapter - b.chapter || (a.difficulty === b.difficulty ? 0 : a.difficulty === "Easy" ? -1 : 1));
}
function home(){
  run = null;
  let h = `<h1>EC 111 Practice Questions</h1><p class="sub">Principles of Microeconomics. Choose the chapters and the level. Wrong answers come with an explanation; on multiple choice you get a second try first.</p><h2>Chapters</h2>`;
  for (const c of CHAPTERS){
    const tried = c.questions.filter(q => progress[q.key]).length;
    const first = c.questions.filter(q => progress[q.key] === "first").length;
    h += `<label class="row"><input type="checkbox" data-ch="${c.chapter}" ${pick.chapters.has(c.chapter) ? "checked" : ""}> <span><b>${c.label ? "Chapters " + esc(c.label) : "Chapter " + c.chapter}</b> ${esc(c.title)}</span><small>${tried} of ${c.questions.length} tried · ${first} right first time</small></label>`;
  }
  h += `<h2>Level</h2><div class="seg">` + ["Easy","Moderate","Both"].map(l => `<button data-lv="${l}" class="${pick.level === l ? "on" : ""}">${l}</button>`).join("") + `</div>`;
  const n = chosen().length;
  h += `<button class="go" id="start" ${n ? "" : "disabled"}>${n ? `Start · ${n} question${n === 1 ? "" : "s"}` : "Choose a chapter"}</button>`;
  h += `<p class="foot">Progress is saved in this browser only. <a href="#" id="reset">Clear my progress</a> · <a href="../">Back to the book</a></p>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-ch]").forEach(b => b.onchange = () => { const ch = +b.dataset.ch; b.checked ? pick.chapters.add(ch) : pick.chapters.delete(ch); home(); });
  app.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { pick.level = b.dataset.lv; home(); });
  document.getElementById("start").onclick = () => { run = {qs: chosen(), i: 0, firstRight: 0}; show(); };
  document.getElementById("reset").onclick = e => { e.preventDefault(); progress = {}; store.set(progress); home(); };
}
function show(){
  const q = run.qs[run.i];
  const opts = q.type === "mc" ? q.options : ["True","False"];
  let h = `<div class="meta"><span>${esc(q.name)} · ${q.difficulty} · ${q.type === "mc" ? "Multiple choice" : "True or false"}</span><span>${run.i + 1} of ${run.qs.length}</span></div>`;
  h += `<div class="stem">${esc(q.stem)}</div>`;
  if (q.table){
    h += `<table><tr>${q.table.header.map(x => `<th>${esc(x)}</th>`).join("")}</tr>`;
    for (const r of q.table.rows) h += `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`;
    h += `</table>`;
  }
  opts.forEach((o, k) => h += `<button class="opt" data-k="${k}"><span class="l">${q.type === "mc" ? "abcdefgh"[k] + "." : ""}</span>${esc(o)}</button>`);
  h += `<div id="fb"></div>`;
  app.innerHTML = h; window.scrollTo(0, 0);
  const right = q.type === "mc" ? q.answer : (q.answer ? 0 : 1);
  let tries = 0;
  const btns = [...app.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    const k = +b.dataset.k; tries++;
    const fb = document.getElementById("fb");
    if (k === right || q.type === "tf" || tries >= 2){
      btns.forEach(x => x.disabled = true);
      btns[right].classList.add("right");
      if (k !== right) b.classList.add("wrong");
      const first = k === right && tries === 1;
      if (first) run.firstRight++;
      if (!progress[q.key] || first) progress[q.key] = first ? "first" : "tried";
      store.set(progress);
      const last = run.i === run.qs.length - 1;
      fb.innerHTML = `<div class="msg ${k === right ? "good" : "bad"}">${k === right ? "Correct." : "Not correct. The answer is " + (q.type === "mc" ? "abcdefgh"[right] + "." : opts[right] + ".")}</div>${k !== right && q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : ""}<div class="why">${esc(q.why)}</div><div class="nav"><button id="quit">Back to chapters</button><button class="on" id="next">${last ? "See my score" : "Next question"}</button></div>`;
      document.getElementById("quit").onclick = home;
      document.getElementById("next").onclick = () => { if (last) done(); else { run.i++; show(); } };
    } else {
      b.classList.add("wrong"); b.disabled = true;
      const why = q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : "";
      fb.innerHTML = `<div class="msg bad">Not quite.</div>${why}<div class="msg">Try once more.</div>`;
    }
  });
}
function done(){
  app.innerHTML = `<h1>Finished</h1><p class="score">${run.firstRight} of ${run.qs.length} right first time</p><div class="nav"><button id="again">Same set again</button><button class="on" id="menu">Back to chapters</button></div>`;
  document.getElementById("again").onclick = () => { run.i = 0; run.firstRight = 0; show(); };
  document.getElementById("menu").onclick = home;
}
home();
</script></body></html>
