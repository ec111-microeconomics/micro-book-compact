<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EC 111 Practice Questions</title>
<style>
:root{--blue:#4866C7;--ink:#1E2430;--muted:#6A7280;--panel:#EEF1FA;--line:#D5DAE6;--good:#2E7D5B;--bad:#B3323C;--bg:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
.top{max-width:760px;margin:0 auto;padding:16px 16px 0;font-size:.95rem}
.top a{text-decoration:none}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
h2{font-size:1.1rem;margin:24px 0 8px}
label.row{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer}
label.row small{color:var(--muted);margin-left:auto;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto}
button{font:inherit;padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.go{background:var(--blue);border-color:var(--blue);color:#fff;width:100%;margin-top:20px;font-weight:bold}
button.go:disabled{opacity:.45;cursor:default}
.meta{color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.stem{margin:4px 0 14px}
table{border-collapse:collapse;margin:0 0 14px}
th,td{border:1px solid var(--line);padding:4px 12px;text-align:center}
th{background:var(--panel)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt .l{font-weight:bold;margin-right:8px}
.opt.wrong{border-color:var(--bad);background:#FBEDEE;color:var(--bad)}
.opt.right{border-color:var(--good);background:#EAF5EF;color:var(--good)}
.opt:disabled{cursor:default}
.msg{font-weight:bold;margin:10px 0}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.why{background:var(--panel);padding:12px 14px;border-radius:6px;margin:10px 0}
.nav{display:flex;gap:8px;margin-top:16px}
.nav button{flex:1}
.score{font-size:1.4rem;font-weight:bold;margin:8px 0}
a{color:var(--blue)}
.foot{color:var(--muted);font-size:.85rem;margin-top:32px}
</style></head>
<body><div class="top"><a href="https://ec111-microeconomics.github.io/">&larr; EC 111 home</a></div><main id="app"></main>
<script>
const CHAPTERS = [{"chapter": 11, "title": "Public Goods and Common Resources", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Rival in consumption", "stem": "Once a customer eats a sandwich bought from a deli, no one else can eat that same sandwich. This feature of the sandwich is called", "options": ["excludability.", "rivalry in consumption.", "the free-rider problem.", "a positive externality."], "answer": 1, "why": "A good is rival in consumption when one person's use of it leaves less for anyone else. A sandwich that has been eaten is gone, so it is rival. Excludability is a different property: whether people who do not pay can be kept from using the good. The free-rider problem arises when a good is not excludable, and a positive externality is a benefit to bystanders. Neither is a property of the sandwich itself.", "reasons": ["Excludability is about whether people who do not pay can be kept from using a good, not about whether one person's use leaves less for others.", "", "The free-rider problem arises when people cannot be kept from using a good. It is not a property of the sandwich.", "A positive externality is a benefit to bystanders. Eating a sandwich gives no benefit to anyone else."], "key": "ch11-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Public goods", "stem": "A radio station broadcasts a free weather forecast. Anyone with a radio can hear it, and one listener tuning in does not reduce what any other listener hears. The forecast is best classified as a", "options": ["private good.", "club good.", "common resource.", "public good."], "answer": 3, "why": "The forecast is not excludable, because anyone with a radio can hear it without paying. It is not rival, because one listener does not reduce what others hear. A good that is neither excludable nor rival is a public good. A private good is both excludable and rival, a club good is excludable but not rival, and a common resource is rival but not excludable.", "reasons": ["A private good is both excludable and rival. Anyone with a radio can hear this forecast, and one listener does not reduce what others hear.", "A club good is one that people who do not pay can be kept from using. Anyone with a radio can hear this forecast.", "A common resource is rival: one person's use leaves less for others. Here one listener does not reduce what anyone else hears.", ""], "key": "ch11-E2"}, {"id": "E3", "difficulty": "Easy", "type": "tf", "topic": "Club goods", "stem": "A video-streaming service that sells monthly subscriptions and has plenty of server capacity is an example of a common resource.", "answer": false, "why": "The service is excludable, because people who do not subscribe are shut out. With plenty of capacity it is not rival, because one more viewer does not slow anyone else down. A good that is excludable but not rival is a club good. A common resource is the opposite case: rival but not excludable.", "key": "ch11-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Common resources", "stem": "Tuna swimming in international waters, which any boat may fish, are a public good.", "answer": false, "why": "Any boat may fish international waters, so the tuna are not excludable. But a tuna caught by one boat cannot be caught by another, so the tuna are rival. A public good must be neither excludable nor rival. A good that is rival but not excludable is a common resource, which is what the tuna are.", "key": "ch11-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Free riders", "stem": "A homeowner who benefits from the streetlight on her block but refuses to contribute to the neighborhood fund that pays for it is a free rider.", "answer": true, "why": "A free rider is a person who receives the benefit of a good but avoids paying for it. The streetlight lights her block whether or not she contributes, because she cannot be excluded from its benefit. By refusing to pay, she gets the benefit for nothing, which is exactly what free riding means.", "key": "ch11-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Cost-benefit analysis", "stem": "Three residents would use a new footbridge over a creek. Dana values the bridge at $150, Eli at $90, and Fran at $60. No one else values it. All three can use the bridge at the same time without getting in each other's way. The bridge costs $250 to build. What should the town do?", "options": ["Build it only if each resident values it at $250 or more.", "Do not build it, because no single resident values it at more than $250.", "Build it, because the total benefit of $300 is greater than the cost of $250.", "Do not build it, because Fran values it at less than an equal one-third share of the cost."], "answer": 2, "why": "Because all three can use the bridge at the same time, the benefit to the town is the sum of their valuations, $150 + $90 + $60 = $300. That is greater than the $250 cost, so building it raises total surplus by $50. No single resident needs to value it above the full cost. How the cost is shared is a separate question; Fran's $60 being below an equal share of about $83.33 does not change whether the bridge is worth building.", "reasons": ["No single resident needs to value the bridge at its full cost. All three use the same bridge, so what matters is the total of their valuations.", "No single resident needs to value the bridge at more than its cost. All three use the same bridge, so what matters is the total of their valuations.", "", "How the cost is shared is a separate question from whether the bridge is worth building."], "key": "ch11-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Efficient quantity of a public good", "stem": "A small town has three residents, Ana, Ben, and Cara. All three benefit from every streetlight on their road. The table shows how much each would pay for each additional streetlight. Each streetlight costs $30 to install. How many streetlights maximize total surplus?", "table": {"header": ["Streetlight", "Ana", "Ben", "Cara"], "rows": [["1st", "$30", "$25", "$15"], ["2nd", "$20", "$15", "$10"], ["3rd", "$12", "$10", "$6"], ["4th", "$5", "$4", "$1"]]}, "options": ["1", "2", "3", "4"], "answer": 1, "why": "All three residents benefit from every light at once, so the value of each light is the sum of what all three residents would pay for it. The 1st light is worth $30 + $25 + $15 = $70, the 2nd $20 + $15 + $10 = $45, the 3rd $12 + $10 + $6 = $28, and the 4th $5 + $4 + $1 = $10. Install a light whenever its total value is at least its $30 cost. The 1st ($70) and 2nd ($45) pass; the 3rd ($28) does not. So 2 streetlights maximize total surplus. Comparing each person's value with the cost separately would wrongly give only 1.", "reasons": ["Comparing each resident's value with the $30 cost on its own ignores that all three benefit from the same light. Add their values for each light.", "", "The 3rd light is worth $12 + $10 + $6 = $28 to the three residents together, which is less than its $30 cost.", "The 4th light is worth only $5 + $4 + $1 = $10 to the three residents together, far below its $30 cost."], "key": "ch11-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Solving the Tragedy of the Commons", "stem": "Anyone may fish a large lake, and the fish stock is falling. The state caps the total catch and sells fishing permits; only permit holders may fish, up to the amount on their permit. Which property of the fish does the permit system change?", "options": ["It makes the fish excludable, because people without a permit may no longer fish.", "It makes the fish nonrival, because the total catch is capped.", "It turns the fish into a public good.", "It removes the externality by subsidizing fishing."], "answer": 0, "why": "Before the permits, anyone could fish, so the fish were not excludable; they were a common resource. The permits shut out anyone without one, which makes the fish excludable. The fish are still rival: a fish one permit holder catches cannot be caught by another, and capping the total does not change that. The fish therefore do not become nonrival or a public good, and a permit is a charge for access, not a subsidy.", "reasons": ["", "Capping the total catch does not make the fish nonrival. A fish caught by one permit holder still cannot be caught by another.", "A public good is not rival. With permits the fish are still rival, because each fish can be caught only once.", "A permit is a charge for access to the lake, not a subsidy."], "key": "ch11-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Public goods", "stem": "The total benefit to a town of a public good, such as a fireworks display, equals the largest amount any single resident would pay for it.", "answer": false, "why": "A public good is not rival, so every resident enjoys the same display at the same time. The total benefit is therefore the sum of what all residents would pay, not the largest single amount. This is why a public good can be worth providing even when no single person would pay its full cost.", "key": "ch11-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Tragedy of the Commons", "stem": "Anyone may fish a lake, which holds a limited stock of fish. When a fisher decides whether to add another boat, she ignores one cost of that decision. That cost is", "options": ["the price she receives for her fish.", "the cost of her own boat and fuel.", "the wages she pays her crew.", "the reduction in the catch of the other boats."], "answer": 3, "why": "The fish are a common resource: rival but not excludable. When she adds a boat, she counts her own costs and her own extra catch. She does not count the fish that the other boats now fail to catch. That loss falls on other people, so it is a negative externality, and because every fisher ignores it, the lake is overfished. This is the Tragedy of the Commons. The price of fish, her boat and fuel, and her crew's wages are all things she does take into account.", "reasons": ["The price she receives is part of her own revenue, and she takes it into account.", "The cost of her own boat and fuel falls on her, and she takes it into account.", "She pays her crew's wages herself, so she takes them into account.", ""], "key": "ch11-M5"}]}, {"chapter": 14, "title": "The Costs of Production", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Explicit and implicit costs", "stem": "A dentist owns her office building outright and runs her practice in it. Which of the following is an implicit cost of her practice?", "options": ["The salaries she pays her dental hygienists", "The rent she could earn by leasing the building to another firm", "The cost of dental supplies", "The practice's electricity bill"], "answer": 1, "why": "An implicit cost is an opportunity cost that does not require the firm to pay out money. By using the building herself, the dentist gives up the rent another firm would pay her for it, but she writes no check for it. Salaries, supplies and electricity are all paid out in money, so they are explicit costs.", "reasons": ["Salaries are paid out in money, so they are an explicit cost.", "", "Dental supplies are paid for in money, so they are an explicit cost.", "The electricity bill is paid in money, so it is an explicit cost."], "key": "ch14-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Fixed and variable costs", "stem": "A bakery pays each month for flour, the wages of hourly counter staff, electricity to run its ovens, and the lease on its shop. Which of these is a fixed cost?", "options": ["The flour", "The wages of hourly counter staff", "The electricity to run its ovens", "The lease on its shop"], "answer": 3, "why": "A fixed cost does not change with the quantity of output. The lease is the same whether the bakery bakes 100 loaves a month or 10,000. Flour, hourly wages and oven electricity all rise as the bakery produces more, so they are variable costs.", "reasons": ["The bakery uses more flour when it bakes more, so flour is a variable cost.", "Hourly staff are paid for the hours they work, and those hours rise with output, so their wages are a variable cost.", "The ovens use more electricity when the bakery bakes more, so this is a variable cost.", ""], "key": "ch14-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Marginal product", "stem": "A print shop produces 240 posters a day with 4 workers and 285 posters a day with 5 workers. The marginal product of the fifth worker is", "options": ["45 posters.", "57 posters.", "60 posters.", "285 posters."], "answer": 0, "why": "The marginal product of a worker is the increase in output from hiring that worker: 285 − 240 = 45 posters. 57 posters is output per worker with five workers (285 ÷ 5), and 60 is output per worker with four (240 ÷ 4); both are averages, not the change. 285 is total output.", "reasons": ["", "57 is total output divided by five workers (285 ÷ 5). That is output per worker, not the extra output the fifth worker adds.", "60 is 240 ÷ 4, output per worker with four workers. It is not the change in output.", "285 is total output with five workers, not the extra output the fifth worker adds."], "key": "ch14-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Average fixed cost", "stem": "A gym pays $6,000 a month for its lease. If its membership doubles from 300 to 600, the lease cost per member halves, from $20 to $10.", "answer": true, "why": "The lease is a fixed cost: it stays $6,000 a month however many members the gym has. Cost per member is $6,000 ÷ 300 = $20 with 300 members and $6,000 ÷ 600 = $10 with 600, so it halves. This is average fixed cost, and it always falls as output rises because the same fixed cost is spread over more units.", "key": "ch14-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Economic and accounting profit", "stem": "A firm can have a positive accounting profit and a negative economic profit at the same time.", "answer": true, "why": "Accounting profit subtracts only explicit costs from total revenue. Economic profit subtracts both explicit and implicit costs, such as the salary the owner gave up. If the implicit costs are larger than the accounting profit, the economic profit is negative even though the accounting profit is positive.", "key": "ch14-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Economic profit", "stem": "Priya leaves a job that paid $90,000 a year to run her own consulting firm. She starts the firm with $50,000 of her own savings, which would otherwise have earned 4 percent a year. In its first year the firm takes in $210,000 of revenue and pays $85,000 in rent, staff wages and software. What is the firm's economic profit for the year?", "options": ["$125,000", "$35,000", "$123,000", "$33,000"], "answer": 3, "why": "Economic profit is total revenue minus explicit and implicit costs. Explicit costs are $85,000, so accounting profit is $210,000 − $85,000 = $125,000. Implicit costs are the $90,000 salary she gave up plus the interest her savings would have earned, 4% × $50,000 = $2,000, for a total of $92,000. Economic profit is $125,000 − $92,000 = $33,000. $125,000 ignores the implicit costs, $35,000 leaves out the forgone interest, and $123,000 leaves out the forgone salary.", "reasons": ["$125,000 is accounting profit. It leaves out the implicit costs: the salary and the interest she gave up.", "$35,000 subtracts the $90,000 salary she gave up but leaves out the interest her savings would have earned.", "$123,000 subtracts the forgone interest but leaves out the $90,000 salary she gave up.", ""], "key": "ch14-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Average total cost", "stem": "The table shows a firm's total cost at each level of output. At which quantity is average total cost lowest?", "table": {"header": ["Output (units)", "Total cost"], "rows": [["0", "$100"], ["1", "$140"], ["2", "$170"], ["3", "$210"], ["4", "$270"], ["5", "$350"]]}, "options": ["2 units", "3 units", "4 units", "5 units"], "answer": 2, "why": "Average total cost is total cost divided by output: $140 at 1 unit, $170 ÷ 2 = $85 at 2 units, $210 ÷ 3 = $70 at 3 units, $270 ÷ 4 = $67.50 at 4 units, and $350 ÷ 5 = $70 at 5 units. The lowest is $67.50, at 4 units. The marginal costs confirm it. The 4th unit costs $270 − $210 = $60, which is below the $70 average at 3 units, so the average falls. The 5th unit costs $350 − $270 = $80, which is above the $67.50 average at 4 units, so the average rises.", "reasons": ["At 2 units average total cost is $170 ÷ 2 = $85, and it is lower at another output.", "At 3 units average total cost is $210 ÷ 3 = $70, and it is lower at another output.", "", "At 5 units average total cost is $350 ÷ 5 = $70, and it is lower at another output."], "key": "ch14-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Marginal cost and average total cost", "stem": "Producing 20 units costs a firm $300 in total, an average of $15 a unit. Making a 21st unit adds $12 to total cost. With 21 units, the firm's average total cost", "options": ["rises above $15.", "falls below $15.", "stays at exactly $15.", "falls to $12."], "answer": 1, "why": "Total cost at 20 units is 20 × $15 = $300. Adding the 21st unit at $12 makes total cost $312, so average total cost is $312 ÷ 21 ≈ $14.86, which is below $15. The general rule: when marginal cost is below average total cost, producing one more unit pulls the average down. It does not fall all the way to $12, because the $12 unit is averaged with the 20 units that came before it.", "reasons": ["The 21st unit costs $12, less than the $15 average, so adding it cannot raise the average.", "", "The average stays the same only if the extra unit costs exactly the average, $15. This one costs $12.", "The $12 unit is averaged with the 20 units already made, so the average does not fall all the way to $12."], "key": "ch14-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Diminishing marginal product", "stem": "A restaurant hires a sixth cook and its meals served per night rise, but by less than they rose when it hired the fifth cook. The restaurant's total output must therefore be falling.", "answer": false, "why": "The sixth cook still adds to output, because meals served rise. What falls is the marginal product: the sixth cook adds fewer meals than the fifth did. That is diminishing marginal product. Total output keeps rising as long as marginal product is positive; it falls only if an extra cook adds a negative amount.", "key": "ch14-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Economies of scale", "stem": "In the long run, a furniture maker's total cost is $40,000 to make 100 tables and $72,000 to make 200 tables. Over this range of output, the firm has", "options": ["economies of scale, because long-run average total cost falls from $400 to $360 per table.", "diseconomies of scale, because long-run total cost rises from $40,000 to $72,000.", "constant returns to scale, because output doubles.", "diseconomies of scale, because the extra 100 tables add $32,000 to total cost."], "answer": 0, "why": "Economies of scale are judged by long-run average total cost, not total cost. Average cost is $40,000 ÷ 100 = $400 per table at 100 tables and $72,000 ÷ 200 = $360 per table at 200 tables. Average cost falls as output rises, so the firm has economies of scale. Total cost always rises when output rises, so a rising total cost says nothing about scale. Constant returns would require average cost to stay the same, which it does not.", "reasons": ["", "Scale is judged by average cost, not total cost. Total cost always rises when output rises.", "Constant returns would need average cost to stay the same. Compare $40,000 ÷ 100 with $72,000 ÷ 200.", "The extra 100 tables cost $32,000 ÷ 100 = $320 each, less than the $400 average before, so they pull the average down, not up."], "key": "ch14-M5"}]}];
const app = document.getElementById("app");
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("ec111-practice") || "{}"); } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem("ec111-practice", JSON.stringify(v)); } catch(e){} }
};
let progress = store.get();
let pick = {chapters: new Set(CHAPTERS.map(c => c.chapter)), level: "Both"};
let run = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chosen(){
  const qs = [];
  for (const c of CHAPTERS) if (pick.chapters.has(c.chapter))
    for (const q of c.questions) if (pick.level === "Both" || q.difficulty === pick.level) qs.push({...q, chapter: c.chapter});
  return qs.sort((a,b) => a.chapter - b.chapter || (a.difficulty === b.difficulty ? 0 : a.difficulty === "Easy" ? -1 : 1));
}
function home(){
  run = null;
  let h = `<h1>EC 111 Practice Questions</h1><p class="sub">Principles of Microeconomics. Choose the chapters and the level. Wrong answers come with an explanation; on multiple choice you get a second try first.</p><h2>Chapters</h2>`;
  for (const c of CHAPTERS){
    const tried = c.questions.filter(q => progress[q.key]).length;
    const first = c.questions.filter(q => progress[q.key] === "first").length;
    h += `<label class="row"><input type="checkbox" data-ch="${c.chapter}" ${pick.chapters.has(c.chapter) ? "checked" : ""}> <span><b>Chapter ${c.chapter}</b> ${esc(c.title)}</span><small>${tried} of ${c.questions.length} tried · ${first} right first time</small></label>`;
  }
  h += `<h2>Level</h2><div class="seg">` + ["Easy","Moderate","Both"].map(l => `<button data-lv="${l}" class="${pick.level === l ? "on" : ""}">${l}</button>`).join("") + `</div>`;
  const n = chosen().length;
  h += `<button class="go" id="start" ${n ? "" : "disabled"}>Start · ${n} question${n === 1 ? "" : "s"}</button>`;
  h += `<p class="foot">Progress is saved in this browser only. <a href="#" id="reset">Clear my progress</a> · <a href="../">Back to the book</a></p>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-ch]").forEach(b => b.onchange = () => { const ch = +b.dataset.ch; b.checked ? pick.chapters.add(ch) : pick.chapters.delete(ch); home(); });
  app.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { pick.level = b.dataset.lv; home(); });
  document.getElementById("start").onclick = () => { run = {qs: chosen(), i: 0, firstRight: 0}; show(); };
  document.getElementById("reset").onclick = e => { e.preventDefault(); progress = {}; store.set(progress); home(); };
}
function show(){
  const q = run.qs[run.i];
  const opts = q.type === "mc" ? q.options : ["True","False"];
  let h = `<div class="meta"><span>Chapter ${q.chapter} · ${q.difficulty} · ${q.type === "mc" ? "Multiple choice" : "True or false"}</span><span>${run.i + 1} of ${run.qs.length}</span></div>`;
  h += `<div class="stem">${esc(q.stem)}</div>`;
  if (q.table){
    h += `<table><tr>${q.table.header.map(x => `<th>${esc(x)}</th>`).join("")}</tr>`;
    for (const r of q.table.rows) h += `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`;
    h += `</table>`;
  }
  opts.forEach((o, k) => h += `<button class="opt" data-k="${k}"><span class="l">${q.type === "mc" ? "abcdefgh"[k] + "." : ""}</span>${esc(o)}</button>`);
  h += `<div id="fb"></div>`;
  app.innerHTML = h; window.scrollTo(0, 0);
  const right = q.type === "mc" ? q.answer : (q.answer ? 0 : 1);
  let tries = 0;
  const btns = [...app.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    const k = +b.dataset.k; tries++;
    const fb = document.getElementById("fb");
    if (k === right || q.type === "tf" || tries >= 2){
      btns.forEach(x => x.disabled = true);
      btns[right].classList.add("right");
      if (k !== right) b.classList.add("wrong");
      const first = k === right && tries === 1;
      if (first) run.firstRight++;
      if (!progress[q.key] || first) progress[q.key] = first ? "first" : "tried";
      store.set(progress);
      const last = run.i === run.qs.length - 1;
      fb.innerHTML = `<div class="msg ${k === right ? "good" : "bad"}">${k === right ? "Correct." : "Not correct. The answer is " + (q.type === "mc" ? "abcdefgh"[right] + "." : opts[right] + ".")}</div>${k !== right && q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : ""}<div class="why">${esc(q.why)}</div><div class="nav"><button id="quit">Back to chapters</button><button class="on" id="next">${last ? "See my score" : "Next question"}</button></div>`;
      document.getElementById("quit").onclick = home;
      document.getElementById("next").onclick = () => { if (last) done(); else { run.i++; show(); } };
    } else {
      b.classList.add("wrong"); b.disabled = true;
      const why = q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : "";
      fb.innerHTML = `<div class="msg bad">Not quite.</div>${why}<div class="msg">Try once more.</div>`;
    }
  });
}
function done(){
  app.innerHTML = `<h1>Finished</h1><p class="score">${run.firstRight} of ${run.qs.length} right first time</p><div class="nav"><button id="again">Same set again</button><button class="on" id="menu">Back to chapters</button></div>`;
  document.getElementById("again").onclick = () => { run.i = 0; run.firstRight = 0; show(); };
  document.getElementById("menu").onclick = home;
}
home();
</script></body></html>
