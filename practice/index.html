s": [["$10", "1"], ["$9", "2"], ["$8", "3"], ["$7", "4"], ["$6", "5"]]}, "options": ["$5", "$9", "$8", "$7"], "reasons": ["$5 is the marginal cost. A monopolist charges more than marginal cost, and at $5 it would earn no profit.", "At $9 the firm sells 2 units. The 3rd unit adds $24 − $18 = $6 to revenue and only $5 to cost, so selling it raises profit.", "", "At $7 the firm sells 4 units. The 4th unit adds only $28 − $24 = $4 to revenue but $5 to cost, so selling it lowers profit."], "answer": 2, "why": "Total revenue is $10, $18, $24, $28 and $30, so marginal revenue is $10, $8, $6, $4 and $2. The firm sells each unit whose marginal revenue is at least the $5 marginal cost: units 1 to 3. To sell 3 units it charges $8. Profit is $24 − $15 = $9, higher than at 2 units ($18 − $10 = $8) or 4 units ($28 − $20 = $8).", "key": "ch16-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Welfare cost of monopoly", "stem": "Compared with a competitive market with the same costs, a profit-maximizing monopoly", "options": ["produces less, charges more, and causes a deadweight loss.", "produces more and charges less.", "produces the same quantity but charges more, so there is no deadweight loss.", "produces less, but total surplus is unchanged because the monopolist's profit makes up for buyers' loss."], "reasons": ["", "A monopolist restricts output to keep its price up, so it produces less and charges more, not the reverse.", "A monopolist does not produce the competitive quantity. It stops where marginal revenue equals marginal cost, which is a smaller quantity.", "The profit is only part of what buyers lose. The units that are no longer produced were worth more to buyers than they cost, and that surplus is lost to everyone."], "answer": 0, "why": "A monopolist produces where marginal revenue equals marginal cost, which is less than the quantity where demand meets marginal cost. It then charges a price above marginal cost. Units that buyers value above their venue is $528 − $500 = $28. Put another way, the firm gains $48 from the 11th unit but loses $2 on each of the first 10 units: $48 − $20 = $28.", "key": "ch16-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Welfare cost of monopoly", "stem": "The main social cost of monopoly is that the monopolist's profit takes surplus away from consumers.", "answer": false, "why": "The profit moves surplus from buyers to the firm's owners. It does not shrink total surplus. The social cost of monopoly is the deadweight loss: the monopolist produces too little, so units that buyers value above their cost are never produced.", "key": "ch16-M5"}]}, {"chapter": 17, "title": "Monopolistic Competition", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Market structures", "stem": "Many sellers, differentiated products and free entry: which market below has all three?", "options": ["Wheat, sold by thousands of farmers", "Tap water in a city, supplied by one company", "Restaurants in a large city, each with a somewhat different menu", "Commercial jet aircraft, built by two large firms"], "reasons": ["Wheat is an identical product sold by many sellers, which makes it perfect competition.", "A single supplier is a monopoly.", "", "A market with only a few sellers is an oligopoly."], "answer": 2, "why": "Monopolistic competition has many sellers, products that are similar but not identical, and free entry. City restaurants fit: there are many of them, each offers something a little different, and new ones can open.", "key": "ch17-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "The firm's demand curve", "stem": "The demand curve facing a single firm in monopolistic competition", "options": ["slopes downward, because its product differs from its rivals' products.", "is horizontal at the market price.", "is vertical.", "slopes upward."], "reasons": ["", "A horizontal demand curve belongs to a competitive firm selling an identical product. A firm with a differentiated product keeps some customers when it raises its price.", "A vertical demand curve would mean buyers purchase the same amount at any price. Customers buy less from the firm when it raises its price.", "Demand curves slope down: buyers purchase less at a higher price."], "answer": 0, "why": "Each firm sells a product that is somewhat different from its rivals' products. If it raises its price, some customers switch to rivals, but others stay. So it sells less at a higher price, without losing all its sales: its demand curve slopes downward.", "key": "ch17-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Long-run equilibrium", "stem": "In the long run, economic profit falls to zero for firms selling differentiated products under monopolistic competition because", "options": ["the government regulates their prices.", "new firms enter when there are profits, and firms leave when there are losses.", "each firm produces at its efficient scale.", "the firms agree to keep their prices low."], "reasons": ["Prices in monopolistic competition are set by the firms, not by the government.", "", "Firms in monopolistic competition produce below their efficient scale, not at it. Zero profit comes from entry and exit.", "Agreements to fix prices are illegal, and with many firms they would be hard to keep. Zero profit comes from entry and exit."], "answer": 1, "why": "Profits attract new firms, which take customers away and shift each firm's demand curve to the left. Losses lead firms to leave, which shifts the remaining firms' demand curves to the right. Entry and exit stop only when price equals average total cost, so profit is zero.", "key": "ch17-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Profit maximization", "stem": "A firm in monopolistic competition chooses the quantity at which marginal revenue equals marginal cost.", "answer": true, "why": "Like a monopolist, the firm faces a downward-sloping demand curve. It raises its profit by producing each unit that adds more to revenue than to cost, so it stops where marginal revenue equals marginal cost. It then charges the price its demand curve allows for that quantity.", "key": "ch17-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Markup", "stem": "In the long run, entry under monopolistic competition pushes each firm's price down until it matches the extra cost of producing one more unit.", "answer": false, "why": "The firm's demand curve slopes downward, so its marginal revenue is less than its price. It produces where marginal revenue equals marginal cost, so its price is above marginal cost. That gap is the markup, and it remains in the long run.", "key": "ch17-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Excess capacity", "stem": "Under monopolistic competition, where does a typical firm's output sit in the long run?", "options": ["at its efficient scale, where average total cost is lowest.", "more than its efficient scale.", "where price equals marginal cost.", "less than its efficient scale, where average total cost is still falling."], "reasons": ["Producing at the efficient scale happens in a competitive market. Here the firm stops short of it.", "The firm's downward-sloping demand curve touches average total cost where that curve is still falling, so it produces less, not more.", "The firm charges a markup, so its price is above marginal cost.", ""], "answer": 3, "why": "In the long run, profit is zero, so the firm's demand curve just touches its average-total-cost curve. Because the demand curve slopes downward, the point where they touch is on the falling part of the average-total-cost curve. The firm therefore produces less than its efficient scale. This is called excess capacity.", "key": "ch17-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Markup from a table", "stem": "A firm in monopolistic competition faces the demand shown in the table. Each ising makes markets more competitive?", "options": ["Advertising builds brand loyalty, so demand for each firm's product becomes less elastic.", "Advertising tells buyers about prices and about new firms, so firms find it harder to charge high markups.", "Advertising adds to firms' costs, so it raises prices.", "Advertising persuades buyers that products differ when in fact they do not."], "reasons": ["Making demand less elastic lets firms raise their markups. This is the critics' view of advertising.", "", "This is a criticism of advertising: it says advertising raises prices, not that it promotes competition.", "This is the critics' view: advertising creates the impression of differences between products, which weakens competition."], "answer": 1, "why": "Defenders of advertising argue that it gives buyers information about prices, products and new sellers. Better-informed buyers can find the best deal, and new firms can attract customers. Demand for each firm becomes more elastic, and markups fall. The other three statements are the critics' case.", "key": "ch17-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Markup", "stem": "In long-run equilibrium, a firm in monopolistic competition would raise its profit if one more customer came along willing to pay its current price.", "answer": true, "why": "The firm's price is above its marginal cost. A customer who pays the current price therefore brings in more than the cost of serving her, so profit rises. A competitive firm, whose price equals marginal cost, would gain nothing from such a customer.", "key": "ch17-M5"}]}];
const app = document.getElementById("app");
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("ec111-practice") || "{}"); } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem("ec111-practice", JSON.stringify(v)); } catch(e){} }
};
let progress = store.get();
let pick = {chapters: new Set(), level: "Both"};
let run = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chosen(){
  const qs = [];
  for (const c of CHAPTERS) if (pick.chapters.has(c.chapter))
    for (const q of c.questions) if (pick.level === "Both" || q.difficulty === pick.level) qs.push({...q, chapter: c.chapter});
  return qs.sort((a,b) => a.chapter - b.chapter || (a.difficulty === b.difficulty ? 0 : a.difficulty === "Easy" ? -1 : 1));
}
function home(){
  run = null;
  let h = `<h1>EC 111 Practice Questions</h1><p class="sub">Principles of Microeconomics. Choose the chapters and the level. Wrong answers come with an explanation; on multiple choice you get a second try first.</p><h2>Chapters</h2>`;
  for (const c of CHAPTERS){
    const tried = c.questions.filter(q => progress[q.key]).length;
    const first = c.questions.filter(q => progress[q.key] === "first").length;
    h += `<label class="row"><input type="checkbox" data-ch="${c.chapter}" ${pick.chapters.has(c.chapter) ? "checked" : ""}> <span><b>Chapter ${c.chapter}</b> ${esc(c.title)}</span><small>${tried} of ${c.questions.length} tried · ${first} right first time</small></label>`;
  }
  h += `<h2>Level</h2><div class="seg">` + ["Easy","Moderate","Both"].map(l => `<button data-lv="${l}" class="${pick.level === l ? "on" : ""}">${l}</button>`).join("") + `</div>`;
  const n = chosen().length;
  h += `<button class="go" id="start" ${n ? "" : "disabled"}>${n ? `Start · ${n} question${n === 1 ? "" : "s"}` : "Choose a chapter"}</button>`;
  h += `<p class="foot">Progress is saved in this browser only. <a href="#" id="reset">Clear my progress</a> · <a href="../">Back to the book</a></p>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-ch]").forEach(b => b.onchange = () => { const ch = +b.dataset.ch; b.checked ? pick.chapters.add(ch) : pick.chapters.delete(ch); home(); });
  app.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { pick.level = b.dataset.lv; home(); });
  document.getElementById("start").onclick = () => { run = {qs: chosen(), i: 0, firstRight: 0}; show(); };
  document.getElementById("reset").onclick = e => { e.preventDefault(); progress = {}; store.set(progress); home(); };
}
function show(){
  const q = run.qs[run.i];
  const opts = q.type === "mc" ? q.options : ["True","False"];
  let h = `<div class="meta"><span>Chapter ${q.chapter} · ${q.difficulty} · ${q.type === "mc" ? "Multiple choice" : "True or false"}</span><span>${run.i + 1} of ${run.qs.length}</span></div>`;
  h += `<div class="stem">${esc(q.stem)}</div>`;
  if (q.table){
    h += `<table><tr>${q.table.header.map(x => `<th>${esc(x)}</th>`).join("")}</tr>`;
    for (const r of q.table.rows) h += `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`;
    h += `</table>`;
  }
  opts.forEach((o, k) => h += `<button class="opt" data-k="${k}"><span class="l">${q.type === "mc" ? "abcdefgh"[k] + "." : ""}</span>${esc(o)}</button>`);
  h += `<div id="fb"></div>`;
  app.innerHTML = h; window.scrollTo(0, 0);
  const right = q.type === "mc" ? q.answer : (q.answer ? 0 : 1);
  let tries = 0;
  const btns = [...app.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    const k = +b.dataset.k; tries++;
    const fb = document.getElementById("fb");
    if (k === right || q.type === "tf" || tries >= 2){
      btns.forEach(x => x.disabled = true);
      btns[right].classList.add("right");
      if (k !== right) b.classList.add("wrong");
      const first = k === right && tries === 1;
      if (first) run.firstRight++;
      if (!progress[q.key] || first) progress[q.key] = first ? "first" : "tried";
      store.set(progress);
      const last = run.i === run.qs.length - 1;
      fb.innerHTML = `<div class="msg ${k === right ? "good" : "bad"}">${k === right ? "Correct." : "Not correct. The answer is " + (q.type === "mc" ? "abcdefgh"[right] + "." : opts[right] + ".")}</div>${k !== right && q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : ""}<div class="why">${esc(q.why)}</div><div class="nav"><button id="quit">Back to chapters</button><button class="on" id="next">${last ? "See my score" : "Next question"}</button></div>`;
      document.getElementById("quit").onclick = home;
      document.getElementById("next").onclick = () => { if (last) done(); else { run.i++; show(); } };
    } else {
      b.classList.add("wrong"); b.disabled = true;
      const why = q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : "";
      fb.innerHTML = `<div class="msg bad">Not quite.</div>${why}<div class="msg">Try once more.</div>`;
    }
  });
}
function done(){
  app.innerHTML = `<h1>Finished</h1><p class="score">${run.firstRight} of ${run.qs.length} right first time</p><div class="nav"><button id="again">Same set again</button><button class="on" id="menu">Back to chapters</button></div>`;
  document.getElementById("again").onclick = () => { run.i = 0; run.firstRight = 0; show(); };
  document.getElementById("menu").onclick = home;
}
home();
</script></body></html>
