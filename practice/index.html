<title>EC 111 Practice Questions</title>
<style>
:root{--blue:#4866C7;--ink:#1E2430;--muted:#6A7280;--panel:#EEF1FA;--line:#D5DAE6;--good:#2E7D5B;--bad:#B3323C;--bg:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
.top{max-width:760px;margin:0 auto;padding:16px 16px 0;font-size:.95rem}
.top a{text-decoration:none}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
h2{font-size:1.1rem;margin:24px 0 8px}
label.row{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer}
label.row small{color:var(--muted);margin-left:auto;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto}
button{font:inherit;padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.go{background:var(--blue);border-color:var(--blue);color:#fff;width:100%;margin-top:20px;font-weight:bold}
button.go:disabled{opacity:.45;cursor:default}
.meta{color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.stem{margin:4px 0 14px}
table{border-collapse:collapse;margin:0 0 14px}
th,td{border:1px solid var(--line);padding:4px 12px;text-align:center}
th{background:var(--panel)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt .l{font-weight:bold;margin-right:8px}
.opt.wrong{border-color:var(--bad);background:#FBEDEE;color:var(--bad)}
.opt.right{border-color:var(--good);background:#EAF5EF;color:var(--good)}
.opt:disabled{cursor:default}
.msg{font-weight:bold;margin:10px 0}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.why{background:var(--panel);padding:12px 14px;border-radius:6px;margin:10px 0}
.nav{display:flex;gap:8px;margin-top:16px}
.nav button{flex:1}
.score{font-size:1.4rem;font-weight:bold;margin:8px 0}
a{color:var(--blue)}
.foot{color:var(--muted);font-size:.85rem;margin-top:32px}
</style></head>

<script>
const CHAPTERS = [{"chapter": 1, "label": "1–2", "title": "Ten Principles of Economics; Thinking Like an Economist", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Opportunity cost", "stem": "A manager turns down a consulting job that would pay $8,000 so that she can take a two-week course. The course fee is $2,000. What is the opportunity cost of taking the course?", "options": ["$10,000", "$2,000", "$8,000", "$6,000"], "reasons": ["", "$2,000 counts only the fee. She also gives up the $8,000 she would have earned.", "$8,000 counts only the lost earnings. She also pays the $2,000 fee.", "$6,000 subtracts the fee from the lost earnings. Both are costs of the course, so they are added."], "answer": 0, "why": "The opportunity cost of an action is everything given up to take it. Taking the course costs her the $2,000 fee and the $8,000 she would have earned from the consulting job. The opportunity cost is $2,000 + $8,000 = $10,000.", "key": "ch1-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Positive and normative statements", "stem": "A city council member says, \"The city ought to spend more on public parks.\" An economist would classify this statement as", "options": ["positive, because it can be tested with data.", "normative, because it says what policy should be.", "positive, because a public official made it.", "macroeconomic, because it concerns government spending."], "reasons": ["No data can show what the city ought to do. Tests with data apply to positive claims about cause and effect.", "", "Who makes a statement does not decide whether it is positive or normative. Its content does.", "The statement is about one city's budget, and it is a value judgment. Being about government does not make it macroeconomic."], "answer": 1, "why": "A positive statement describes how the world is and can be tested against evidence. A normative statement says how the world ought to be and rests on values. \"The city ought to spend more\" is a recommendation, so it is normative.", "key": "ch1-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Thinking at the margin", "stem": "A software firm is deciding whether to hire one more engineer. Thinking at the margin, it should hire her only if", "options": ["its total revenue exceeds its total costs.", "the extra revenue she brings in exceeds the extra cost of employing her.", "she will work for free.", "rival firms are also hiring engineers."], "reasons": ["Total revenue and total cost describe the whole firm. The decision about one more engineer turns on what she adds to revenue and to cost.", "", "Firms hire people who cost money all the time, provided the extra revenue is larger than the extra cost.", "What rivals do is not the test. The test is what this hire adds to revenue and to cost."], "answer": 1, "why": "Rational decision makers think at the margin. The firm compares the extra revenue the engineer brings in with the extra cost of employing her, and hires her only if the revenue is larger.", "key": "ch1-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "The production possibilities frontier", "stem": "An economy with idle factories and unemployed workers is producing at an efficient point.", "answer": false, "why": "With idle factories and unemployed workers, the economy is inside its production possibilities frontier. It could produce more of one good without producing less of the other. Efficient points lie on the frontier, where all resources are in use.", "key": "ch1-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "The production possibilities frontier", "stem": "As an economy moves workers from farming into car making, each additional car tends to cost more food than the last.", "answer": true, "why": "The first workers moved are those best suited to making cars, so each car costs little food. Later the economy must move workers who are better at farming, so each extra car costs more food. This rising opportunity cost is why the production possibilities frontier bows outward.", "key": "ch1-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Opportunity cost on the frontier", "stem": "An economy can produce either 100 tons of steel and no cars, or no steel and 50 cars. Its production possibilities frontier is a straight line between these points. What is the opportunity cost of one car?", "options": ["0.5 tons of steel", "50 tons of steel", "100 tons of steel", "2 tons of steel"], "reasons": ["0.5 tons is the wrong way round: it is the number of cars given up for each ton of steel.", "50 is the largest number of cars the economy can make, not the cost of one car.", "100 tons is all the steel the economy can make. That is the cost of all 50 cars, not of one.", ""], "answer": 3, "why": "Moving from all steel to all cars gives up 100 tons of steel to gain 50 cars. On a straight-line frontier the trade-off is the same everywhere, so each car costs 100 / 50 = 2 tons of steel.", "key": "ch1-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Shifts of the frontier", "stem": "Which event shifts an economy's production possibilities frontier outward?", "options": ["A fall in unemployment", "An advance in technology that raises output from the same resources", "A shift of workers from making cars to making steel", "A rise in the price of steel"], "reasons": ["Putting idle workers to work moves the economy from a point inside the frontier toward it. The frontier itself does not move.", "", "Moving workers between goods is a movement along the frontier, not a shift of it.", "A price change can change which point the economy chooses. It does not change what the economy is able to produce."], "answer": 1, "why": "The frontier shows the most the economy can produce with its resources and technology. An advance in technology lets the same resources produce more, so the whole frontier shifts outward.", "key": "ch1-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Incentives", "stem": "A state raises its tax on gasoline. Economists predict that people will drive less and buy more fuel-efficient cars. Which principle does this illustrate?", "options": ["Trade can make everyone better off.", "Markets are usually a good way to organize economic activity.", "People respond to incentives.", "Prices rise when the government prints too much money."], "reasons": ["The example involves no trade between parties. It is about how buyers react to a higher price.", "The prediction is about how people react to a tax, not about the merits of markets as a way of organizing activity.", "", "This principle is about inflation. The example concerns one tax raising one price."], "answer": 2, "why": "The tax raises the cost of driving. People change what they do when costs or benefits change, so they drive less and switch to cars that use less fuel. That is the principle that people respond to incentives.", "key": "ch1-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Microeconomics and macroeconomics", "stem": "An economist studies how a city's ban on short-term apartment rentals affects rents in that city. This is a question of", "options": ["microeconomics, because it concerns one market.", "macroeconomics, because it involves a government policy.", "macroeconomics, because rents affect inflation.", "neither, because it is a normative question."], "reasons": ["", "Many microeconomic questions involve government policy. What makes this one microeconomic is that it concerns one market.", "The question is about rents in one city's housing market, not about the economy-wide price level.", "Asking what a ban does to rents can be answered with evidence, so it is a positive question."], "answer": 0, "why": "Microeconomics studies how households and firms make decisions and how they interact in particular markets. The effect of a ban on rents in one city's housing market is a microeconomic question. Macroeconomics studies economy-wide outcomes such as inflation and unemployment.", "key": "ch1-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Trade-offs", "stem": "A country that is using all its labor and capital with the best available technology can produce more wheat only by producing less of something else.", "answer": true, "why": "A country using all its resources with the best technology is on its production possibilities frontier. To grow more wheat, it must move resources away from other goods, so their output falls. This is the trade-off the frontier shows.", "key": "ch1-M5"}]}, {"chapter": 3, "title": "Interdependence and the Gains from Trade", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Comparative advantage", "stem": "Two accountants share the work of an office. One of them holds a comparative advantage in preparing tax returns if", "options": ["she prepares returns faster than her colleague.", "preparing a return costs her less of her other work than it costs her colleague.", "she enjoys preparing returns more than her colleague does.", "clients pay her more for each return."], "reasons": ["Preparing returns faster is an absolute advantage. Comparative advantage compares opportunity costs.", "", "Enjoying a task does not define comparative advantage. It is about what she gives up to do the task.", "What clients pay does not define comparative advantage. It is about what she gives up to do the task."], "answer": 1, "why": "Comparative advantage compares opportunity costs. The accountant who gives up less of her other work to prepare a tax return has the comparative advantage in returns, whoever is faster.", "key": "ch3-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Absolute advantage", "stem": "A producer that can make a good using fewer inputs than another producer has", "options": ["a comparative advantage in that good.", "a lower opportunity cost of that good.", "no reason to trade.", "an absolute advantage in that good."], "reasons": ["Comparative advantage depends on opportunity cost, which also depends on how productive the producer is at other goods.", "Using fewer inputs does not guarantee a lower opportunity cost. That depends on what the inputs could produce instead.", "A producer with an absolute advantage can still gain from trade if its opportunity costs differ from its partner's.", ""], "answer": 3, "why": "Absolute advantage compares the inputs needed to produce a good. The producer that needs fewer inputs, or produces more with the same inputs, has the absolute advantage.", "key": "ch3-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Gains from trade", "stem": "Two countries trade, and each specializes in the good it produces at the lower opportunity cost. Compared with no trade,", "options": ["both countries can consume more, even if one is better at producing both goods.", "only the country that is better at producing both goods gains.", "one country's gain equals the other country's loss.", "neither gains unless both are equally productive."], "reasons": ["", "Both countries gain when each specializes in the good it makes at the lower opportunity cost.", "Specialization raises total output, so trade is not a contest in which one side's gain is the other's loss.", "Gains come from differences in opportunity costs. Equal productivity would remove them, not create them."], "answer": 0, "why": "When each producer specializes in the good with the lower opportunity cost, total output rises. Trading at a price between their opportunity costs lets each consume more than it could produce alone. This holds even when one producer is better at making both goods.", "key": "ch3-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Comparative advantage", "stem": "A person can have an absolute advantage in both of two goods, but cannot have a comparative advantage in both.", "answer": true, "why": "If a person's opportunity cost of one good is lower than another person's, then the opportunity cost of the other good, its inverse, is higher. So each person has a comparative advantage in at most one of the two goods, even though one person can be faster at both.", "key": "ch3-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Gains from trade", "stem": "If a country produces every good more efficiently than its trading partner, it cannot gain from trade.", "answer": false, "why": "Gains from trade come from differences in opportunity costs, not from absolute advantage. Even a country that is better at producing everything has a lower opportunity cost in only some goods. It gains by specializing in those and buying the others.", "key": "ch3-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Finding comparative advantage", "stem": "The table shows what two financial analysts can each produce in one hour. Who has the comparative advantage in writing reports, and why?", "table": {"header": ["Analyst", "Reports per hour", "Spreadsheets per hour"], "rows": [["Ana", "4", "8"], ["Ben", "1", "4"]]}, "options": ["Ben, because he is slower at both tasks.", "Ana, because she can produce more spreadsheets.", "Ana, because a report costs her 2 spreadsheets and costs Ben 4.", "Ben, because a report takes him a full hour."], "reasons": ["Being slower at both tasks says nothing about comparative advantage, which compares opportunity costs.", "Producing more spreadsheets is an absolute advantage in spreadsheets. It does not decide who has the comparative advantage in reports.", "", "A report taking Ben an hour is about time, not opportunity cost. In that hour he gives up 4 spreadsheets, more than Ana gives up."], "answer": 2, "why": "Ana's report costs her the 8 / 4 = 2 spreadsheets she could have made instead. Ben's report costs him 4 / 1 = 4 spreadsheets. Ana gives up less for each report, so she has the comparative advantage in reports.", "key": "ch3-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Opportunity cost", "stem": "The table shows what two financial analysts can each produce in one hour. What is Ben's opportunity cost of producing one spreadsheet?", "table": {"header": ["Analyst", "Reports per hour", "Spreadsheets per hour"], "rows": [["Ana", "4", "8"], ["Ben", "1", "4"]]}, "options": ["1/4 of a report", "4 reports", "1/2 of a report", "4 spreadsheets"], "reasons": ["", "4 reports is the wrong way round. Ben can make only 1 report an hour, so a spreadsheet cannot cost him 4.", "1/2 of a report is Ana's opportunity cost of a spreadsheet (4 / 8), not Ben's.", "4 spreadsheets is what Ben produces in an hour. The opportunity cost of one spreadsheet is measured in reports given up."], "answer": 0, "why": "In one hour Ben can make 4 spreadsheets or 1 report. Each spreadsheet therefore uses a quarter of an hour, which could have produced 1/4 of a report. His opportunity cost of a spreadsheet is 1/4 of a report, lower than Ana's 1/2, so he has the comparative advantage in spreadsheets.", "key": "ch3-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Terms of trade", "stem": "The table shows what two financial analysts can each produce in one hour. Ana specializes in reports and Ben in spreadsheets. At which price would trading reports for spreadsheets make both of them better off?", "table": {"header": ["Analyst", "Reports per hour", "Spreadsheets per hour"], "rows": [["Ana", "4", "8"], ["Ben", "1", "4"]]}, "options": ["1 spreadsheet per report", "2 spreadsheets per report", "5 spreadsheets per report", "3 spreadsheets per report"], "reasons": ["Ana gives up 2 spreadsheets to make a report. Selling it for 1 spreadsheet would leave her worse off.", "At 2 spreadsheets Ana receives exactly what a report costs her, so she gains nothing.", "Ben could make a report himself for 4 spreadsheets. Paying 5 would leave him worse off.", ""], "answer": 3, "why": "Both gain when the price lies between their opportunity costs of a report: 2 spreadsheets for Ana and 4 for Ben. At 3 spreadsheets per report, Ana receives more than the 2 a report costs her, and Ben pays less than the 4 it would cost him to make it himself.", "key": "ch3-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Specialization", "stem": "Specialization according to comparative advantage raises total output because", "options": ["each producer works longer hours.", "each good is produced by the producer whose opportunity cost of it is lowest.", "the producer with the absolute advantage makes every good.", "prices fall when producers specialize."], "reasons": ["Specialization raises output from the same hours of work. It does not require longer hours.", "", "If the producer with the absolute advantage made everything, the other producer's time would be wasted, and total output would be lower.", "Lower prices are not the source of the gain. The gain comes from producing each good where it costs least in other goods."], "answer": 1, "why": "When each good is made by the producer who gives up the least to make it, the same resources yield more output in total. Trade then shares that larger output between the producers.", "key": "ch3-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Gains from trade", "stem": "A producer with no absolute advantage in any good has nothing to gain from trade.", "answer": false, "why": "A producer that is slower at everything still has a lower opportunity cost in some good, and so a comparative advantage in it. By specializing in that good and trading, it can consume more than it could produce alone, and so can its trading partner.", "key": "ch3-M5"}]}, {"chapter": 4, "title": "The Market Forces of Supply and Demand", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Movement along the demand curve", "stem": "The price of a movie ticket falls from $15 to $12, and nothing else changes. Moviegoers buy more tickets. On a graph of the ticket market, this is", "options": ["a rightward shift of the demand curve for tickets.", "a leftward shift of the demand curve for tickets.", "a movement down along the demand curve for tickets.", "a leftward shift of the supply curve for tickets."], "reasons": ["A change in the ticket's own price does not shift the demand curve. Shifts come from other factors, such as income or the prices of related goods.", "A change in the ticket's own price does not shift the demand curve.", "", "Nothing has changed sellers' costs, so the supply curve has not shifted."], "answer": 2, "why": "The demand curve shows the quantity demanded at each price. A change in the good's own price moves buyers along the curve. A lower price leads to a larger quantity demanded, so this is a movement down along the same demand curve.", "key": "ch4-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Substitutes", "stem": "Many people treat coffee and tea as substitutes. A frost in Brazil sharply raises the price of coffee. In the market for tea,", "options": ["demand rises.", "demand falls.", "nothing changes, because tea is a different good.", "supply falls."], "reasons": ["", "Demand for a good falls when the price of a complement rises. Tea is a substitute for coffee, so its demand rises.", "Tea's demand depends on the price of its substitutes, so more expensive coffee changes it.", "The frost hits coffee growers, not tea growers, so tea supply is unaffected."], "answer": 0, "why": "Substitutes are goods that can be used in place of each other. When coffee becomes more expensive, some buyers switch to tea, so the demand curve for tea shifts to the right.", "key": "ch4-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Surplus and shortage", "stem": "When the price of a good is above its equilibrium price, there is", "options": ["a shortage, and the price tends to rise.", "a shortage, and the price tends to fall.", "a surplus, and the price tends to rise.", "a surplus, and the price tends to fall."], "reasons": ["Above the equilibrium price, sellers offer more than buyers want. That is a surplus, not a shortage.", "Above the equilibrium price, the quantity supplied exceeds the quantity demanded. That is a surplus, not a shortage.", "With unsold goods, sellers cut prices to attract buyers. The price falls, not rises.", ""], "answer": 3, "why": "At a price above equilibrium, the quantity supplied exceeds the quantity demanded, which is a surplus. Sellers with unsold goods cut their prices. The price falls until the market reaches equilibrium.", "key": "ch4-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Movement along the supply curve", "stem": "When car prices rise, carmakers produce more cars. Economists describe this as a rightward shift of the supply curve for cars.", "answer": false, "why": "A change in the good's own price moves sellers along the supply curve to a larger quantity supplied. That is an increase in quantity supplied, not a shift of the curve. The curve shifts only when something else changes, such as input prices or technology.", "key": "ch4-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Inferior goods", "stem": "As their incomes rise, many households buy fewer used cars. For these households, used cars are an inferior good.", "answer": true, "why": "A normal good is one whose demand rises when income rises. An inferior good is one whose demand falls when income rises, as buyers switch to goods they prefer and can now afford, such as new cars.", "key": "ch4-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Solving for equilibrium", "stem": "In a market, the quantity demanded is Qd = 120 − 2P and the quantity supplied is Qs = 3P − 30, where P is the price in dollars. What are the equilibrium price and quantity?", "options": ["P = $18, Q = 84", "P = $30, Q = 60", "P = $45, Q = 30", "P = $30, Q = 90"], "reasons": ["At $18 the quantity demanded is 84 but the quantity supplied is only 24. The two are not equal, so $18 is not the equilibrium.", "", "At $45 the quantity demanded is 30 but the quantity supplied is 105. The two are not equal.", "At $30 both quantities equal 60, not 90. The 90 comes from multiplying 3 by 30 and forgetting to subtract 30."], "answer": 1, "why": "In equilibrium, quantity demanded equals quantity supplied: 120 − 2P = 3P − 30. Adding 2P and 30 to both sides gives 150 = 5P, so P = $30. Then Qd = 120 − 2 × 30 = 60 and Qs = 3 × 30 − 30 = 60. They agree, so the equilibrium quantity is 60.", "key": "ch4-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Shifts in both curves", "stem": "Demand for a good increases and supply of it increases at the same time. The equilibrium quantity", "options": ["falls, and the change in price is uncertain.", "rises, and the price must rise.", "rises, but the change in price is uncertain.", "stays the same, and the price rises."], "reasons": ["Both shifts push quantity up, so it cannot fall.", "The increase in demand pushes the price up, but the increase in supply pushes it down. Without their sizes, the net effect on price is unknown.", "", "Both shifts raise the quantity, so it cannot stay the same."], "answer": 2, "why": "An increase in demand raises both price and quantity. An increase in supply raises quantity but lowers price. Together they must raise quantity. The price rises if the demand shift is larger and falls if the supply shift is larger, so without knowing the sizes its change is uncertain.", "key": "ch4-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Complements", "stem": "The price of gasoline rises sharply. In the market for large SUVs,", "options": ["demand falls, so the price and the quantity of SUVs fall.", "supply falls, so the price rises and the quantity falls.", "demand rises, so the price and the quantity rise.", "the quantity demanded falls, but the demand curve does not shift."], "reasons": ["", "Gasoline is used by SUV owners, not as an input by SUV makers. Its price affects demand for SUVs, not their supply.", "Gasoline and SUVs are complements. A higher gasoline price lowers demand for SUVs.", "The change is in the price of gasoline, not the price of SUVs. A change in the price of a related good shifts the demand curve itself."], "answer": 0, "why": "SUVs and gasoline are used together, so they are complements. More expensive gasoline raises the cost of owning an SUV, which shifts the demand curve for SUVs to the left. With supply unchanged, both the equilibrium price and the equilibrium quantity of SUVs fall.", "key": "ch4-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Shifts in supply", "stem": "Laptop makers adopt a new assembly method that cuts the cost of building each laptop. In the laptop market,", "options": ["supply shifts left, so the price rises and the quantity falls.", "demand shifts right, so the price and the quantity rise.", "nothing shifts, because only the price of laptops moves the curves.", "supply shifts right, so the price falls and the quantity rises."], "reasons": ["Lower costs make sellers willing to offer more at every price, so supply shifts right, not left.", "The new method changes sellers' costs, not buyers' wants, so it shifts supply, not demand.", "A change in production costs shifts the supply curve. Only a change in the good's own price moves along the curves.", ""], "answer": 3, "why": "Supply depends on the cost of production. Cheaper production means sellers offer more at every price, so the supply curve shifts to the right. With demand unchanged, the equilibrium price falls and the equilibrium quantity rises.", "key": "ch4-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Shifts in both curves", "stem": "If the demand for a good rises and the supply of it falls at the same time, the equilibrium quantity must rise.", "answer": false, "why": "Both shifts push the price up, so the price must rise. But the rise in demand pushes quantity up while the fall in supply pushes it down. Which effect is larger decides the change in quantity, so it may rise, fall or stay the same.", "key": "ch4-M5"}]}, {"chapter": 5, "title": "Elasticity and Its Application", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Elastic demand", "stem": "Demand for a good is elastic when", "options": ["the quantity demanded does not respond to the price.", "the price elasticity of demand is less than 1.", "the good is a necessity with no close substitutes.", "the quantity demanded responds strongly to a change in price."], "reasons": ["A quantity demanded that does not respond to price describes perfectly inelastic demand.", "An elasticity below 1 means demand is inelastic.", "Necessities without close substitutes tend to have inelastic demand.", ""], "answer": 3, "why": "Demand is elastic when the percentage change in quantity demanded is larger than the percentage change in price, that is, when the price elasticity of demand is greater than 1. Buyers respond strongly to price changes.", "key": "ch5-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Determinants of elasticity", "stem": "The price of each item below rises by 10 percent. For which one would the percentage fall in quantity demanded be largest?", "options": ["Insulin for a diabetic patient", "A single brand of bottled water", "Gasoline over the following week", "Household electricity"], "reasons": ["Insulin is a necessity with no close substitute, so its demand is very inelastic.", "", "In the short run drivers cannot easily change how much they drive, so demand for gasoline is inelastic over a week.", "Households have few quick substitutes for electricity, so its demand is inelastic."], "answer": 1, "why": "Demand is more elastic when close substitutes are available. One brand of bottled water has many close substitutes in other brands, so a small rise in its price leads many buyers to switch.", "key": "ch5-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Elasticity and total revenue", "stem": "An airline finds that demand for its business-class seats is inelastic. If it raises the business-class fare, its revenue from those seats", "options": ["rises.", "falls.", "stays the same.", "falls to zero."], "reasons": ["", "Total revenue falls after a price rise only when demand is elastic.", "Total revenue is unchanged only when demand is unit elastic.", "With inelastic demand the quantity demanded falls only a little."], "answer": 0, "why": "Total revenue is price times quantity. With inelastic demand, the percentage fall in quantity is smaller than the percentage rise in price. The higher price outweighs the lost sales, so total revenue rises.", "key": "ch5-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Time horizon", "stem": "Demand for a good is usually more elastic over a long period than over a short one.", "answer": true, "why": "Over a longer period buyers have more time to find substitutes and change their habits. A rise in the price of gasoline, for example, changes little in the first week, but over years people buy more fuel-efficient cars and move closer to work.", "key": "ch5-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Income elasticity", "stem": "When a household's income rises, it buys fewer packets of instant noodles. Its income elasticity of demand for instant noodles is therefore positive.", "answer": false, "why": "Income elasticity is the percentage change in quantity demanded divided by the percentage change in income. Income rose and purchases fell, so the elasticity is negative. A negative income elasticity means instant noodles are an inferior good for this household.", "key": "ch5-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "The midpoint method", "stem": "A gym raises its monthly fee from $80 to $120, and its membership falls from 1,100 to 900. Using the midpoint method, what is the price elasticity of demand for membership?", "options": ["2.0", "0.36", "0.5", "200"], "reasons": ["2.0 divides the percentage change in price by the percentage change in quantity. Elasticity is the other way round.", "0.36 uses the starting values, 1,100 and $80, instead of the midpoints.", "", "200 is the change in membership, not the elasticity."], "answer": 2, "why": "The midpoint membership is (1,100 + 900) / 2 = 1,000, so the percentage change in quantity is 200 / 1,000 = 20 percent. The midpoint fee is ($80 + $120) / 2 = $100, so the percentage change in price is $40 / $100 = 40 percent. The elasticity is 20 / 40 = 0.5.", "key": "ch5-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Elasticity and total revenue", "stem": "A theater raises its ticket price from $10 to $12, and ticket sales fall from 500 to 450 a night. Total revenue", "options": ["falls by $400, so demand is elastic in this range.", "is unchanged.", "rises by $1,000.", "rises by $400, so demand is inelastic in this range."], "reasons": ["Revenue goes from $5,000 to $5,400, so it rises, not falls.", "Revenue changes from $5,000 to $5,400.", "$1,000 assumes sales stay at 500 at the higher price. They fall to 450.", ""], "answer": 3, "why": "Revenue before the change is $10 × 500 = $5,000. After it is $12 × 450 = $5,400, a rise of $400. Revenue rises after a price rise only when demand is inelastic. The midpoint elasticity confirms it: (50 / 475) / ($2 / $11) is about 0.58, which is less than 1.", "key": "ch5-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Cross-price elasticity", "stem": "When the price of printers falls by 10 percent, purchases of ink cartridges rise by 15 percent. The cross-price elasticity of demand for ink with respect to the price of printers is", "options": ["+1.5, so the goods are substitutes.", "−1.5, so the goods are complements.", "−0.67, so the goods are complements.", "+0.67, so the goods are substitutes."], "reasons": ["The price fell while purchases rose, so the two changes have opposite signs and the elasticity is negative.", "", "−0.67 divides the change in price by the change in quantity. The elasticity is the other way round.", "The sign is negative, because the price and the purchases moved in opposite directions, and the size is 1.5."], "answer": 1, "why": "Cross-price elasticity is the percentage change in the quantity of one good divided by the percentage change in the price of the other: 15 / (−10) = −1.5. A negative cross-price elasticity means the goods are complements, which fits printers and ink.", "key": "ch5-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Elasticity of supply", "stem": "A winery can raise its output only by planting new vines, which take years to bear fruit. Its supply of wine is", "options": ["more elastic over several years than over a few weeks.", "perfectly elastic over a few weeks.", "more elastic over a few weeks than over several years.", "unaffected by how long it has to respond."], "reasons": ["", "Over a few weeks the winery can barely change its output, so its supply is close to perfectly inelastic, not perfectly elastic.", "With more time it can plant vines and expand, so supply is more elastic over years, not weeks.", "Time matters: the longer the winery has, the more it can change its output."], "answer": 0, "why": "Supply is more elastic when sellers can change the quantity they produce easily. In a few weeks the winery can do little, but over several years it can plant vines and expand. So the quantity supplied responds more to a price change over the longer period.", "key": "ch5-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Elasticity along a linear demand curve", "stem": "Along a straight-line demand curve, the price elasticity of demand differs from one point to another, even though the slope is the same everywhere.", "answer": true, "why": "Elasticity compares percentage changes, not absolute ones. At high prices and low quantities, a given change in price is a small percentage and the change in quantity a large one, so demand is elastic. At low prices and high quantities the reverse holds, so demand is inelastic.", "key": "ch5-M5"}]}, {"chapter": 6, "title": "Supply, Demand, and Government Policies", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Price ceilings", "stem": "A city caps apartment rents at $1,500 a month. Without the cap, the market rent would be $1,800. The cap", "options": ["is binding and creates a shortage of apartments.", "is not binding, because it is below the market rent.", "is binding and creates a surplus of apartments.", "has no effect, because landlords set rents."], "reasons": ["", "A ceiling binds when it is below the market price. $1,500 is below $1,800, so this one binds.", "Holding the rent below the market rate raises the number of people seeking apartments and lowers the number offered. That is a shortage, not a surplus.", "The cap is a legal maximum, so landlords cannot charge more than $1,500."], "answer": 0, "why": "A rent cap is a price ceiling. It matters only if it is below the rent the market would set. At $1,500, more people want apartments than landlords offer, so there is a shortage.", "key": "ch6-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "The minimum wage", "stem": "The legal minimum wage is set at $18 an hour, above the $15 wage at which the labor market would clear. The result is", "options": ["a shortage of workers, because firms want to hire more at $18.", "no effect, because firms can pay what they like.", "a surplus of labor: more people want to work than firms want to hire.", "a payment to workers from the government."], "reasons": ["At a higher wage firms want to hire fewer workers, not more, so there is no shortage.", "The minimum wage is a legal floor. Firms cannot pay less than $18.", "", "The government pays nothing under a minimum wage. It sets a wage that employers must pay."], "answer": 2, "why": "The minimum wage is a price floor for labor. Set above the market-clearing wage, it raises the number of people who want to work and lowers the number employers want to hire. The surplus of labor is unemployment.", "key": "ch6-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Taxes on sellers", "stem": "A per-unit tax collected from the sellers of a good shifts", "options": ["the demand curve down by the amount of the tax.", "the supply curve up by the amount of the tax.", "the supply curve down by the amount of the tax.", "neither curve."], "reasons": ["A tax collected from sellers changes what sellers need to be paid. It shifts supply, not demand.", "", "The tax raises sellers' costs, so they need a higher price to supply each quantity. The curve moves up, not down.", "The tax changes the price sellers need to supply each quantity, so the supply curve shifts."], "answer": 1, "why": "With the tax, sellers keep only the price minus the tax. To be willing to supply any given quantity, they need a price higher by the amount of the tax. So the supply curve shifts up by exactly the tax.", "key": "ch6-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Tax incidence", "stem": "Making gas stations, rather than drivers, hand a gasoline tax to the government shifts most of the burden of the tax onto gas stations.", "answer": false, "why": "Who sends the money to the government does not decide who bears the tax. Either way, the gap between what drivers pay and what stations keep equals the tax. How that gap is shared depends on the elasticities of supply and demand.", "key": "ch6-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Tax incidence", "stem": "Cigarette smokers cut back little when the price rises, while cigarette makers can easily sell elsewhere. A cigarette tax therefore falls mostly on smokers.", "answer": true, "why": "A tax falls more heavily on the less elastic side of the market. Smokers have inelastic demand, so they cannot easily avoid the tax by buying less. Sellers, with more elastic supply, can, so smokers bear most of it.", "key": "ch6-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Effect of a price ceiling", "stem": "In a market, the quantity demanded is Qd = 100 − 5P and the quantity supplied is Qs = 5P − 20, where P is the price in dollars. The government imposes a price ceiling of $10. What is the result?", "options": ["No shortage, because the ceiling is above the equilibrium price", "A surplus of 20 units", "A shortage of 10 units", "A shortage of 20 units"], "reasons": ["The equilibrium price is $12, so a ceiling of $10 is below it and binds.", "A surplus arises when the price is held above equilibrium. This ceiling holds the price below it.", "10 is the fall in quantity supplied from the equilibrium of 40 to 30. The shortage compares demand with supply at the ceiling.", ""], "answer": 3, "why": "Equilibrium is where 100 − 5P = 5P − 20, so 120 = 10P and P = $12, with Q = 40. The ceiling of $10 is below $12, so it binds. At $10 the quantity demanded is 100 − 50 = 50 and the quantity supplied is 50 − 20 = 30. The shortage is 50 − 30 = 20 units.", "key": "ch6-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Tax incidence", "stem": "Before a tax, a good sells for $20. After a $5 tax per unit, buyers pay $24 and sellers keep $19. Which side of the market is less elastic?", "options": ["Buyers, because they bear $4 of the $5 tax.", "Sellers, because they bear only $1 of the tax.", "Neither, because the tax is split equally.", "It cannot be told without knowing the tax revenue."], "reasons": ["", "Sellers bear the smaller share. The side that bears less of a tax is the more elastic side.", "The split is $4 to buyers and $1 to sellers, not equal.", "The shares of the tax are enough. The side that bears more is the less elastic one."], "answer": 0, "why": "Buyers pay $24 − $20 = $4 more, and sellers receive $20 − $19 = $1 less. Buyers bear $4 of the $5 tax. A tax falls more heavily on the less elastic side of the market, so demand is less elastic than supply here.", "key": "ch6-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Tax revenue", "stem": "Before a $2 per-unit tax, 350 units of a good are sold. After the tax, 300 units are sold. How much revenue does the tax raise?", "options": ["$700", "$100", "$600", "$650"], "reasons": ["$700 uses the 350 units sold before the tax. The tax is collected only on the 300 units sold after it.", "$100 is the tax that would have been collected on the 50 units no longer sold. No tax is collected on them.", "", "$650 uses the average of the two quantities. The tax is collected on the 300 units actually sold."], "answer": 2, "why": "Tax revenue is the tax per unit times the number of units sold with the tax in place: $2 × 300 = $600.", "key": "ch6-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Rent control", "stem": "A city has had rent control for 20 years. Compared with the year it was introduced, the gap between the number of people seeking apartments and the number available is most likely", "options": ["smaller, because landlords have built more housing.", "larger, because supply and demand respond more over time.", "the same, because the controlled rent has not changed.", "zero, because the market has adjusted."], "reasons": ["Rent control lowers the return on rental housing, so landlords build less, not more.", "", "The ceiling stays the same, but supply and demand respond more over time, so the shortage grows.", "A binding ceiling stops the price from adjusting, so the shortage persists."], "answer": 1, "why": "In the short run the number of apartments is fixed and people adjust their housing slowly, so the shortage is small. Over time landlords build fewer units and let existing ones run down, and more people look for rentals at the low rent. Both supply and demand become more elastic, so the shortage grows.", "key": "ch6-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Price floors", "stem": "A government sets a minimum price for milk of $3 a gallon when the market price is $4. As a result, farmers are left with unsold milk.", "answer": false, "why": "A minimum price matters only if it is above the market price. Here the market price of $4 is already above the $3 floor, so the floor does not bind and has no effect. Unsold milk would result only from a floor set above $4.", "key": "ch6-M5"}]}, {"chapter": 7, "title": "Consumers, Producers, and the Efficiency of Markets", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Consumer surplus", "stem": "Dana would pay up to $1,200 for a used laptop. She buys one for $950. Her consumer surplus is", "options": ["$950.", "$1,200.", "$250.", "$2,150."], "reasons": ["$950 is the price she pays, not the gain she gets from buying.", "$1,200 is her willingness to pay, the most she would pay. Her surplus is what she gains beyond the price.", "", "$2,150 adds the price to her willingness to pay. Consumer surplus subtracts the price from it."], "answer": 2, "why": "Consumer surplus is the amount a buyer is willing to pay minus the amount she actually pays. Dana would pay up to $1,200 and pays $950, so her consumer surplus is $1,200 − $950 = $250.", "key": "ch7-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Producer surplus", "stem": "A cabinetmaker's cost of building a bookcase, including the value of her own time, is $300. She sells the bookcase for $420. Her producer surplus on the sale is", "options": ["$120.", "$300.", "$420.", "$720."], "reasons": ["", "$300 is her cost of building the bookcase, not her gain from selling it.", "$420 is the price she receives. Her surplus is what she receives beyond her cost.", "$720 adds the price to the cost. Producer surplus subtracts the cost from the price."], "answer": 0, "why": "Producer surplus is the amount a seller is paid minus the seller's cost. She is paid $420 and her cost is $300, so her producer surplus is $420 − $300 = $120.", "key": "ch7-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Producer surplus on a graph", "stem": "Add up, across every seller, the price received minus that seller's cost. On a supply-and-demand diagram, this total appears as the region", "options": ["below the demand curve and above the price.", "below the price and above the supply curve.", "between the demand curve and the supply curve.", "below the supply curve."], "reasons": ["The area below the demand curve and above the price is consumer surplus: what buyers would pay beyond what they do pay.", "", "The area between the demand curve and the supply curve, up to the quantity sold, is total surplus: consumer and producer surplus together.", "The area below the supply curve measures sellers' costs, not the gain they make above those costs."], "answer": 1, "why": "The supply curve shows each seller's cost. Each seller is paid the price, so the gain on each unit is the gap between the price and the supply curve. Adding up those gaps gives the area below the price and above the supply curve, which is producer surplus.", "key": "ch7-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Consumer surplus", "stem": "If the market price of a good falls, the consumer surplus of buyers who were already buying it rises.", "answer": true, "why": "Each existing buyer's willingness to pay is unchanged, but each now pays less. Consumer surplus is willingness to pay minus price, so a lower price raises the surplus of every buyer who was already buying. New buyers who enter at the lower price add further surplus.", "key": "ch7-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Efficiency and equality", "stem": "An efficient allocation of resources is one that divides total surplus equally between buyers and sellers.", "answer": false, "why": "Efficiency means total surplus is as large as possible. It says nothing about how that surplus is divided. Whether buyers and sellers share it equally is a question of equality, not efficiency.", "key": "ch7-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Consumer surplus from a table", "stem": "Four buyers want one concert ticket each. Their willingness to pay is shown in the table. The tickets sell for $55 each. What is the total consumer surplus in this market?", "table": {"header": ["Buyer", "Willingness to pay"], "rows": [["Ava", "$90"], ["Ben", "$75"], ["Cal", "$60"], ["Dee", "$45"]]}, "options": ["$50", "$55", "$60", "$225"], "reasons": ["$50 counts Dee as a buyer. She values a ticket at only $45, less than the $55 price, so she does not buy.", "$55 leaves out Cal. He values a ticket at $60, more than the $55 price, so he buys and gains $5.", "", "$225 is the three buyers' total willingness to pay. Consumer surplus subtracts the price each one pays."], "answer": 2, "why": "A buyer buys when her willingness to pay is at least the price. At $55, Ava, Ben and Cal buy; Dee, at $45, does not. Their surpluses are $90 − $55 = $35, $75 − $55 = $20 and $60 − $55 = $5. Total consumer surplus is $35 + $20 + $5 = $60.", "key": "ch7-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Total surplus", "stem": "A buyer would pay up to $700 for a used motorcycle. The seller's cost of selling it is $450. They agree on a price of $600. The total surplus from this trade is", "options": ["$250.", "$100.", "$150.", "$600."], "reasons": ["", "$100 is only the buyer's surplus ($700 − $600). Total surplus adds the seller's surplus.", "$150 is only the seller's surplus ($600 − $450). Total surplus adds the buyer's surplus.", "$600 is the price. The price is paid by one side and received by the other, so it is not a gain to the two of them together."], "answer": 0, "why": "The buyer's surplus is $700 − $600 = $100. The seller's surplus is $600 − $450 = $150. Total surplus is $100 + $150 = $250. The same answer comes from value to the buyer minus cost to the seller: $700 − $450 = $250. The price only divides the surplus between them.", "key": "ch7-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Efficiency of the market equilibrium", "stem": "A competitive market is in equilibrium. If one more unit were produced and sold beyond the equilibrium quantity, total surplus would", "options": ["rise, because more of the good is produced.", "fall, because the cost to sellers of that unit is greater than its value to buyers.", "stay the same, because the price does not change.", "rise, because buyers would pay less for that unit."], "reasons": ["Producing more raises total surplus only when the extra unit is worth more to buyers than it costs sellers. Beyond the equilibrium that is not the case.", "", "Total surplus depends on the value and cost of each unit traded, not on the price. Adding a unit changes total surplus by its value minus its cost.", "The price only moves surplus between buyers and sellers. It cannot make a unit that costs more than it is worth add to total surplus."], "answer": 1, "why": "Beyond the equilibrium quantity the supply curve lies above the demand curve. That means the cost to the marginal seller of an extra unit is greater than the value to the marginal buyer. Producing that unit adds more cost than value, so total surplus falls. This is why the equilibrium quantity maximizes total surplus.", "key": "ch7-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Producer surplus from a table", "stem": "Four house painters can each paint one house. Their costs are shown in the table. The market price for painting a house is $300. What is the total producer surplus in this market?", "table": {"header": ["Painter", "Cost"], "rows": [["Eli", "$200"], ["Fay", "$260"], ["Gus", "$320"], ["Hal", "$380"]]}, "options": ["$600", "$100", "$120", "$140"], "reasons": ["$600 is the two painters' combined revenue, 2 × $300. Producer surplus subtracts each painter's cost.", "$100 is Eli's surplus alone. Fay's cost of $260 is below the $300 price, so she also paints and gains $40.", "$120 counts Gus as a seller. His cost of $320 is above the $300 price, so he does not paint.", ""], "answer": 3, "why": "A painter sells when the price is at least his or her cost. At $300, Eli and Fay paint; Gus and Hal do not. Their surpluses are $300 − $200 = $100 and $300 − $260 = $40. Total producer surplus is $100 + $40 = $140.", "key": "ch7-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Efficiency", "stem": "If a buyer's willingness to pay for a good is less than a seller's cost of producing it, an efficient outcome does not include that trade.", "answer": true, "why": "A trade adds to total surplus only if the good is worth more to the buyer than it costs the seller. Here the value to the buyer is less than the cost, so the trade would lower total surplus. An efficient outcome, which makes total surplus as large as possible, leaves it out.", "key": "ch7-M5"}]}, {"chapter": 10, "title": "Externalities", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Negative externalities", "stem": "In which case below does someone bear a cost from an activity they take no part in and are not paid for?", "options": ["A homeowner repaints her house, and the value of the houses next door rises.", "Soot from a factory's chimney settles on cars in a nearby parking lot.", "A firm raises the price of its product, and its customers pay more.", "A worker is paid overtime for working on a holiday."], "reasons": ["A rise in the neighbors' house values is a benefit to bystanders, which makes it a positive externality.", "", "Customers who pay a higher price are taking part in the trade. An externality falls on a bystander who is not part of it.", "Overtime pay is part of the agreement between the worker and the firm. No bystander is affected."], "answer": 1, "why": "An externality is the uncompensated effect of one person's actions on a bystander. The car owners take no part in the factory's production, yet the soot damages their cars and no one pays them for it. Because the effect is harmful, it is a negative externality.", "key": "ch10-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Social cost", "stem": "A chemical plant's production sends waste into a river, which harms the people who fish downstream. Compared with the plant's private cost of production, the social cost of its output is", "options": ["higher, because it adds the harm done to the people who fish downstream.", "lower, because the people who fish downstream bear part of the cost.", "the same, because the plant pays for all its inputs.", "zero, because the river is not owned by anyone."], "reasons": ["", "The harm to the people downstream is a cost on top of the plant's own costs. It raises the social cost; it does not reduce it.", "The plant pays for its inputs but not for the damage its waste does downstream. That damage is part of the social cost.", "The river having no owner is why the harm goes unpaid. It does not make the harm cost nothing."], "answer": 0, "why": "Social cost is the private cost to the producer plus the external cost to bystanders. The plant pays its own costs but not the harm to the people who fish downstream. Adding that harm makes the social cost higher than the private cost.", "key": "ch10-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Positive externalities", "stem": "A beekeeper's bees pollinate a neighboring apple orchard and raise its harvest. The orchard owner pays the beekeeper nothing. Left to the market, the number of hives the beekeeper keeps is", "options": ["more than the socially optimal number.", "exactly the socially optimal number.", "fewer than the socially optimal number.", "zero."], "reasons": ["The beekeeper ignores a benefit to the orchard, not a cost to it. Ignoring a benefit leads to keeping too few hives, not too many.", "The beekeeper counts only her own benefit from the hives and leaves out the benefit to the orchard, so her choice is not the social optimum.", "", "The beekeeper keeps hives for her own benefit, such as honey. The externality makes her keep too few, not none."], "answer": 2, "why": "The pollination is a positive externality: a benefit to the orchard that the beekeeper is not paid for. The beekeeper decides how many hives to keep by comparing her own benefit with her cost, and leaves out the benefit to the orchard. The social value of a hive is therefore higher than the value she counts, so she keeps fewer hives than is socially optimal.", "key": "ch10-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Corrective taxes", "stem": "Suppose the government charges sellers a per-unit tax equal to the harm each unit does to bystanders. This tax brings output to the socially optimal level.", "answer": true, "why": "A tax equal to the external cost of each unit makes sellers pay that cost as if it were their own. Their supply curve then rises to the social-cost curve, and the market settles where social cost equals the value to buyers. That is the socially optimal quantity. This is what it means to internalize the externality.", "key": "ch10-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Positive externalities", "stem": "Free markets tend to produce too much of goods whose use benefits bystanders, such as vaccines.", "answer": false, "why": "With a positive externality, the good is worth more to society than to the buyers, because bystanders benefit too. Buyers and sellers ignore that extra benefit, so the market produces less than the socially optimal quantity, not more. Producing too much is what happens with a negative externality.", "key": "ch10-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Socially optimal quantity", "stem": "The table shows the value to buyers and the private cost to sellers of each unit of a good. Producing each unit also causes $6 of harm to people who live near the factory. What is the socially optimal quantity?", "table": {"header": ["Unit", "Value to buyers", "Private cost"], "rows": [["1st", "$30", "$9"], ["2nd", "$27", "$12"], ["3rd", "$24", "$15"], ["4th", "$21", "$18"], ["5th", "$18", "$21"]]}, "options": ["2 units", "3 units", "4 units", "5 units"], "reasons": ["The 3rd unit is worth $24 to buyers and costs society $15 + $6 = $21, so producing it adds to total surplus. Stopping at 2 units is too few.", "", "4 units is what the market produces, because it counts only the private cost. The 4th unit is worth $21 but costs society $18 + $6 = $24.", "The 5th unit is worth $18 to buyers but costs society $21 + $6 = $27, and even its private cost of $21 exceeds its value."], "answer": 1, "why": "The social cost of each unit is its private cost plus the $6 of harm: $15, $18, $21, $24 and $27. A unit should be produced when its value to buyers is at least its social cost. The 1st ($30 vs $15), 2nd ($27 vs $18) and 3rd ($24 vs $21) units pass. The 4th does not ($21 vs $24). So the socially optimal quantity is 3 units.", "key": "ch10-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Corrective taxes", "stem": "The table shows the private cost to sellers and the social cost of each unit of a good. The gap between them is harm to people who live near the factory. Which per-unit tax on sellers would make them count the full social cost of their output?", "options": ["$6", "$3", "$9", "$21"], "reasons": ["", "$3 covers only half of the $6 gap between social and private cost, so sellers would still leave out part of the harm.", "$9 is the private cost of the 1st unit. The tax should equal the harm per unit, the gap between social and private cost.", "$21 is the whole social cost of the 3rd unit. Taxing that much would charge sellers far more than the harm and cut output too far."], "answer": 0, "why": "The harm from each unit is social cost minus private cost: $15 − $9 = $18 − $12 = $21 − $15 = $24 − $18 = $6. A corrective tax equal to that external cost, $6 per unit, makes sellers count the full social cost of each unit, so the market produces the socially optimal quantity.", "table": {"header": ["Unit", "Private cost", "Social cost"], "rows": [["1st", "$9", "$15"], ["2nd", "$12", "$18"], ["3rd", "$15", "$21"], ["4th", "$18", "$24"]]}, "key": "ch10-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Tradable pollution permits", "stem": "Two factories each emit 100 tons of smoke a year. Cutting one ton costs Factory A $50 and Factory B $200. The government wants total smoke cut by 100 tons. Which policy reaches that target at the lowest total cost?", "options": ["Require each factory to cut 50 tons.", "Ban all smoke from both factories.", "Give each factory permits for 50 tons of smoke and let them trade the permits.", "Require Factory B to make the whole 100-ton cut."], "reasons": ["Equal cuts cost 50 × $50 + 50 × $200 = $12,500, because Factory B makes half the cuts at its high cost.", "A ban cuts 200 tons, twice the target, and costs 100 × $50 + 100 × $200 = $25,000.", "", "Making Factory B do all the cutting costs 100 × $200 = $20,000, because every ton is cut by the high-cost factory."], "answer": 2, "why": "The cheapest way to cut 100 tons is for Factory A, which cuts at $50 a ton, to do all of it: 100 × $50 = $5,000. Tradable permits achieve this. Factory B values a permit at up to $200, the cost of cutting a ton itself, while Factory A needs only $50 to cut a ton instead. So Factory A sells its 50 permits to Factory B and cuts all 100 tons of its smoke. Equal cuts would cost $12,500.", "key": "ch10-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "The Coase theorem", "stem": "Ana values playing loud music at night at $50. Her neighbor values a quiet night at $80. Ana has the legal right to play music, and the two can bargain at no cost. The Coase theorem predicts that the music will stop.", "answer": true, "why": "Quiet is worth $80 to the neighbor and the music is worth only $50 to Ana, so stopping the music is the efficient outcome. Even though Ana has the right to play, the neighbor can pay her any amount between $50 and $80 to stop, and both are better off. The Coase theorem says that when bargaining costs nothing, the parties reach the efficient outcome whoever holds the right.", "key": "ch10-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Subsidies for positive externalities", "stem": "Each flu shot gives $15 of benefit to people other than the person vaccinated, because fewer people catch the flu. Which per-shot policy moves the market to the socially optimal number of flu shots?", "options": ["A $15 tax on each flu shot", "A ban on flu shots sold without a prescription", "No policy, because people who get flu shots already benefit from them", "A $15 subsidy for each flu shot"], "reasons": ["A tax would reduce the number of flu shots, but the market already provides too few because buyers ignore the $15 benefit to others.", "Restricting flu shots would reduce their number further, when the market already provides too few.", "People count their own benefit but not the $15 benefit to others, so the market provides fewer flu shots than is socially optimal.", ""], "answer": 3, "why": "Flu shots create a positive externality of $15 per shot. Because buyers ignore that benefit to others, the market provides fewer shots than is socially optimal. A $15 subsidy per shot makes each shot $15 cheaper, which brings the external benefit into buyers' decisions and raises the number of shots to the socially optimal quantity.", "key": "ch10-M5"}]}, {"chapter": 11, "title": "Public Goods and Common Resources", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Rival in consumption", "stem": "Once a customer eats a sandwich bought from a deli, no one else can eat that same sandwich. This feature of the sandwich is called", "options": ["excludability.", "rivalry in consumption.", "the free-rider problem.", "a positive externality."], "answer": 1, "why": "A good is rival in consumption when one person's use of it leaves less for anyone else. A sandwich that has been eaten is gone, so it is rival. Excludability is a different property: whether people who do not pay can be kept from using the good. The free-rider problem arises when a good is not excludable, and a positive externality is a benefit to bystanders. Neither is a property of the sandwich itself.", "reasons": ["Excludability is about whether people who do not pay can be kept from using a good, not about whether one person's use leaves less for others.", "", "The free-rider problem arises when people cannot be kept from using a good. It is not a property of the sandwich.", "A positive externality is a benefit to bystanders. Eating a sandwich gives no benefit to anyone else."], "key": "ch11-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Public goods", "stem": "A radio station broadcasts a free weather forecast. Anyone with a radio can hear it, and one listener tuning in does not reduce what any other listener hears. The forecast is best classified as a", "options": ["private good.", "club good.", "common resource.", "public good."], "answer": 3, "why": "The forecast is not excludable, because anyone with a radio can hear it without paying. It is not rival, because one listener does not reduce what others hear. A good that is neither excludable nor rival is a public good. A private good is both excludable and rival, a club good is excludable but not rival, and a common resource is rival but not excludable.", "reasons": ["A private good is both excludable and rival. Anyone with a radio can hear this forecast, and one listener does not reduce what others hear.", "A club good is one that people who do not pay can be kept from using. Anyone with a radio can hear this forecast.", "A common resource is rival: one person's use leaves less for others. Here one listener does not reduce what anyone else hears.", ""], "key": "ch11-E2"}, {"id": "E3", "difficulty": "Easy", "type": "tf", "topic": "Club goods", "stem": "A video-streaming service that sells monthly subscriptions and has plenty of server capacity is an example of a common resource.", "answer": false, "why": "The service is excludable, because people who do not subscribe are shut out. With plenty of capacity it is not rival, because one more viewer does not slow anyone else down. A good that is excludable but not rival is a club good. A common resource is the opposite case: rival but not excludable.", "key": "ch11-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Common resources", "stem": "Tuna swimming in international waters, which any boat may fish, are a public good.", "answer": false, "why": "Any boat may fish international waters, so the tuna are not excludable. But a tuna caught by one boat cannot be caught by another, so the tuna are rival. A public good must be neither excludable nor rival. A good that is rival but not excludable is a common resource, which is what the tuna are.", "key": "ch11-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Free riders", "stem": "A homeowner who benefits from the streetlight on her block but refuses to contribute to the neighborhood fund that pays for it is a free rider.", "answer": true, "why": "A free rider is a person who receives the benefit of a good but avoids paying for it. The streetlight lights her block whether or not she contributes, because she cannot be excluded from its benefit. By refusing to pay, she gets the benefit for nothing, which is exactly what free riding means.", "key": "ch11-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Cost-benefit analysis", "stem": "Three residents would use a new footbridge over a creek. Dana values the bridge at $150, Eli at $90, and Fran at $60. No one else values it. All three can use the bridge at the same time without getting in each other's way. The bridge costs $250 to build. What should the town do?", "options": ["Build it only if each resident values it at $250 or more.", "Do not build it, because no single resident values it at more than $250.", "Build it, because the total benefit of $300 is greater than the cost of $250.", "Do not build it, because Fran values it at less than an equal one-third share of the cost."], "answer": 2, "why": "Because all three can use the bridge at the same time, the benefit to the town is the sum of their valuations, $150 + $90 + $60 = $300. That is greater than the $250 cost, so building it raises total surplus by $50. No single resident needs to value it above the full cost. How the cost is shared is a separate question; Fran's $60 being below an equal share of about $83.33 does not change whether the bridge is worth building.", "reasons": ["No single resident needs to value the bridge at its full cost. All three use the same bridge, so what matters is the total of their valuations.", "No single resident needs to value the bridge at more than its cost. All three use the same bridge, so what matters is the total of their valuations.", "", "How the cost is shared is a separate question from whether the bridge is worth building."], "key": "ch11-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Efficient quantity of a public good", "stem": "A small town has three residents, Ana, Ben, and Cara. All three benefit from every streetlight on their road. The table shows how much each would pay for each additional streetlight. Each streetlight costs $30 to install. How many streetlights maximize total surplus?", "table": {"header": ["Streetlight", "Ana", "Ben", "Cara"], "rows": [["1st", "$30", "$25", "$15"], ["2nd", "$20", "$15", "$10"], ["3rd", "$12", "$10", "$6"], ["4th", "$5", "$4", "$1"]]}, "options": ["1", "2", "3", "4"], "answer": 1, "why": "All three residents benefit from every light at once, so the value of each light is the sum of what all three residents would pay for it. The 1st light is worth $30 + $25 + $15 = $70, the 2nd $20 + $15 + $10 = $45, the 3rd $12 + $10 + $6 = $28, and the 4th $5 + $4 + $1 = $10. Install a light whenever its total value is at least its $30 cost. The 1st ($70) and 2nd ($45) pass; the 3rd ($28) does not. So 2 streetlights maximize total surplus. Comparing each person's value with the cost separately would wrongly give only 1.", "reasons": ["Comparing each resident's value with the $30 cost on its own ignores that all three benefit from the same light. Add their values for each light.", "", "The 3rd light is worth $12 + $10 + $6 = $28 to the three residents together, which is less than its $30 cost.", "The 4th light is worth only $5 + $4 + $1 = $10 to the three residents together, far below its $30 cost."], "key": "ch11-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Solving the Tragedy of the Commons", "stem": "Anyone may fish a large lake, and the fish stock is falling. The state caps the total catch and sells fishing permits; only permit holders may fish, up to the amount on their permit. Which property of the fish does the permit system change?", "options": ["It makes the fish excludable, because people without a permit may no longer fish.", "It makes the fish nonrival, because the total catch is capped.", "It turns the fish into a public good.", "It removes the externality by subsidizing fishing."], "answer": 0, "why": "Before the permits, anyone could fish, so the fish were not excludable; they were a common resource. The permits shut out anyone without one, which makes the fish excludable. The fish are still rival: a fish one permit holder catches cannot be caught by another, and capping the total does not change that. The fish therefore do not become nonrival or a public good, and a permit is a charge for access, not a subsidy.", "reasons": ["", "Capping the total catch does not make the fish nonrival. A fish caught by one permit holder still cannot be caught by another.", "A public good is not rival. With permits the fish are still rival, because each fish can be caught only once.", "A permit is a charge for access to the lake, not a subsidy."], "key": "ch11-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Public goods", "stem": "The total benefit to a town of a public good, such as a fireworks display, equals the largest amount any single resident would pay for it.", "answer": false, "why": "A public good is not rival, so every resident enjoys the same display at the same time. The total benefit is therefore the sum of what all residents would pay, not the largest single amount. This is why a public good can be worth providing even when no single person would pay its full cost.", "key": "ch11-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Tragedy of the Commons", "stem": "Anyone may fish a lake, which holds a limited stock of fish. When a fisher decides whether to add another boat, she ignores one cost of that decision. That cost is", "options": ["the price she receives for her fish.", "the cost of her own boat and fuel.", "the wages she pays her crew.", "the reduction in the catch of the other boats."], "answer": 3, "why": "The fish are a common resource: rival but not excludable. When she adds a boat, she counts her own costs and her own extra catch. She does not count the fish that the other boats now fail to catch. That loss falls on other people, so it is a negative externality, and because every fisher ignores it, the lake is overfished. This is the Tragedy of the Commons. The price of fish, her boat and fuel, and her crew's wages are all things she does take into account.", "reasons": ["The price she receives is part of her own revenue, and she takes it into account.", "The cost of her own boat and fuel falls on her, and she takes it into account.", "She pays her crew's wages herself, so she takes them into account.", ""], "key": "ch11-M5"}]}, {"chapter": 14, "title": "The Costs of Production", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Explicit and implicit costs", "stem": "A dentist owns her office building outright and runs her practice in it. Which of the following is an implicit cost of her practice?", "options": ["The salaries she pays her dental hygienists", "The rent she could earn by leasing the building to another firm", "The cost of dental supplies", "The practice's electricity bill"], "answer": 1, "why": "An implicit cost is an opportunity cost that does not require the firm to pay out money. By using the building herself, the dentist gives up the rent another firm would pay her for it, but she writes no check for it. Salaries, supplies and electricity are all paid out in money, so they are explicit costs.", "reasons": ["Salaries are paid out in money, so they are an explicit cost.", "", "Dental supplies are paid for in money, so they are an explicit cost.", "The electricity bill is paid in money, so it is an explicit cost."], "key": "ch14-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Fixed and variable costs", "stem": "A bakery pays each month for flour, the wages of hourly counter staff, electricity to run its ovens, and the lease on its shop. Which of these is a fixed cost?", "options": ["The flour", "The wages of hourly counter staff", "The electricity to run its ovens", "The lease on its shop"], "answer": 3, "why": "A fixed cost does not change with the quantity of output. The lease is the same whether the bakery bakes 100 loaves a month or 10,000. Flour, hourly wages and oven electricity all rise as the bakery produces more, so they are variable costs.", "reasons": ["The bakery uses more flour when it bakes more, so flour is a variable cost.", "Hourly staff are paid for the hours they work, and those hours rise with output, so their wages are a variable cost.", "The ovens use more electricity when the bakery bakes more, so this is a variable cost.", ""], "key": "ch14-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Marginal product", "stem": "A print shop produces 240 posters a day with 4 workers and 285 posters a day with 5 workers. The marginal product of the fifth worker is", "options": ["45 posters.", "57 posters.", "60 posters.", "285 posters."], "answer": 0, "why": "The marginal product of a worker is the increase in output from hiring that worker: 285 − 240 = 45 posters. 57 posters is output per worker with five workers (285 ÷ 5), and 60 is output per worker with four (240 ÷ 4); both are averages, not the change. 285 is total output.", "reasons": ["", "57 is total output divided by five workers (285 ÷ 5). That is output per worker, not the extra output the fifth worker adds.", "60 is 240 ÷ 4, output per worker with four workers. It is not the change in output.", "285 is total output with five workers, not the extra output the fifth worker adds."], "key": "ch14-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Average fixed cost", "stem": "A gym pays $6,000 a month for its lease. If its membership doubles from 300 to 600, the lease cost per member halves, from $20 to $10.", "answer": true, "why": "The lease is a fixed cost: it stays $6,000 a month however many members the gym has. Cost per member is $6,000 ÷ 300 = $20 with 300 members and $6,000 ÷ 600 = $10 with 600, so it halves. This is average fixed cost, and it always falls as output rises because the same fixed cost is spread over more units.", "key": "ch14-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Economic and accounting profit", "stem": "A firm can have a positive accounting profit and a negative economic profit at the same time.", "a
