<style>
:root{--blue:#4866C7;--ink:#1E2430;--muted:#6A7280;--panel:#EEF1FA;--line:#D5DAE6;--good:#2E7D5B;--bad:#B3323C;--bg:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
.top{max-width:760px;margin:0 auto;padding:16px 16px 0;font-size:.95rem}
.top a{text-decoration:none}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
h2{font-size:1.1rem;margin:24px 0 8px}
label.row{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer}
label.row small{color:var(--muted);margin-left:auto;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto}
button{font:inherit;padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.go{background:var(--blue);border-color:var(--blue);color:#fff;width:100%;margin-top:20px;font-weight:bold}
button.go:disabled{opacity:.45;cursor:default}
.meta{color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.stem{margin:4px 0 14px}
table{border-collapse:collapse;margin:0 0 14px}
th,td{border:1px solid var(--line);padding:4px 12px;text-align:center}
th{background:var(--panel)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt .l{font-weight:bold;margin-right:8px}
.opt.wrong{border-color:var(--bad);background:#FBEDEE;color:var(--bad)}
.opt.right{border-color:var(--good);background:#EAF5EF;color:var(--good)}
.opt:disabled{cursor:default}
.msg{font-weight:bold;margin:10px 0}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.why{background:var(--panel);padding:12px 14px;border-radius:6px;margin:10px 0}
.nav{display:flex;gap:8px;margin-top:16px}
.nav button{flex:1}
.score{font-size:1.4rem;font-weight:bold;margin:8px 0}
a{color:var(--blue)}
.foot{color:var(--muted);font-size:.85rem;margin-top:32px}
</style></head>

<script>
const CHAPTERS = [{"chapter": 7, "title": "Consumers, Producers, and the Efficiency of Markets", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Consumer surplus", "stem": "Dana would pay up to $1,200 for a used laptop. She buys one for $950. Her consumer surplus is", "options": ["$950.", "$1,200.", "$250.", "$2,150."], "reasons": ["$950 is the price she pays, not the gain she gets from buying.", "$1,200 is her willingness to pay, the most she would pay. Her surplus is what she gains beyond the price.", "", "$2,150 adds the price to her willingness to pay. Consumer surplus subtracts the price from it."], "answer": 2, "why": "Consumer surplus is the amount a buyer is willing to pay minus the amount she actually pays. Dana would pay up to $1,200 and pays $950, so her consumer surplus is $1,200 − $950 = $250.", "key": "ch7-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Producer surplus", "stem": "A cabinetmaker's cost of building a bookcase, including the value of her own time, is $300. She sells the bookcase for $420. Her producer surplus on the sale is", "options": ["$120.", "$300.", "$420.", "$720."], "reasons": ["", "$300 is her cost of building the bookcase, not her gain from selling it.", "$420 is the price she receives. Her surplus is what she receives beyond her cost.", "$720 adds the price to the cost. Producer surplus subtracts the cost from the price."], "answer": 0, "why": "Producer surplus is the amount a seller is paid minus the seller's cost. She is paid $420 and her cost is $300, so her producer surplus is $420 − $300 = $120.", "key": "ch7-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Producer surplus on a graph", "stem": "Add up, across every seller, the price received minus that seller's cost. On a supply-and-demand diagram, this total appears as the region", "options": ["below the demand curve and above the price.", "below the price and above the supply curve.", "between the demand curve and the supply curve.", "below the supply curve."], "reasons": ["The area below the demand curve and above the price is consumer surplus: what buyers would pay beyond what they do pay.", "", "The area between the demand curve and the supply curve, up to the quantity sold, is total surplus: consumer and producer surplus together.", "The area below the supply curve measures sellers' costs, not the gain they make above those costs."], "answer": 1, "why": "The supply curve shows each seller's cost. Each seller is paid the price, so the gain on each unit is the gap between the price and the supply curve. Adding up those gaps gives the area below the price and above the supply curve, which is producer surplus.", "key": "ch7-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Consumer surplus", "stem": "If the market price of a good falls, the consumer surplus of buyers who were already buying it rises.", "answer": true, "why": "Each existing buyer's willingness to pay is unchanged, but each now pays less. Consumer surplus is willingness to pay minus price, so a lower price raises the surplus of every buyer who was already buying. New buyers who enter at the lower price add further surplus.", "key": "ch7-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Efficiency and equality", "stem": "An efficient allocation of resources is one that divides total surplus equally between buyers and sellers.", "answer": false, "why": "Efficiency means total surplus is as large as possible. It says nothing about how that surplus is divided. Whether buyers and sellers share it equally is a question of equality, not efficiency.", "key": "ch7-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Consumer surplus from a table", "stem": "Four buyers want one concert ticket each. Their willingness to pay is shown in the table. The tickets sell for $55 each. What is the total consumer surplus in this market?", "table": {"header": ["Buyer", "Willingness to pay"], "rows": [["Ava", "$90"], ["Ben", "$75"], ["Cal", "$60"], ["Dee", "$45"]]}, "options": ["$50", "$55", "$60", "$225"], "reasons": ["$50 counts Dee as a buyer. She values a ticket at only $45, less than the $55 price, so she does not buy.", "$55 leaves out Cal. He values a ticket at $60, more than the $55 price, so he buys and gains $5.", "", "$225 is the three buyers' total willingness to pay. Consumer surplus subtracts the price each one pays."], "answer": 2, "why": "A buyer buys when her willingness to pay is at least the price. At $55, Ava, Ben and Cal buy; Dee, at $45, does not. Their surpluses are $90 − $55 = $35, $75 − $55 = $20 and $60 − $55 = $5. Total consumer surplus is $35 + $20 + $5 = $60.", "key": "ch7-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Total surplus", "stem": "A buyer would pay up to $700 for a used motorcycle. The seller's cost of selling it is $450. They agree on a price of $600. The total surplus from this trade is", "options": ["$250.", "$100.", "$150.", "$600."], "reasons": ["", "$100 is only the buyer's surplus ($700 − $600). Total surplus adds the seller's surplus.", "$150 is only the seller's surplus ($600 − $450). Total surplus adds the buyer's surplus.", "$600 is the price. The price is paid by one side and received by the other, so it is not a gain to the two of them together."], "answer": 0, "why": "The buyer's surplus is $700 − $600 = $100. The seller's surplus is $600 − $450 = $150. Total surplus is $100 + $150 = $250. The same answer comes from value to the buyer minus cost to the seller: $700 − $450 = $250. The price only divides the surplus between them.", "key": "ch7-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Efficiency of the market equilibrium", "stem": "A competitive market is in equilibrium. If one more unit were produced and sold beyond the equilibrium quantity, total surplus would", "options": ["rise, because more of the good is produced.", "fall, because the cost to sellers of that unit is greater than its value to buyers.", "stay the same, because the price does not change.", "rise, because buyers would pay less for that unit."], "reasons": ["Producing more raises total surplus only when the extra unit is worth more to buyers than it costs sellers. Beyond the equilibrium that is not the case.", "", "Total surplus depends on the value and cost of each unit traded, not on the price. Adding a unit changes total surplus by its value minus its cost.", "The price only moves surplus between buyers and sellers. It cannot make a unit that costs more than it is worth add to total surplus."], "answer": 1, "why": "Beyond the equilibrium quantity the supply curve lies above the demand curve. That means the cost to the marginal seller of an extra unit is greater than the value to the marginal buyer. Producing that unit adds more cost than value, so total surplus falls. This is why the equilibrium quantity maximizes total surplus.", "key": "ch7-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Producer surplus from a table", "stem": "Four house painters can each paint one house. Their costs are shown in the table. The market price for painting a house is $300. What is the total producer surplus in this market?", "table": {"header": ["Painter", "Cost"], "rows": [["Eli", "$200"], ["Fay", "$260"], ["Gus", "$320"], ["Hal", "$380"]]}, "options": ["$600", "$100", "$120", "$140"], "reasons": ["$600 is the two painters' combined revenue, 2 × $300. Producer surplus subtracts each painter's cost.", "$100 is Eli's surplus alone. Fay's cost of $260 is below the $300 price, so she also paints and gains $40.", "$120 counts Gus as a seller. His cost of $320 is above the $300 price, so he does not paint.", ""], "answer": 3, "why": "A painter sells when the price is at least his or her cost. At $300, Eli and Fay paint; Gus and Hal do not. Their surpluses are $300 − $200 = $100 and $300 − $260 = $40. Total producer surplus is $100 + $40 = $140.", "key": "ch7-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Efficiency", "stem": "If a buyer's willingness to pay for a good is less than a seller's cost of producing it, an efficient outcome does not include that trade.", "answer": true, "why": "A trade adds to total surplus only if the good is worth more to the buyer than it costs the seller. Here the value to the buyer is less than the cost, so the trade would lower total surplus. An efficient outcome, which makes total surplus as large as possible, leaves it out.", "key": "ch7-M5"}]}, {"chapter": 10, "title": "Externalities", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Negative externalities", "stem": "In which case below does someone bear a cost from an activity they take no part in and are not paid for?", "options": ["A homeowner repaints her house, and the value of the houses next door rises.", "Soot from a factory's chimney settles on cars in a nearby parking lot.", "A firm raises the price of its product, and its customers pay more.", "A worker is paid overtime for working on a holiday."], "reasons": ["A rise in the neighbors' house values is a benefit to bystanders, which makes it a positive externality.", "", "Customers who pay a higher price are taking part in the trade. An externality falls on a bystander who is not part of it.", "Overtime pay is part of the agreement between the worker and the firm. No bystander is affected."], "answer": 1, "why": "An externality is the uncompensated effect of one person's actions on a bystander. The car owners take no part in the factory's production, yet the soot damages their cars and no one pays them for it. Because the effect is harmful, it is a negative externality.", "key": "ch10-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Social cost", "stem": "A chemical plant's production sends waste into a river, which harms the people who fish downstream. Compared with the plant's private cost of production, the social cost of its output is", "options": ["higher, because it adds the harm done to the people who fish downstream.", "lower, because the people who fish downstream bear part of the cost.", "the same, because the plant pays for all its inputs.", "zero, because the river is not owned by anyone."], "reasons": ["", "The harm to the people downstream is a cost on top of the plant's own costs. It raises the social cost; it does not reduce it.", "The plant pays for its inputs but not for the damage its waste does downstream. That damage is part of the social cost.", "The river having no owner is why the harm goes unpaid. It does not make the harm cost nothing."], "answer": 0, "why": "Social cost is the private cost to the producer plus the external cost to bystanders. The plant pays its own costs but not the harm to the people who fish downstream. Adding that harm makes the social cost higher than the private cost.", "key": "ch10-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Positive externalities", "stem": "A beekeeper's bees pollinate a neighboring apple orchard and raise its harvest. The orchard owner pays the beekeeper nothing. Left to the market, the number of hives the beekeeper keeps is", "options": ["more than the socially optimal number.", "exactly the socially optimal number.", "fewer than the socially optimal number.", "zero."], "reasons": ["The beekeeper ignores a benefit to the orchard, not a cost to it. Ignoring a benefit leads to keeping too few hives, not too many.", "The beekeeper counts only her own benefit from the hives and leaves out the benefit to the orchard, so her choice is not the social optimum.", "", "The beekeeper keeps hives for her own benefit, such as honey. The externality makes her keep too few, not none."], "answer": 2, "why": "The pollination is a positive externality: a benefit to the orchard that the beekeeper is not paid for. The beekeeper decides how many hives to keep by comparing her own benefit with her cost, and leaves out the benefit to the orchard. The social value of a hive is therefore higher than the value she counts, so she keeps fewer hives than is socially optimal.", "key": "ch10-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Corrective taxes", "stem": "Suppose the government charges sellers a per-unit tax equal to the harm each unit does to bystanders. This tax brings output to the socially optimal level.", "answer": true, "why": "A tax equal to the external cost of each unit makes sellers pay that cost as if it were their own. Their supply curve then rises to the social-cost curve, and the market settles where social cost equals the value to buyers. That is the socially optimal quantity. This is what it means to internalize the externality.", "key": "ch10-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Positive externalities", "stem": "Free markets tend to produce too much of goods whose use benefits bystanders, such as vaccines.", "answer": false, "why": "With a positive externality, the good is worth more to society than to the buyers, because bystanders benefit too. Buyers and sellers ignore that extra benefit, so the market produces less than the socially optimal quantity, not more. Producing too much is what happens with a negative externality.", "key": "ch10-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Socially optimal quantity", "stem": "The table shows the value to buyers and the private cost to sellers of each unit of a good. Producing each unit also causes $6 of harm to people who live near the factory. What is the socially optimal quantity?", "table": {"header": ["Unit", "Value to buyers", "Private cost"], "rows": [["1st", "$30", "$9"], ["2nd", "$27", "$12"], ["3rd", "$24", "$15"], ["4th", "$21", "$18"], ["5th", "$18", "$21"]]}, "options": ["2 units", "3 units", "4 units", "5 units"], "reasons": ["The 3rd unit is worth $24 to buyers and costs society $15 + $6 = $21, so producing it adds to total surplus. Stopping at 2 units is too few.", "", "4 units is what the market produces, because it counts only the private cost. The 4th unit is worth $21 but costs society $18 + $6 = $24.", "The 5th unit is worth $18 to buyers but costs society $21 + $6 = $27, and even its private cost of $21 exceeds its value."], "answer": 1, "why": "The social cost of each unit is its private cost plus the $6 of harm: $15, $18, $21, $24 and $27. A unit should be produced when its value to buyers is at least its social cost. The 1st ($30 vs $15), 2nd ($27 vs $18) and 3rd ($24 vs $21) units pass. The 4th does not ($21 vs $24). So the socially optimal quantity is 3 units.", "key": "ch10-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Corrective taxes", "stem": "The table shows the private cost to sellers and the social cost of each unit of a good. The gap between them is harm to people who live near the factory. Which per-unit tax on sellers would make them count the full social cost of their output?", "options": ["$6", "$3", "$9", "$21"], "reasons": ["", "$3 covers only half of the $6 gap between social and private cost, so sellers would still leave out part of the harm.", "$9 is the private cost of the 1st unit. The tax should equal the harm per unit, the gap between social and private cost.", "$21 is the whole social cost of the 3rd unit. Taxing that much would charge sellers far more than the harm and cut output too far."], "answer": 0, "why": "The harm from each unit is social cost minus private cost: $15 − $9 = $18 − $12 = $21 − $15 = $24 − $18 = $6. A corrective tax equal to that external cost, $6 per unit, makes sellers count the full social cost of each unit, so the market produces the socially optimal quantity.", "table": {"header": ["Unit", "Private cost", "Social cost"], "rows": [["1st", "$9", "$15"], ["2nd", "$12", "$18"], ["3rd", "$15", "$21"], ["4th", "$18", "$24"]]}, "key": "ch10-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Tradable pollution permits", "stem": "Two factories each emit 100 tons of smoke a year. Cutting one ton costs Factory A $50 and Factory B $200. The government wants total smoke cut by 100 tons. Which policy reaches that target at the lowest total cost?", "options": ["Require each factory to cut 50 tons.", "Ban all smoke from both factories.", "Give each factory permits for 50 tons of smoke and let them trade the permits.", "Require Factory B to make the whole 100-ton cut."], "reasons": ["Equal cuts cost 50 × $50 + 50 × $200 = $12,500, because Factory B makes half the cuts at its high cost.", "A ban cuts 200 tons, twice the target, and costs 100 × $50 + 100 × $200 = $25,000.", "", "Making Factory B do all the cutting costs 100 × $200 = $20,000, because every ton is cut by the high-cost factory."], "answer": 2, "why": "The cheapest way to cut 100 tons is for Factory A, which cuts at $50 a ton, to do all of it: 100 × $50 = $5,000. Tradable permits achieve this. Factory B values a permit at up to $200, the cost of cutting a ton itself, while Factory A needs only $50 to cut a ton instead. So Factory A sells its 50 permits to Factory B and cuts all 100 tons of its smoke. Equal cuts would cost $12,500.", "key": "ch10-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "The Coase theorem", "stem": "Ana values playing loud music at night at $50. Her neighbor values a quiet night at $80. Ana has the legal right to play music, and the two can bargain at no cost. The Coase theorem predicts that the music will stop.", "answer": true, "why": "Quiet is worth $80 to the neighbor and the music is worth only $50 to Ana, so stopping the music is the efficient outcome. Even though Ana has the right to play, the neighbor can pay her any amount between $50 and $80 to stop, and both are better off. The Coase theorem says that when bargaining costs nothing, the parties reach the efficient outcome whoever holds the right.", "key": "ch10-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Subsidies for positive externalities", "stem": "Each flu shot gives $15 of benefit to people other than the person vaccinated, because fewer people catch the flu. Which per-shot policy moves the market to the socially optimal number of flu shots?", "options": ["A $15 tax on each flu shot", "A ban on flu shots sold without a prescription", "No policy, because people who get flu shots already benefit from them", "A $15 subsidy for each flu shot"], "reasons": ["A tax would reduce the number of flu shots, but the market already provides too few because buyers ignore the $15 benefit to others.", "Restricting flu shots would reduce their number further, when the market already provides too few.", "People count their own benefit but not the $15 benefit to others, so the market provides fewer flu shots than is socially optimal.", ""], "answer": 3, "why": "Flu shots create a positive externality of $15 per shot. Because buyers ignore that benefit to others, the market provides fewer shots than is socially optimal. A $15 subsidy per shot makes each shot $15 cheaper, which brings the external benefit into buyers' decisions and raises the number of shots to the socially optimal quantity.", "key": "ch10-M5"}]}, {"chapter": 11, "title": "Public Goods and Common Resources", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Rival in consumption", "stem": "Once a customer eats a sandwich bought from a deli, no one else can eat that same sandwich. This feature of the sandwich is called", "options": ["excludability.", "rivalry in consumption.", "the free-rider problem.", "a positive externality."], "answer": 1, "why": "A good is rival in consumption when one person's use of it leaves less for anyone else. A sandwich that has been eaten is gone, so it is rival. Excludability is a different property: whether people who do not pay can be kept from using the good. The free-rider problem arises when a good is not excludable, and a positive externality is a benefit to bystanders. Neither is a property of the sandwich itself.", "reasons": ["Excludability is about whether people who do not pay can be kept from using a good, not about whether one person's use leaves less for others.", "", "The free-rider problem arises when people cannot be kept from using a good. It is not a property of the sandwich.", "A positive externality is a benefit to bystanders. Eating a sandwich gives no benefit to anyone else."], "key": "ch11-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Public goods", "stem": "A radio station broadcasts a free weather forecast. Anyone with a radio can hear it, and one listener tuning in does not reduce what any other listener hears. The forecast is best classified as a", "options": ["private good.", "club good.", "common resource.", "public good."], "answer": 3, "why": "The forecast is not excludable, because anyone with a radio can hear it without paying. It is not rival, because one listener does not reduce what others hear. A good that is neither excludable nor rival is a public good. A private good is both excludable and rival, a club good is excludable but not rival, and a common resource is rival but not excludable.", "reasons": ["A private good is both excludable and rival. Anyone with a radio can hear this forecast, and one listener does not reduce what others hear.", "A club good is one that people who do not pay can be kept from using. Anyone with a radio can hear this forecast.", "A common resource is rival: one person's use leaves less for others. Here one listener does not reduce what anyone else hears.", ""], "key": "ch11-E2"}, {"id": "E3", "difficulty": "Easy", "type": "tf", "topic": "Club goods", "stem": "A video-streaming service that sells monthly subscriptions and has plenty of server capacity is an example of a common resource.", "answer": false, "why": "The service is excludable, because people who do not subscribe are shut out. With plenty of capacity it is not rival, because one more viewer does not slow anyone else down. A good that is excludable but not rival is a club good. A common resource is the opposite case: rival but not excludable.", "key": "ch11-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Common resources", "stem": "Tuna swimming in international waters, which any boat may fish, are a public good.", "answer": false, "why": "Any boat may fish international waters, so the tuna are not excludable. But a tuna caught by one boat cannot be caught by another, so the tuna are rival. A public good must be neither excludable nor rival. A good that is rival but not excludable is a common resource, which is what the tuna are.", "key": "ch11-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Free riders", "stem": "A homeowner who benefits from the streetlight on her block but refuses to contribute to the neighborhood fund that pays for it is a free rider.", "answer": true, "why": "A free rider is a person who receives the benefit of a good but avoids paying for it. The streetlight lights her block whether or not she contributes, because she cannot be excluded from its benefit. By refusing to pay, she gets the benefit for nothing, which is exactly what free riding means.", "key": "ch11-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Cost-benefit analysis", "stem": "Three residents would use a new footbridge over a creek. Dana values the bridge at $150, Eli at $90, and Fran at $60. No one else values it. All three can use the bridge at the same time without getting in each other's way. The bridge costs $250 to build. What should the town do?", "options": ["Build it only if each resident values it at $250 or more.", "Do not build it, because no single resident values it at more than $250.", "Build it, because the total benefit of $300 is greater than the cost of $250.", "Do not build it, because Fran values it at less than an equal one-third share of the cost."], "answer": 2, "why": "Because all three can use the bridge at the same time, the benefit to the town is the sum of their valuations, $150 + $90 + $60 = $300. That is greater than the $250 cost, so building it raises total surplus by $50. No single resident needs to value it above the full cost. How the cost is shared is a separate question; Fran's $60 being below an equal share of about $83.33 does not change whether the bridge is worth building.", "reasons": ["No single resident needs to value the bridge at its full cost. All three use the same bridge, so what matters is the total of their valuations.", "No single resident needs to value the bridge at more than its cost. All three use the same bridge, so what matters is the total of their valuations.", "", "How the cost is shared is a separate question from whether the bridge is worth building."], "key": "ch11-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Efficient quantity of a public good", "stem": "A small town has three residents, Ana, Ben, and Cara. All three benefit from every streetlight on their road. The table shows how much each would pay for each additional streetlight. Each streetlight costs $30 to install. How many streetlights maximize total surplus?", "table": {"header": ["Streetlight", "Ana", "Ben", "Cara"], "rows": [["1st", "$30", "$25", "$15"], ["2nd", "$20", "$15", "$10"], ["3rd", "$12", "$10", "$6"], ["4th", "$5", "$4", "$1"]]}, "options": ["1", "2", "3", "4"], "answer": 1, "why": "All three residents benefit from every light at once, so the value of each light is the sum of what all three residents would pay for it. The 1st light is worth $30 + $25 + $15 = $70, the 2nd $20 + $15 + $10 = $45, the 3rd $12 + $10 + $6 = $28, and the 4th $5 + $4 + $1 = $10. Install a light whenever its total value is at least its $30 cost. The 1st ($70) and 2nd ($45) pass; the 3rd ($28) does not. So 2 streetlights maximize total surplus. Comparing each person's value with the cost separately would wrongly give only 1.", "reasons": ["Comparing each resident's value with the $30 cost on its own ignores that all three benefit from the same light. Add their values for each light.", "", "The 3rd light is worth $12 + $10 + $6 = $28 to the three residents together, which is less than its $30 cost.", "The 4th light is worth only $5 + $4 + $1 = $10 to the three residents together, far below its $30 cost."], "key": "ch11-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Solving the Tragedy of the Commons", "stem": "Anyone may fish a large lake, and the fish stock is falling. The state caps the total catch and sells fishing permits; only permit holders may fish, up to the amount on their permit. Which property of the fish does the permit system change?", "options": ["It makes the fish excludable, because people without a permit may no longer fish.", "It makes the fish nonrival, because the total catch is capped.", "It turns the fish into a public good.", "It removes the externality by subsidizing fishing."], "answer": 0, "why": "Before the permits, anyone could fish, so the fish were not excludable; they were a common resource. The permits shut out anyone without one, which makes the fish excludable. The fish are still rival: a fish one permit holder catches cannot be caught by another, and capping the total does not change that. The fish therefore do not become nonrival or a public good, and a permit is a charge for access, not a subsidy.", "reasons": ["", "Capping the total catch does not make the fish nonrival. A fish caught by one permit holder still cannot be caught by another.", "A public good is not rival. With permits the fish are still rival, because each fish can be caught only once.", "A permit is a charge for access to the lake, not a subsidy."], "key": "ch11-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Public goods", "stem": "The total benefit to a town of a public good, such as a fireworks display, equals the largest amount any single resident would pay for it.", "answer": false, "why": "A public good is not rival, so every resident enjoys the same display at the same time. The total benefit is therefore the sum of what all residents would pay, not the largest single amount. This is why a public good can be worth providing even when no single person would pay its full cost.", "key": "ch11-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Tragedy of the Commons", "stem": "Anyone may fish a lake, which holds a limited stock of fish. When a fisher decides whether to add another boat, she ignores one cost of that decision. That cost is", "options": ["the price she receives for her fish.", "the cost of her own boat and fuel.", "the wages she pays her crew.", "the reduction in the catch of the other boats."], "answer": 3, "why": "The fish are a common resource: rival but not excludable. When she adds a boat, she counts her own costs and her own extra catch. She does not count the fish that the other boats now fail to catch. That loss falls on other people, so it is a negative externality, and because every fisher ignores it, the lake is overfished. This is the Tragedy of the Commons. The price of fish, her boat and fuel, and her crew's wages are all things she does take into account.", "reasons": ["The price she receives is part of her own revenue, and she takes it into account.", "The cost of her own boat and fuel falls on her, and she takes it into account.", "She pays her crew's wages herself, so she takes them into account.", ""], "key": "ch11-M5"}]}, {"chapter": 14, "title": "The Costs of Production", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Explicit and implicit costs", "stem": "A dentist owns her office building outright and runs her practice in it. Which of the following is an implicit cost of her practice?", "options": ["The salaries she pays her dental hygienists", "The rent she could earn by leasing the building to another firm", "The cost of dental supplies", "The practice's electricity bill"], "answer": 1, "why": "An implicit cost is an opportunity cost that does not require the firm to pay out money. By using the building herself, the dentist gives up the rent another firm would pay her for it, but she writes no check for it. Salaries, supplies and electricity are all paid out in money, so they are explicit costs.", "reasons": ["Salaries are paid out in money, so they are an explicit cost.", "", "Dental supplies are paid for in money, so they are an explicit cost.", "The electricity bill is paid in money, so it is an explicit cost."], "key": "ch14-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Fixed and variable costs", "stem": "A bakery pays each month for flour, the wages of hourly counter staff, electricity to run its ovens, and the lease on its shop. Which of these is a fixed cost?", "options": ["The flour", "The wages of hourly counter staff", "The electricity to run its ovens", "The lease on its shop"], "answer": 3, "why": "A fixed cost does not change with the quantity of output. The lease is the same whether the bakery bakes 100 loaves a month or 10,000. Flour, hourly wages and oven electricity all rise as the bakery produces more, so they are variable costs.", "reasons": ["The bakery uses more flour when it bakes more, so flour is a variable cost.", "Hourly staff are paid for the hours they work, and those hours rise with output, so their wages are a variable cost.", "The ovens use more electricity when the bakery bakes more, so this is a variable cost.", ""], "key": "ch14-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Marginal product", "stem": "A print shop produces 240 posters a day with 4 workers and 285 posters a day with 5 workers. The marginal product of the fifth worker is", "options": ["45 posters.", "57 posters.", "60 posters.", "285 posters."], "answer": 0, "why": "The marginal product of a worker is the increase in output from hiring that worker: 285 − 240 = 45 posters. 57 posters is output per worker with five workers (285 ÷ 5), and 60 is output per worker with four (240 ÷ 4); both are averages, not the change. 285 is total output.", "reasons": ["", "57 is total output divided by five workers (285 ÷ 5). That is output per worker, not the extra output the fifth worker adds.", "60 is 240 ÷ 4, output per worker with four workers. It is not the change in output.", "285 is total output with five workers, not the extra output the fifth worker adds."], "key": "ch14-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Average fixed cost", "stem": "A gym pays $6,000 a month for its lease. If its membership doubles from 300 to 600, the lease cost per member halves, from $20 to $10.", "answer": true, "why": "The lease is a fixed cost: it stays $6,000 a month however many members the gym has. Cost per member is $6,000 ÷ 300 = $20 with 300 members and $6,000 ÷ 600 = $10 with 600, so it halves. This is average fixed cost, and it always falls as output rises because the same fixed cost is spread over more units.", "key": "ch14-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Economic and accounting profit", "stem": "A firm can have a positive accounting profit and a negative economic profit at the same time.", "answer": true, "why": "Accounting profit subtracts only explicit costs from total revenue. Economic profit subtracts both explicit and implicit costs, such as the salary the owner gave up. If the implicit costs are larger than the accounting profit, the economic profit is negative even though the accounting profit is positive.", "key": "ch14-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Economic profit", "stem": "Priya leaves a job that paid $90,000 a year to run her own consulting firm. She starts the firm with $50,000 of her own savings, which would otherwise have earned 4 percent a year. In its first year the firm takes in $210,000 of revenue and pays $85,000 in rent, staff wages and software. What is the firm's economic profit for the year?", "options": ["$125,000", "$35,000", "$123,000", "$33,000"], "answer": 3, "why": "Economic profit is total revenue minus explicit and implicit costs. Explicit costs are $85,000, so accounting profit is $210,000 − $85,000 = $125,000. Implicit costs are the $90,000 salary she gave up plus the interest her savings would have earned, 4% × $50,000 = $2,000, for a total of $92,000. Economic profit is $125,000 − $92,000 = $33,000. $125,000 ignores the implicit costs, $35,000 leaves out the forgone interest, and $123,000 leaves out the forgone salary.", "reasons": ["$125,000 is accounting profit. It leaves out the implicit costs: the salary and the interest she gave up.", "$35,000 subtracts the $90,000 salary she gave up but leaves out the interest her savings would have earned.", "$123,000 subtracts the forgone interest but leaves out the $90,000 salary she gave up.", ""], "key": "ch14-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Average total cost", "stem": "The table shows a firm's total cost at each level of output. At which quantity is average total cost lowest?", "table": {"header": ["Output (units)", "Total cost"], "rows": [["0", "$100"], ["1", "$140"], ["2", "$170"], ["3", "$210"], ["4", "$270"], ["5", "$350"]]}, "options": ["2 units", "3 units", "4 units", "5 units"], "answer": 2, "why": "Average total cost is total cost divided by output: $140 at 1 unit, $170 ÷ 2 = $85 at 2 units, $210 ÷ 3 = $70 at 3 units, $270 ÷ 4 = $67.50 at 4 units, and $350 ÷ 5 = $70 at 5 units. The lowest is $67.50, at 4 units. The marginal costs confirm it. The 4th unit costs $270 − $210 = $60, which is below the $70 average at 3 units, so the average falls. The 5th unit costs $350 − $270 = $80, which is above the $67.50 average at 4 units, so the average rises.", "reasons": ["At 2 units average total cost is $170 ÷ 2 = $85, and it is lower at another output.", "At 3 units average total cost is $210 ÷ 3 = $70, and it is lower at another output.", "", "At 5 units average total cost is $350 ÷ 5 = $70, and it is lower at another output."], "key": "ch14-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Marginal cost and average total cost", "stem": "Producing 20 units costs a firm $300 in total, an average of $15 a unit. Making a 21st unit adds $12 to total cost. With 21 units, the firm's average total cost", "options": ["rises above $15.", "falls below $15.", "stays at exactly $15.", "falls to $12."], "answer": 1, "why": "Total cost at 20 units is 20 × $15 = $300. Adding the 21st unit at $12 makes total cost $312, so average total cost is $312 ÷ 21 ≈ $14.86, which is below $15. The general rule: when marginal cost is below average total cost, producing one more unit pulls the average down. It does not fall all the way to $12, because the $12 unit is averaged with the 20 units that came before it.", "reasons": ["The 21st unit costs $12, less than the $15 average, so adding it cannot raise the average.", "", "The average stays the same only if the extra unit costs exactly the average, $15. This one costs $12.", "The $12 unit is averaged with the 20 units already made, so the average does not fall all the way to $12."], "key": "ch14-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Diminishing marginal product", "stem": "A restaurant hires a sixth cook and its meals served per night rise, but by less than they rose when it hired the fifth cook. The restaurant's total output must therefore be falling.", "answer": false, "why": "The sixth cook still adds to output, because meals served rise. What falls is the marginal product: the sixth cook adds fewer meals than the fifth did. That is diminishing marginal product. Total output keeps rising as long as marginal product is positive; it falls only if an extra cook adds a negative amount.", "key": "ch14-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Economies of scale", "stem": "In the long run, a furniture maker's total cost is $40,000 to make 100 tables and $72,000 to make 200 tables. Over this range of output, the firm has", "options": ["economies of scale, because long-run average total cost falls from $400 to $360 per table.", "diseconomies of scale, because long-run total cost rises from $40,000 to $72,000.", "constant returns to scale, because output doubles.", "diseconomies of scale, because the extra 100 tables add $32,000 to total cost."], "answer": 0, "why": "Economies of scale are judged by long-run average total cost, not total cost. Average cost is $40,000 ÷ 100 = $400 per table at 100 tables and $72,000 ÷ 200 = $360 per table at 200 tables. Average cost falls as output rises, so the firm has economies of scale. Total cost always rises when output rises, so a rising total cost says nothing about scale. Constant returns would require average cost to stay the same, which it does not.", "reasons": ["", "Scale is judged by average cost, not total cost. Total cost always rises when output rises.", "Constant returns would need average cost to stay the same. Compare $40,000 ÷ 100 with $72,000 ÷ 200.", "The extra 100 tables cost $32,000 ÷ 100 = $320 each, less than the $400 average before, so they pull the average down, not up."], "key": "ch14-M5"}]}];
const app = document.getElementById("app");
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("ec111-practice") || "{}"); } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem("ec111-practice", JSON.stringify(v)); } catch(e){} }
};
let progress = store.get();
let pick = {chapters: new Set(CHAPTERS.map(c => c.chapter)), level: "Both"};
let run = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chosen(){
  const qs = [];
  for (const c of CHAPTERS) if (pick.chapters.has(c.chapter))
    for (const q of c.questions) if (pick.level === "Both" || q.difficulty === pick.level) qs.push({...q, chapter: c.chapter});
  return qs.sort((a,b) => a.chapter - b.chapter || (a.difficulty === b.difficulty ? 0 : a.difficulty === "Easy" ? -1 : 1));
}
function home(){
  run = null;
  let h = `<h1>EC 111 Practice Questions</h1><p class="sub">Principles of Microeconomics. Choose the chapters and the level. Wrong answers come with an explanation; on multiple choice you get a second try first.</p><h2>Chapters</h2>`;
  for (const c of CHAPTERS){
    const tried = c.questions.filter(q => progress[q.key]).length;
    const first = c.questions.filter(q => progress[q.key] === "first").length;
    h += `<label class="row"><input type="checkbox" data-ch="${c.chapter}" ${pick.chapters.has(c.chapter) ? "checked" : ""}> <span><b>Chapter ${c.chapter}</b> ${esc(c.title)}</span><small>${tried} of ${c.questions.length} tried · ${first} right first time</small></label>`;
  }
  h += `<h2>Level</h2><div class="seg">` + ["Easy","Moderate","Both"].map(l => `<button data-lv="${l}" class="${pick.level === l ? "on" : ""}">${l}</button>`).join("") + `</div>`;
  const n = chosen().length;
  h += `<button class="go" id="start" ${n ? "" : "disabled"}>Start · ${n} question${n === 1 ? "" : "s"}</button>`;
  h += `<p class="foot">Progress is saved in this browser only. <a href="#" id="reset">Clear my progress</a> · <a href="../">Back to the book</a></p>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-ch]").forEach(b => b.onchange = () => { const ch = +b.dataset.ch; b.checked ? pick.chapters.add(ch) : pick.chapters.delete(ch); home(); });
  app.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { pick.level = b.dataset.lv; home(); });
  document.getElementById("start").onclick = () => { run = {qs: chosen(), i: 0, firstRight: 0}; show(); };
  document.getElementById("reset").onclick = e => { e.preventDefault(); progress = {}; store.set(progress); home(); };
}
function show(){
  const q = run.qs[run.i];
  const opts = q.type === "mc" ? q.options : ["True","False"];
  let h = `<div class="meta"><span>Chapter ${q.chapter} · ${q.difficulty} · ${q.type === "mc" ? "Multiple choice" : "True or false"}</span><span>${run.i + 1} of ${run.qs.length}</span></div>`;
  h += `<div class="stem">${esc(q.stem)}</div>`;
  if (q.table){
    h += `<table><tr>${q.table.header.map(x => `<th>${esc(x)}</th>`).join("")}</tr>`;
    for (const r of q.table.rows) h += `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`;
    h += `</table>`;
  }
  opts.forEach((o, k) => h += `<button class="opt" data-k="${k}"><span class="l">${q.type === "mc" ? "abcdefgh"[k] + "." : ""}</span>${esc(o)}</button>`);
  h += `<div id="fb"></div>`;
  app.innerHTML = h; window.scrollTo(0, 0);
  const right = q.type === "mc" ? q.answer : (q.answer ? 0 : 1);
  let tries = 0;
  const btns = [...app.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    const k = +b.dataset.k; tries++;
    const fb = document.getElementById("fb");
    if (k === right || q.type === "tf" || tries >= 2){
      btns.forEach(x => x.disabled = true);
      btns[right].classList.add("right");
      if (k !== right) b.classList.add("wrong");
      const first = k === right && tries === 1;
      if (first) run.firstRight++;
      if (!progress[q.key] || first) progress[q.key] = first ? "first" : "tried";
      store.set(progress);
      const last = run.i === run.qs.length - 1;
      fb.innerHTML = `<div class="msg ${k === right ? "good" : "bad"}">${k === right ? "Correct." : "Not correct. The answer is " + (q.type === "mc" ? "abcdefgh"[right] + "." : opts[right] + ".")}</div>${k !== right && q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : ""}<div class="why">${esc(q.why)}</div><div class="nav"><button id="quit">Back to chapters</button><button class="on" id="next">${last ? "See my score" : "Next question"}</button></div>`;
      document.getElementById("quit").onclick = home;
      document.getElementById("next").onclick = () => { if (last) done(); else { run.i++; show(); } };
    } else {
      b.classList.add("wrong"); b.disabled = true;
      const why = q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : "";
      fb.innerHTML = `<div class="msg bad">Not quite.</div>${why}<div class="msg">Try once more.</div>`;
    }
  });
}
function done(){
  app.innerHTML = `<h1>Finished</h1><p class="score">${run.firstRight} of ${run.qs.length} right first time</p><div class="nav"><button id="again">Same set again</button><button class="on" id="menu">Back to chapters</button></div>`;
  document.getElementById("again").onclick = () => { run.i = 0; run.firstRight = 0; show(); };
  document.getElementById("menu").onclick = home;
}
home();
</script></body></html>
