<script>
const CHAPTERS = [{"chapter": 7, "title": "Consumers, Producers, and the Efficiency of Markets", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Consumer surplus", "stem": "Dana would pay up to $1,200 for a used laptop. She buys one for $950. Her consumer surplus is", "options": ["$950.", "$1,200.", "$250.", "$2,150."], "reasons": ["$950 is the price she pays, not the gain she gets from buying.", "$1,200 is her willingness to pay, the most she would pay. Her surplus is what she gains beyond the price.", "", "$2,150 adds the price to her willingness to pay. Consumer surplus subtracts the price from it."], "answer": 2, "why": "Consumer surplus is the amount a buyer is willing to pay minus the amount she actually pays. Dana would pay up to $1,200 and pays $950, so her consumer surplus is $1,200 − $950 = $250.", "key": "ch7-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Producer surplus", "stem": "A cabinetmaker's cost of building a bookcase, including the value of her own time, is $300. She sells the bookcase for $420. Her producer surplus on the sale is", "options": ["$120.", "$300.", "$420.", "$720."], "reasons": ["", "$300 is her cost of building the bookcase, not her gain from selling it.", "$420 is the price she receives. Her surplus is what she receives beyond her cost.", "$720 adds the price to the cost. Producer surplus subtracts the cost from the price."], "answer": 0, "why": "Producer surplus is the amount a seller is paid minus the seller's cost. She is paid $420 and her cost is $300, so her producer surplus is $420 − $300 = $120.", "key": "ch7-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Producer surplus on a graph", "stem": "Add up, across every seller, the price received minus that seller's cost. On a supply-and-demand diagram, this total appears as the region", "options": ["below the demand curve and above the price.", "below the price and above the supply curve.", "between the demand curve and the supply curve.", "below the supply curve."], "reasons": ["The area below the demand curve and above the price is consumer surplus: what buyers would pay beyond what they do pay.", "", "The area between the demand curve and the supply curve, up to the quantity sold, is total surplus: consumer and producer surplus together.", "The area below the supply curve measures sellers' costs, not the gain they make above those costs."], "answer": 1, "why": "The supply curve shows each seller's cost. Each seller is paid the price, so the gain on each unit is the gap between the price and the supply curve. Adding up those gaps gives the area below the price and above the supply curve, which is producer surplus.", "key": "ch7-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Consumer surplus", "stem": "If the market price of a good falls, the consumer surplus of buyers who were already buying it rises.", "answer": true, "why": "Each existing buyer's willingness to pay is unchanged, but each now pays less. Consumer surplus is willingness to pay minus price, so a lower price raises the surplus of every buyer who was already buying. New buyers who enter at the lower price add further surplus.", "key": "ch7-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Efficiency and equality", "stem": "An efficient allocation of resources is one that divides total surplus equally between buyers and sellers.", "answer": false, "why": "Efficiency means total surplus is as large as possible. It says nothing about how that surplus is divided. Whether buyers and sellers share it equally is a question of equality, not efficiency.", "key": "ch7-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Consumer surplus from a table", "stem": "Four buyers want one concert ticket each. Their willingness to pay is shown in the table. The tickets sell for $55 each. What is the total consumer surplus in this market?", "table": {"header": ["Buyer", "Willingness to pay"], "rows": [["Ava", "$90"], ["Ben", "$75"], ["Cal", "$60"], ["Dee", "$45"]]}, "options": ["$50", "$55", "$60", "$225"], "reasons": ["$50 counts Dee as a buyer. She values a ticket at only $45, less than the $55 price, so she does not buy.", "$55 leaves out Cal. He values a ticket at $60, more than the $55 price, so he buys and gains $5.", "", "$225 is the three buyers' total willingness to pay. Consumer surplus subtracts the price each one pays."], "answer": 2, "why": "A buyer buys when her willingness to pay is at least the price. At $55, Ava, Ben and Cal buy; Dee, at $45, does not. Their surpluses are $90 − $55 = $35, $75 − $55 = $20 and $60 − $55 = $5. Total consumer surplus is $35 + $20 + $5 = $60.", "key": "ch7-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Total surplus", "stem": "A buyer would pay up to $700 for a used motorcycle. The seller's cost of selling it is $450. They agree on a price of $600. The total surplus from this trade is", "options": ["$250.", "$100.", "$150.", "$600."], "reasons": ["", "$100 is only the buyer's surplus ($700 − $600). Total surplus adds the seller's surplus.", "$150 is only the seller's surplus ($600 − $450). Total surplus adds the buyer's surplus.", "$600 is the price. The price is paid by one side and received by the other, so it is not a gain to the two of them together."], "answer": 0, "why": "The buyer's surplus is $700 − $600 = $100. The seller's surplus is $600 − $450 = $150. Total surplus is $100 + $150 = $250. The same answer comes from value to the buyer minus cost to the seller: $700 − $450 = $250. The price only divides the surplus between them.", "key": "ch7-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Efficiency of the market equilibrium", "stem": "A competitive market is in equilibrium. If one more unit were produced and sold beyond the equilibrium quantity, total surplus would", "options": ["rise, because more of the good is produced.", "fall, because the cost to sellers of that unit is greater than its value to buyers.", "stay the same, because the price does not change.", "rise, because buyers would pay less for that unit."], "reasons": ["Producing more raises total surplus only when the extra unit is worth more to buyers than it costs sellers. Beyond the equilibrium that is not the case.", "", "Total surplus depends on the value and cost of each unit traded, not on the price. Adding a unit changes total surplus by its value minus its cost.", "The price only moves surplus between buyers and sellers. It cannot make a unit that costs more than it is worth add to total surplus."], "answer": 1, "why": "Beyond the equilibrium quantity the supply curve lies above the demand curve. That means the cost to the marginal seller of an extra unit is greater than the value to the marginal buyer. Producing that unit adds more cost than value, so total surplus falls. This is why the equilibrium quantity maximizes total surplus.", "key": "ch7-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Producer surplus from a table", "stem": "Four house painters can each paint one house. Their costs are shown in the table. The market price for painting a house is $300. What is the total producer surplus in this market?", "table": {"header": ["Painter", "Cost"], "rows": [["Eli", "$200"], ["Fay", "$260"], ["Gus", "$320"], ["Hal", "$380"]]}, "options": ["$600", "$100", "$120", "$140"], "reasons": ["$600 is the two painters' combined revenue, 2 × $300. Producer surplus subtracts each painter's cost.", "$100 is Eli's surplus alone. Fay's cost of $260 is below the $300 price, so she also paints and gains $40.", "$120 counts Gus as a seller. His cost of $320 is above the $300 price, so he does not paint.", ""], "answer": 3, "why": "A painter sells when the price is at least his or her cost. At $300, Eli and Fay paint; Gus and Hal do not. Their surpluses are $300 − $200 = $100 and $300 − $260 = $40. Total producer surplus is $100 + $40 = $140.", "key": "ch7-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Efficiency", "stem": "If a buyer's willingness to pay for a good is less than a seller's cost of producing it, an efficient outcome does not include that trade.", "answer": true, "why": "A trade adds to total surplus only if the good is worth more to the buyer than it costs the seller. Here the value to the buyer is less than the cost, so the trade would lower total surplus. An efficient outcome, which makes total surplus as large as possible, leaves it out.", "key": "ch7-M5"}]}, {"chapter": 9, "title": "Application: International Trade", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Direction of trade", "stem": "Before trade, steel sells for $600 a ton in Country X. The world price is $800 a ton. When Country X opens to trade, it will", "options": ["import steel, because its price is below the world price.", "neither import nor export steel.", "export steel, because its domestic price is below the world price.", "import steel, because foreign steel must be better."], "reasons": ["A domestic price below the world price means producers in Country X can sell abroad for more. That leads to exports, not imports.", "The domestic price differs from the world price, so trade takes place.", "", "The steel is the same everywhere. Which way trade flows depends on prices, not on where the steel is made."], "answer": 2, "why": "A domestic price below the world price shows that Country X has a comparative advantage in steel. Once trade is allowed, its producers can sell at the higher world price of $800, so they sell abroad. The domestic price rises to $800 and the country exports steel.", "key": "ch9-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Winners and losers", "stem": "A country opens to trade in a good whose world price is below the country's price before trade. Compared with no trade,", "options": ["domestic buyers gain and domestic sellers lose.", "domestic sellers gain and domestic buyers lose.", "both domestic buyers and domestic sellers gain.", "both domestic buyers and domestic sellers lose."], "reasons": ["", "Sellers gain when the price rises. Here the price falls to the world price, so sellers lose and buyers gain.", "The lower price helps buyers but hurts sellers, who now receive less for each unit.", "Buyers pay less and buy more, so they gain."], "answer": 0, "why": "With the world price below the domestic price, the country imports the good and its domestic price falls to the world price. Buyers pay less and buy more, so consumer surplus rises. Domestic sellers receive less and sell less, so producer surplus falls. The buyers' gain is larger than the sellers' loss.", "key": "ch9-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Tariffs", "stem": "A tariff is", "options": ["a limit on the quantity of a good that may be imported.", "a payment to domestic firms for each unit they export.", "a rule that imported goods must meet safety standards.", "a tax on goods produced abroad and sold at home."], "reasons": ["A limit on the quantity imported is an import quota, not a tariff.", "A payment for each unit exported is an export subsidy.", "A safety rule is a regulation. It does not tax imports.", ""], "answer": 3, "why": "A tariff is a tax on imported goods. It raises the domestic price above the world price, which increases domestic production, reduces domestic purchases and cuts imports.", "key": "ch9-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Gains from trade", "stem": "When a country opens to trade, the gains of those who benefit exceed the losses of those who are hurt, so total surplus in the country rises.", "answer": true, "why": "Trade creates winners and losers. In an exporting country sellers gain and buyers lose; in an importing country buyers gain and sellers lose. In both cases the winners' gains are larger than the losers' losses, so total surplus rises.", "key": "ch9-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Tariffs", "stem": "A tariff on an imported good lowers the price that domestic buyers pay for that good.", "answer": false, "why": "A tariff is a tax on imports. It raises the domestic price above the world price by the amount of the tariff. Domestic buyers pay more and buy less.", "key": "ch9-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Imports from a table", "stem": "The table shows domestic demand and domestic supply of bicycles in a small country. The world price of a bicycle is $120. With free trade, how many bicycles does the country import?", "table": {"header": ["Price", "Quantity demanded", "Quantity supplied"], "rows": [["$120", "90", "30"], ["$150", "80", "40"], ["$180", "70", "50"], ["$210", "60", "60"]]}, "options": ["30", "60", "90", "0"], "reasons": ["30 is the number domestic producers supply at $120. Imports are the gap between what buyers want and what domestic firms supply.", "", "90 is the total quantity bought at $120. Domestic producers supply 30 of those, so not all 90 are imported.", "There would be no imports only at the no-trade price of $210. At the world price of $120, buyers want more than domestic firms supply."], "answer": 1, "why": "Without trade the price would be $210, where 60 are demanded and 60 supplied. With free trade the domestic price falls to the world price of $120. At $120 buyers want 90 and domestic firms supply 30. The gap, 90 − 30 = 60, is imported.", "key": "ch9-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Tariff revenue", "stem": "The table shows domestic demand and domestic supply of bicycles in a small country. The world price is $120. The government puts a $30 tariff on each imported bicycle, so the domestic price rises to $150. How much revenue does the tariff raise?", "table": {"header": ["Price", "Quantity demanded", "Quantity supplied"], "rows": [["$120", "90", "30"], ["$150", "80", "40"], ["$180", "70", "50"], ["$210", "60", "60"]]}, "options": ["$1,800", "$40", "$1,200", "$2,400"], "reasons": ["$1,800 uses the 60 bicycles imported before the tariff. The tariff cuts imports, so revenue is earned on fewer bicycles.", "40 is the number of bicycles imported with the tariff. Revenue multiplies that number by the $30 tariff.", "", "$2,400 charges the tariff on all 80 bicycles bought. Domestic bicycles are not taxed; only the 40 imports are."], "answer": 2, "why": "At the domestic price of $150, buyers want 80 bicycles and domestic firms supply 40, so imports are 80 − 40 = 40. The tariff of $30 is collected on each imported bicycle, so revenue is 40 × $30 = $1,200.", "key": "ch9-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Welfare effects of a tariff", "stem": "Compared with free trade, a tariff on an imported good", "options": ["raises producer surplus and government revenue, but lowers consumer surplus by more, so total surplus falls.", "raises total surplus, because domestic producers and the government both gain.", "leaves total surplus unchanged, because consumers' losses all go to producers and the government.", "lowers producer surplus, because domestic firms must pay the tariff."], "reasons": ["", "Producers and the government gain, but consumers lose more than the two of them gain, so total surplus falls.", "Not all of consumers' losses go to others. Some units that were worth more than the world price are no longer bought, and too many are made at home at a cost above the world price. Those losses go to no one.", "The tariff is paid on imports, not on domestic output. The higher domestic price raises domestic producers' surplus."], "answer": 0, "why": "A tariff raises the domestic price. Domestic producers sell more at a higher price, so producer surplus rises, and the government collects revenue. Buyers pay more and buy less, so consumer surplus falls by more than the other two gain. The difference is the deadweight loss of the tariff.", "key": "ch9-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Arguments for restricting trade", "stem": "A government taxes imports of solar panels for a few years, saying that its own young solar-panel firms need time to grow before they can compete with established foreign producers. This is the", "options": ["national-security argument.", "jobs argument.", "unfair-competition argument.", "infant-industry argument."], "reasons": ["The national-security argument is that a country should not depend on foreign suppliers for goods it needs to defend itself.", "The jobs argument is that trade destroys domestic jobs. Here the reason given is that the firms are too young to compete yet.", "The unfair-competition argument is that foreign firms get special advantages, such as subsidies from their governments.", ""], "answer": 3, "why": "The infant-industry argument says new industries need temporary protection until they are large and experienced enough to compete. The difficulty is that governments must pick which industries will later succeed, and protection, once given, is hard to remove.", "key": "ch9-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Import quotas", "stem": "An import quota, unlike a tariff, has no effect on the domestic price of a good.", "answer": false, "why": "A quota limits the quantity that can be imported. With less supply reaching the domestic market, the domestic price rises above the world price, much as it does with a tariff. The main difference is who gets the gap between the domestic price and the world price: with a tariff the government collects it as revenue; with a quota it goes to whoever holds the licenses to import.", "key": "ch9-M5"}]}, {"chapter": 10, "title": "Externalities", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Negative externalities", "stem": "In which case below does someone bear a cost from an activity they take no part in and are not paid for?", "options": ["A homeowner repaints her house, and the value of the houses next door rises.", "Soot from a factory's chimney settles on cars in a nearby parking lot.", "A firm raises the price of its product, and its customers pay more.", "A worker is paid overtime for working on a holiday."], "reasons": ["A rise in the neighbors' house values is a benefit to bystanders, which makes it a positive externality.", "", "Customers who pay a higher price are taking part in the trade. An externality falls on a bystander who is not part of it.", "Overtime pay is part of the agreement between the worker and the firm. No bystander is affected."], "answer": 1, "why": "An externality is the uncompensated effect of one person's actions on a bystander. The car owners take no part in the factory's production, yet the soot damages their cars and no one pays them for it. Because the effect is harmful, it is a negative externality.", "key": "ch10-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Social cost", "stem": "A chemical plant's production sends waste into a river, which harms the people who fish downstream. Compared with the plant's private cost of production, the social cost of its output is", "options": ["higher, because it adds the harm done to the people who fish downstream.", "lower, because the people who fish downstream bear part of the cost.", "the same, because the plant pays for all its inputs.", "zero, because the river is not owned by anyone."], "reasons": ["", "The harm to the people downstream is a cost on top of the plant's own costs. It raises the social cost; it does not reduce it.", "The plant pays for its inputs but not for the damage its waste does downstream. That damage is part of the social cost.", "The river having no owner is why the harm goes unpaid. It does not make the harm cost nothing."], "answer": 0, "why": "Social cost is the private cost to the producer plus the external cost to bystanders. The plant pays its own costs but not the harm to the people who fish downstream. Adding that harm makes the social cost higher than the private cost.", "key": "ch10-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Positive externalities", "stem": "A beekeeper's bees pollinate a neighboring apple orchard and raise its harvest. The orchard owner pays the beekeeper nothing. Left to the market, the number of hives the beekeeper keeps is", "options": ["more than the socially optimal number.", "exactly the socially optimal number.", "fewer than the socially optimal number.", "zero."], "reasons": ["The beekeeper ignores a benefit to the orchard, not a cost to it. Ignoring a benefit leads to keeping too few hives, not too many.", "The beekeeper counts only her own benefit from the hives and leaves out the benefit to the orchard, so her choice is not the social optimum.", "", "The beekeeper keeps hives for her own benefit, such as honey. The externality makes her keep too few, not none."], "answer": 2, "why": "The pollination is a positive externality: a benefit to the orchard that the beekeeper is not paid for. The beekeeper decides how many hives to keep by comparing her own benefit with her cost, and leaves out the benefit to the orchard. The social value of a hive is therefore higher than the value she counts, so she keeps fewer hives than is socially optimal.", "key": "ch10-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Corrective taxes", "stem": "Suppose the government charges sellers a per-unit tax equal to the harm each unit does to bystanders. This tax brings output to the socially optimal level.", "answer": true, "why": "A tax equal to the external cost of each unit makes sellers pay that cost as if it were their own. Their supply curve then rises to the social-cost curve, and the market settles where social cost equals the value to buyers. That is the socially optimal quantity. This is what it means to internalize the externality.", "key": "ch10-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Positive externalities", "stem": "Free markets tend to produce too much of goods whose use benefits bystanders, such as vaccines.", "answer": false, "why": "With a positive externality, the good is worth more to society than to the buyers, because bystanders benefit too. Buyers and sellers ignore that extra benefit, so the market produces less than the socially optimal quantity, not more. Producing too much is what happens with a negative externality.", "key": "ch10-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Socially optimal quantity", "stem": "The table shows the value to buyers and the private cost to sellers of each unit of a good. Producing each unit also causes $6 of harm to people who live near the factory. What is the socially optimal quantity?", "table": {"header": ["Unit", "Value to buyers", "Private cost"], "rows": [["1st", "$30", "$9"], ["2nd", "$27", "$12"], ["3rd", "$24", "$15"], ["4th", "$21", "$18"], ["5th", "$18", "$21"]]}, "options": ["2 units", "3 units", "4 units", "5 units"], "reasons": ["The 3rd unit is worth $24 to buyers and costs society $15 + $6 = $21, so producing it adds to total surplus. Stopping at 2 units is too few.", "", "4 units is what the market produces, because it counts only the private cost. The 4th unit is worth $21 but costs society $18 + $6 = $24.", "The 5th unit is worth $18 to buyers but costs society $21 + $6 = $27, and even its private cost of $21 exceeds its value."], "answer": 1, "why": "The social cost of each unit is its private cost plus the $6 of harm: $15, $18, $21, $24 and $27. A unit should be produced when its value to buyers is at least its social cost. The 1st ($30 vs $15), 2nd ($27 vs $18) and 3rd ($24 vs $21) units pass. The 4th does not ($21 vs $24). So the socially optimal quantity is 3 units.", "key": "ch10-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Corrective taxes", "stem": "The table shows the private cost to sellers and the social cost of each unit of a good. The gap between them is harm to people who live near the factory. Which per-unit tax on sellers would make them count the full social cost of their output?", "options": ["$6", "$3", "$9", "$21"], "reasons": ["", "$3 covers only half of the $6 gap between social and private cost, so sellers would still leave out part of the harm.", "$9 is the private cost of the 1st unit. The tax should equal the harm per unit, the gap between social and private cost.", "$21 is the whole social cost of the 3rd unit. Taxing that much would charge sellers far more than the harm and cut output too far."], "answer": 0, "why": "The harm from each unit is social cost minus private cost: $15 − $9 = $18 − $12 = $21 − $15 = $24 − $18 = $6. A corrective tax equal to that external cost, $6 per unit, makes sellers count the full social cost of each unit, so the market produces the socially optimal quantity.", "table": {"header": ["Unit", "Private cost", "Social cost"], "rows": [["1st", "$9", "$15"], ["2nd", "$12", "$18"], ["3rd", "$15", "$21"], ["4th", "$18", "$24"]]}, "key": "ch10-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Tradable pollution permits", "stem": "Two factories each emit 100 tons of smoke a year. Cutting one ton costs Factory A $50 and Factory B $200. The government wants total smoke cut by 100 tons. Which policy reaches that target at the lowest total cost?", "options": ["Require each factory to cut 50 tons.", "Ban all smoke from both factories.", "Give each factory permits for 50 tons of smoke and let them trade the permits.", "Require Factory B to make the whole 100-ton cut."], "reasons": ["Equal cuts cost 50 × $50 + 50 × $200 = $12,500, because Factory B makes half the cuts at its high cost.", "A ban cuts 200 tons, twice the target, and costs 100 × $50 + 100 × $200 = $25,000.", "", "Making Factory B do all the cutting costs 100 × $200 = $20,000, because every ton is cut by the high-cost factory."], "answer": 2, "why": "The cheapest way to cut 100 tons is for Factory A, which cuts at $50 a ton, to do all of it: 100 × $50 = $5,000. Tradable permits achieve this. Factory B values a permit at up to $200, the cost of cutting a ton itself, while Factory A needs only $50 to cut a ton instead. So Factory A sells its 50 permits to Factory B and cuts all 100 tons of its smoke. Equal cuts would cost $12,500.", "key": "ch10-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "The Coase theorem", "stem": "Ana values playing loud music at night at $50. Her neighbor values a quiet night at $80. Ana has the legal right to play music, and the two can bargain at no cost. The Coase theorem predicts that the music will stop.", "answer": true, "why": "Quiet is worth $80 to the neighbor and the music is worth only $50 to Ana, so stopping the music is the efficient outcome. Even though Ana has the right to play, the neighbor can pay her any amount between $50 and $80 to stop, and both are better off. The Coase theorem says that when bargaining costs nothing, the parties reach the efficient outcome whoever holds the right.", "key": "ch10-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Subsidies for positive externalities", "stem": "Each flu shot gives $15 of benefit to people other than the person vaccinated, because fewer people catch the flu. Which per-shot policy moves the market to the socially optimal number of flu shots?", "options": ["A $15 tax on each flu shot", "A ban on flu shots sold without a prescription", "No policy, because people who get flu shots already benefit from them", "A $15 subsidy for each flu shot"], "reasons": ["A tax would reduce the number of flu shots, but the market already provides too few because buyers ignore the $15 benefit to others.", "Restricting flu shots would reduce their number further, when the market already provides too few.", "People count their own benefit but not the $15 benefit to others, so the market provides fewer flu shots than is socially optimal.", ""], "answer": 3, "why": "Flu shots create a positive externality of $15 per shot. Because buyers ignore that benefit to others, the market provides fewer shots than is socially optimal. A $15 subsidy per shot makes each shot $15 cheaper, which brings the external benefit into buyers' decisions and raises the number of shots to the socially optimal quantity.", "key": "ch10-M5"}]}, {"chapter": 11, "title": "Public Goods and Common Resources", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Rival in consumption", "stem": "Once a customer eats a sandwich bought from a deli, no one else can eat that same sandwich. This feature of the sandwich is called", "options": ["excludability.", "rivalry in consumption.", "the free-rider problem.", "a positive externality."], "answer": 1, "why": "A good is rival in consumption when one person's use of it leaves less for anyone else. A sandwich that has been eaten is gone, so it is rival. Excludability is a different property: whether people who do not pay can be kept from using the good. The free-rider problem arises when a good is not excludable, and a positive externality is a benefit to bystanders. Neither is a property of the sandwich itself.", "reasons": ["Excludability is about whether people who do not pay can be kept from using a good, not about whether one person's use leaves less for others.", "", "The free-rider problem arises when people cannot be kept from using a good. It is not a property of the sandwich.", "A positive externality is a benefit to bystanders. Eating a sandwich gives no benefit to anyone else."], "key": "ch11-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Public goods", "stem": "A radio station broadcasts a free weather forecast. Anyone with a radio can hear it, and one listener tuning in does not reduce what any other listener hears. The forecast is best classified as a", "options": ["private good.", "club good.", "common resource.", "public good."], "answer": 3, "why": "The forecast is not excludable, because anyone with a radio can hear it without paying. It is not rival, because one listener does not reduce what others hear. A good that is neither excludable nor rival is a public good. A private good is both excludable and rival, a club good is excludable but not rival, and a common resource is rival but not excludable.", "reasons": ["A private good is both excludable and rival. Anyone with a radio can hear this forecast, and one listener does not reduce what others hear.", "A club good is one that people who do not pay can be kept from using. Anyone with a radio can hear this forecast.", "A common resource is rival: one person's use leaves less for others. Here one listener does not reduce what anyone else hears.", ""], "key": "ch11-E2"}, {"id": "E3", "difficulty": "Easy", "type": "tf", "topic": "Club goods", "stem": "A video-streaming service that sells monthly subscriptions and has plenty of server capacity is an example of a common resource.", "answer": false, "why": "The service is excludable, because people who do not subscribe are shut out. With plenty of capacity it is not rival, because one more viewer does not slow anyone else down. A good that is excludable but not rival is a club good. A common resource is the opposite case: rival but not excludable.", "key": "ch11-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Common resources", "stem": "Tuna swimming in international waters, which any boat may fish, are a public good.", "answer": false, "why": "Any boat may fish international waters, so the tuna are not excludable. But a tuna caught by one boat cannot be caught by another, so the tuna are rival. A public good must be neither excludable nor rival. A good that is rival but not excludable is a common resource, which is what the tuna are.", "key": "ch11-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Free riders", "stem": "A homeowner who benefits from the streetlight on her block but refuses to contribute to the neighborhood fund that pays for it is a free rider.", "answer": true, "why": "A free rider is a person who receives the benefit of a good but avoids paying for it. The streetlight lights her block whether or not she contributes, because she cannot be excluded from its benefit. By refusing to pay, she gets the benefit for nothing, which is exactly what free riding means.", "key": "ch11-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Cost-benefit analysis", "stem": "Three residents would use a new footbridge over a creek. Dana values the bridge at $150, Eli at $90, and Fran at $60. No one else values it. All three can use the bridge at the same time without getting in each other's way. The bridge costs $250 to build. What should the town do?", "options": ["Build it only if each resident values it at $250 or more.", "Do not build it, because no single resident values it at more than $250.", "Build it, because the total benefit of $300 is greater than the cost of $250.", "Do not build it, because Fran values it at less than an equal one-third share of the cost."], "answer": 2, "why": "Because all three can use the bridge at the same time, the benefit to the town is the sum of their valuations, $150 + $90 + $60 = $300. That is greater than the $250 cost, so building it raises total surplus by $50. No single resident needs to value it above the full cost. How the cost is shared is a separate question; Fran's $60 being below an equal share of about $83.33 does not change whether the bridge is worth building.", "reasons": ["No single resident needs to value the bridge at its full cost. All three use the same bridge, so what matters is the total of their valuations.", "No single resident needs to value the bridge at more than its cost. All three use the same bridge, so what matters is the total of their valuations.", "", "How the cost is shared is a separate question from whether the bridge is worth building."], "key": "ch11-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Efficient quantity of a public good", "stem": "A small town has three residents, Ana, Ben, and Cara. All three benefit from every streetlight on their road. The table shows how much each would pay for each additional streetlight. Each streetlight costs $30 to install. How many streetlights maximize total surplus?", "table": {"header": ["Streetlight", "Ana", "Ben", "Cara"], "rows": [["1st", "$30", "$25", "$15"], ["2nd", "$20", "$15", "$10"], ["3rd", "$12", "$10", "$6"], ["4th", "$5", "$4", "$1"]]}, "options": ["1", "2", "3", "4"], "answer": 1, "why": "All three residents benefit from every light at once, so the value of each light is the sum of what all three residents would pay for it. The 1st light is worth $30 + $25 + $15 = $70, the 2nd $20 + $15 + $10 = $45, the 3rd $12 + $10 + $6 = $28, and the 4th $5 + $4 + $1 = $10. Install a light whenever its total value is at least its $30 cost. The 1st ($70) and 2nd ($45) pass; the 3rd ($28) does not. So 2 streetlights maximize total surplus. Comparing each person's value with the cost separately would wrongly give only 1.", "reasons": ["Comparing each resident's value with the $30 cost on its own ignores that all three benefit from the same light. Add their values for each light.", "", "The 3rd light is worth $12 + $10 + $6 = $28 to the three residents together, which is less than its $30 cost.", "The 4th light is worth only $5 + $4 + $1 = $10 to the three residents together, far below its $30 cost."], "key": "ch11-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Solving the Tragedy of the Commons", "stem": "Anyone may fish a large lake, and the fish stock is falling. The state caps the total catch and sells fishing permits; only permit holders may fish, up to the amount on their permit. Which property of the fish does the permit system change?", "options": ["It makes the fish excludable, because people without a permit may no longer fish.", "It makes the fish nonrival, because the total catch is capped.", "It turns the fish into a public good.", "It removes the externality by subsidizing fishing."], "answer": 0, "why": "Before the permits, anyone could fish, so the fish were not excludable; they were a common resource. The permits shut out anyone without one, which makes the fish excludable. The fish are still rival: a fish one permit holder catches cannot be caught by another, and capping the total does not change that. The fish therefore do not become nonrival or a public good, and a permit is a charge for access, not a subsidy.", "reasons": ["", "Capping the total catch does not make the fish nonrival. A fish caught by one permit holder still cannot be caught by another.", "A public good is not rival. With permits the fish are still rival, because each fish can be caught only once.", "A permit is a charge for access to the lake, not a subsidy."], "key": "ch11-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Public goods", "stem": "The total benefit to a town of a public good, such as a fireworks display, equals the largest amount any single resident would pay for it.", "answer": false, "why": "A public good is not rival, so every resident enjoys the same display at the same time. The total benefit is therefore the sum of what all residents would pay, not the largest single amount. This is why a public good can be worth providing even when no single person would pay its full cost.", "key": "ch11-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Tragedy of the Commons", "stem": "Anyone may fish a lake, which holds a limited stock of fish. When a fisher decides whether to add another boat, she ignores one cost of that decision. That cost is", "options": ["the price she receives for her fish.", "the cost of her own boat and fuel.", "the wages she pays her crew.", "the reduction in the catch of the other boats."], "answer": 3, "why": "The fish are a common resource: rival but not excludable. When she adds a boat, she counts her own costs and her own extra catch. She does not count the fish that the other boats now fail to catch. That loss falls on other people, so it is a negative externality, and because every fisher ignores it, the lake is overfished. This is the Tragedy of the Commons. The price of fish, her boat and fuel, and her crew's wages are all things she does take into account.", "reasons": ["The price she receives is part of her own revenue, and she takes it into account.", "The cost of her own boat and fuel falls on her, and she takes it into account.", "She pays her crew's wages herself, so she takes them into account.", ""], "key": "ch11-M5"}]}, {"chapter": 12, "title": "The Economics of Healthcare", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Moral hazard", "stem": "After buying insurance that pays for all dental work, a man stops flossing, because fixing any cavities will now cost him nothing. This is an example of", "options": ["adverse selection.", "moral hazard.", "a positive externality.", "Baumol's cost disease."], "reasons": ["Adverse selection is about who chooses to buy insurance. Here the change is in how a person behaves after buying it.", "", "A positive externality is a benefit to bystanders. Here the man's choice raises the insurer's costs.", "Baumol's cost disease is about rising costs in services where productivity grows slowly. It does not describe one person's behavior."], "answer": 1, "why": "Moral hazard is the tendency of a person who is insured to take less care, because someone else bears part of the cost. Once his dental bills are covered, the man has less reason to protect his teeth.", "key": "ch12-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Adverse selection", "stem": "An insurer sells the same health policy at one price to anyone who wants it. Which group is most likely to buy it?", "options": ["People in excellent health who rarely see a doctor", "People who prefer to pay their own medical bills", "People who know they are likely to need costly care", "Every group equally, because the price is the same for all"], "reasons": ["People who expect few medical bills get little from the policy compared with its price, so they are the least likely to buy.", "People who choose to pay their own bills are, by definition, choosing not to buy insurance.", "", "The price is the same, but the policy is worth more to those who expect higher bills, so they are more likely to buy."], "answer": 2, "why": "Buyers know more about their own health than the insurer does. At a single price, the policy is the best deal for those who expect to need the most care, so they are the most likely to buy. This is adverse selection.", "key": "ch12-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Externalities in healthcare", "stem": "A vaccine against a contagious disease protects the people around a vaccinated person as well as the person who gets it. Economists call this", "options": ["a positive externality.", "a negative externality.", "moral hazard.", "adverse selection."], "reasons": ["", "A negative externality is a cost imposed on bystanders. Protection from disease is a benefit to them.", "Moral hazard is the tendency to take less care once insured. It does not describe a benefit to others.", "Adverse selection is about who chooses to buy insurance, not about effects on bystanders."], "answer": 0, "why": "An externality is the effect of one person's choice on a bystander who is not paid or charged for it. A vaccinated person is less likely to pass on the disease, which benefits the people around that person. Because the effect is a benefit, it is a positive externality.", "key": "ch12-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Insurance", "stem": "Health insurance reduces the financial risk each person bears by spreading the cost of illness across many people.", "answer": true, "why": "Few people know whether they will face large medical bills. Insurance collects a premium from many people and pays the bills of the few who fall ill. Each person pays a known amount instead of facing the chance of a large bill.", "key": "ch12-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Adverse selection", "stem": "Adverse selection means that people take more risks after they buy insurance.", "answer": false, "why": "Taking more risks after buying insurance is moral hazard. Adverse selection happens before the purchase: the people who choose to buy insurance are those who expect to use it most.", "key": "ch12-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Baumol's cost disease", "stem": "Output per worker grows quickly in manufacturing but slowly in nursing care. Over time, wages rise at about the same rate in both sectors. As a result, the cost of nursing care", "options": ["falls, because nurses' wages rise more slowly than factory wages.", "stays the same compared with the cost of manufactured goods.", "falls compared with manufactured goods, because higher wages make nurses more productive.", "rises compared with manufactured goods, because wages rise without a matching rise in output per worker."], "reasons": ["Wages rise at about the same rate in both sectors, because hospitals must pay enough to keep nurses from moving to other jobs.", "Wages rise by similar amounts in both sectors, but output per worker rises much less in nursing, so its cost per unit rises faster.", "Higher wages do not raise how much a nurse can do in a shift. Output per worker in nursing grows slowly.", ""], "answer": 3, "why": "Wages rise across the economy as productivity rises. In manufacturing, rising output per worker offsets higher wages, so costs per unit stay low. In nursing care, output per worker grows slowly, so higher wages raise the cost of each unit of care. This is Baumol's cost disease.", "key": "ch12-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Deductibles and copayments", "stem": "Health insurers often make patients pay part of each bill themselves, through a deductible or copayment. The main purpose is to", "options": ["attract buyers who are less healthy.", "reduce moral hazard, by giving patients a reason to avoid care they value at less than its cost.", "remove adverse selection entirely.", "raise doctors' incomes."], "reasons": ["A charge each time a patient uses care makes the policy less attractive to heavy users, not more.", "", "Cost sharing affects how much care insured people use. It does not solve the problem that buyers know more about their health than the insurer.", "Cost sharing tends to reduce the amount of care patients use, so it does not raise doctors' incomes."], "answer": 1, "why": "When insurance pays the whole bill, a patient may use care that is worth less to her than it costs. Making her pay part of each bill brings some of that cost back into her decision. She then uses less of the care she values least, which reduces moral hazard.", "key": "ch12-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Insurance premiums", "stem": "Each of 1,000 people has a 2 percent chance of an illness that costs $50,000 to treat and otherwise no medical bills. An insurer covers all of them and has no other costs. What is the smallest premium per person that covers the expected bills?", "options": ["$50,000", "$500", "$1,000", "$20"], "reasons": ["$50,000 is the cost of treating one illness. Only about 2 percent of the people are expected to fall ill.", "$500 is the expected bill for a 1 percent chance of illness. The chance here is 2 percent.", "", "20 is how many of the 1,000 people are expected to fall ill, not a cost per person."], "answer": 2, "why": "About 2 percent of 1,000 people, or 20, are expected to fall ill. Their bills total 20 × $50,000 = $1,000,000. Spread over 1,000 people, that is $1,000 each. Equivalently, the expected bill per person is 0.02 × $50,000 = $1,000.", "key": "ch12-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Patents on drugs", "stem": "A drug company holds a patent on a new drug that costs $5 a dose to make, and it charges $200 a dose. Economists see drug patents as a trade-off because a patent", "options": ["raises the reward for developing new drugs, but lets the firm price far above cost, so fewer people use the drug.", "lowers the price of the drug for patients.", "turns the drug into a public good.", "removes the deadweight loss from the drug market."], "reasons": ["", "A patent makes the firm the only seller, which lets it charge more, not less.", "A public good is one that no one can be excluded from and that one person's use does not reduce for others. The patent holder can exclude anyone who does not pay, and a dose one patient takes cannot be taken by another.", "A price far above the cost of making the drug means some patients who value it above $5 a dose go without it. That is a deadweight loss."], "answer": 0, "why": "Developing a drug is costly, and a patent lets the firm recover that cost by being the only seller for a time. That reward encourages research. But as a monopoly, the firm prices well above the cost of making a dose, so some patients who would pay more than that cost go without. Society gains new drugs at the price of that lost use.", "key": "ch12-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Adverse selection", "stem": "If mainly people who expect high medical bills buy a policy, the insurer must raise its premium, which can lead more of the healthier buyers to drop out.", "answer": true, "why": "When the buyers are mostly those who expect high bills, the insurer's costs per policy rise and it must charge more. A higher premium is a worse deal for healthier buyers, so more of them drop out. The pool becomes less healthy still, and premiums rise again. This spiral is the danger adverse selection poses to insurance markets.", "key": "ch12-M5"}]}, {"chapter": 13, "title": "The Design of the Tax System", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Marginal tax rate", "stem": "When a lawyer earns an extra $100, her tax bill goes up by $25. What is her marginal tax rate?", "options": ["4 percent", "75 percent", "100 percent", "25 percent"], "reasons": ["Dividing $100 by $25 gives 4, but that is the wrong way round. The marginal rate is the extra tax divided by the extra income.", "75 percent is the share of the extra income she keeps, not the share she pays in tax.", "100 percent would mean all of the extra $100 goes in tax. Only $25 does.", ""], "answer": 3, "why": "The marginal tax rate is the extra tax paid on an extra dollar of income. Here the extra tax is $25 on an extra $100 of income, so the marginal rate is $25 / $100 = 25 percent.", "key": "ch13-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Principles of fairness", "stem": "A city pays for its public parks with an entry fee charged to each person who uses them, rather than with general taxes. Which idea of fairness in taxation does this follow?", "options": ["The benefits principle", "The ability-to-pay principle", "Vertical equity", "Horizontal equity"], "reasons": ["", "The ability-to-pay principle bases taxes on how well a person can bear the burden, not on what that person receives from government.", "Vertical equity, part of the ability-to-pay principle, says people with greater ability to pay should pay more.", "Horizontal equity, part of the ability-to-pay principle, says people with similar ability to pay should pay the same."], "answer": 0, "why": "The benefits principle says people should pay taxes according to what they get from government services. A park fee charged to those who use the parks follows it: those who use the parks more pay more. A gasoline tax that pays for roads is another example.", "key": "ch13-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Lump-sum taxes", "stem": "Every adult owes the government $1,000 a year, whatever he or she earns or buys. This kind of tax is", "options": ["a proportional tax.", "a lump-sum tax.", "a tariff.", "an estate tax."], "reasons": ["A proportional tax takes the same percentage of every person's income. This tax is a fixed dollar amount.", "", "A tariff is a tax on imported goods.", "An estate tax is a tax on property left to heirs at death."], "answer": 1, "why": "A lump-sum tax is the same dollar amount for everyone. Because the amount owed does not depend on anything a person does, the tax does not change behavior, so it causes no deadweight loss. It is efficient but widely seen as unfair, since a poor person pays as much as a rich one.", "key": "ch13-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Lump-sum taxes", "stem": "A head tax, the same dollar amount for every adult, creates no deadweight loss.", "answer": true, "why": "Deadweight loss arises when a tax changes what people do, such as working or buying less. A head tax is the same whatever a person does, so it changes no decisions at the margin. Its marginal tax rate is zero, and it causes no deadweight loss.", "key": "ch13-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Progressive taxes", "stem": "Under a progressive tax, high-income taxpayers pay a smaller share of their income in tax than low-income taxpayers do.", "answer": false, "why": "A progressive tax takes a larger share of income from high-income taxpayers than from low-income taxpayers. A tax that takes a smaller share from the high-income group is regressive.", "key": "ch13-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Average tax rate", "stem": "An income tax has the brackets shown in the table. What is the average tax rate of a woman with an income of $80,000?", "table": {"header": ["Income range", "Tax rate on income in this range"], "rows": [["$0 to $20,000", "0 percent"], ["$20,000 to $50,000", "10 percent"], ["Above $50,000", "20 percent"]]}, "options": ["20 percent", "10 percent", "11.25 percent", "15 percent"], "reasons": ["20 percent is her marginal tax rate, the rate on her last dollar of income. Most of her income is taxed at lower rates.", "10 percent is the rate on the middle bracket only. Part of her income is taxed at 0 percent and part at 20 percent.", "", "15 percent averages the two positive bracket rates. The average tax rate is total tax divided by total income."], "answer": 2, "why": "The first $20,000 is taxed at 0 percent: $0. The next $30,000 is taxed at 10 percent: $3,000. The last $30,000 is taxed at 20 percent: $6,000. Total tax is $9,000. The average tax rate is $9,000 / $80,000 = 11.25 percent.", "key": "ch13-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Proportional taxes", "stem": "Ali earns $40,000 a year and pays $4,000 in tax. Beth earns $200,000 a year and pays $20,000 in tax. Judging by these two people, the tax is", "options": ["progressive.", "regressive.", "lump-sum.", "proportional."], "reasons": ["A progressive tax takes a larger share of a higher income. Here both pay the same share, 10 percent.", "A regressive tax takes a smaller share of a higher income. Here both pay the same share, 10 percent.", "A lump-sum tax is the same dollar amount for everyone. Beth pays $20,000 and Ali $4,000.", ""], "answer": 3, "why": "Ali pays $4,000 / $40,000 = 10 percent of his income. Beth pays $20,000 / $200,000 = 10 percent of hers. Both pay the same share, so the tax is proportional, even though Beth pays five times as many dollars.", "key": "ch13-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Efficiency of taxes", "stem": "Two taxes raise the same revenue. Tax A barely changes what people buy and is cheap to collect. Tax B leads people to change what they buy, and filing it takes many hours of paperwork. Tax A is", "options": ["more efficient, because its deadweight loss and administrative burden are smaller.", "less efficient, because it collects the same revenue with less effort.", "fairer, because it raises the same revenue as Tax B.", "just as efficient, because both raise the same revenue."], "reasons": ["", "Raising the same revenue at a lower cost to taxpayers is exactly what makes a tax more efficient.", "Both taxes raise the same revenue, which says nothing about who pays them. Fairness depends on how the burden is shared.", "Raising the same revenue is the starting point. The taxes differ in what they cost taxpayers beyond the money paid to the government."], "answer": 0, "why": "An efficient tax raises revenue at a small cost to taxpayers beyond the tax itself. That cost has two parts: the deadweight loss from changed behavior and the administrative burden of complying. Tax A has less of both, so it is more efficient.", "key": "ch13-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Incidence of the corporate tax", "stem": "Who ultimately bears the burden of the corporate income tax?", "options": ["The corporation itself, and no one else", "People: the firm's owners, workers and customers", "No one, because the corporation passes the tax back to the government", "Only the government, which loses revenue"], "reasons": ["A corporation is a legal entity. A tax on it ends up as lower returns to its owners, lower wages for its workers or higher prices for its customers.", "", "The tax is a payment to the government. It cannot be passed back to the government.", "The government collects the tax; it does not bear it."], "answer": 1, "why": "Only people can bear a tax. The corporate income tax may lower the return to the firm's owners, and by reducing investment it can lower the wages of its workers. It can also raise the prices its customers pay. How the burden is divided among them is the question of tax incidence.", "key": "ch13-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Deadweight loss", "stem": "A tax on a good that buyers and sellers barely respond to creates a large deadweight loss.", "answer": false, "why": "Deadweight loss comes from the trades a tax prevents. If buyers and sellers barely respond to the price, the quantity traded hardly falls, so few trades are lost and the deadweight loss is small. Taxes on goods with elastic supply or demand cause larger deadweight losses.", "key": "ch13-M5"}]}, {"chapter": 14, "title": "The Costs of Production", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Explicit and implicit costs", "stem": "A dentist owns her office building outright and runs her practice in it. Which of the following is an implicit cost of her practice?", "options": ["The salaries she pays her dental hygienists", "The rent she could earn by leasing the building to another firm", "The cost of dental supplies", "The practice's electricity bill"], "answer": 1, "why": "An implicit cost is an opportunity cost that does not require the firm to pay out money. By using the building herself, the dentist gives up the rent another firm would pay her for it, but she writes no check for it. Salaries, supplies and electricity are all paid out in money, so they are explicit costs.", "reasons": ["Salaries are paid out in money, so they are an explicit cost.", "", "Dental supplies are paid for in money, so they are an explicit cost.", "The electricity bill is paid in money, so it is an explicit cost."], "key": "ch14-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Fixed and variable costs", "stem": "A bakery pays each month for flour, the wages of hourly counter staff, electricity to run its ovens, and the lease on its shop. Which of these is a fixed cost?", "options": ["The flour", "The wages of hourly counter staff", "The electricity to run its ovens", "The lease on its shop"], "answer": 3, "why": "A fixed cost does not change with the quantity of output. The lease is the same whether the bakery bakes 100 loaves a month or 10,000. Flour, hourly wages and oven electricity all rise as the bakery produces more, so they are variable costs.", "reasons": ["The bakery uses more flour when it bakes more, so flour is a variable cost.", "Hourly staff are paid for the hours they work, and those hours rise with output, so their wages are a variable cost.", "The ovens use more electricity when the bakery bakes more, so this is a variable cost.", ""], "key": "ch14-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Marginal product", "stem": "A print shop produces 240 posters a day with 4 workers and 285 posters a day with 5 workers. The marginal product of the fifth worker is", "options": ["45 posters.", "57 posters.", "60 posters.", "285 posters."], "answer": 0, "why": "The marginal product of a worker is the increase in output from hiring that worker: 285 − 240 = 45 posters. 57 posters is output per worker with five workers (285 ÷ 5), and 60 is output per worker with four (240 ÷ 4); both are averages, not the change. 285 is total output.", "reasons": ["", "57 is total output divided by five workers (285 ÷ 5). That is output per worker, not the extra output the fifth worker adds.", "60 is 240 ÷ 4, output per worker with four workers. It is not the change in output.", "285 is total output with five workers, not the extra output the fifth worker adds."], "key": "ch14-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Average fixed cost", "stem": "A gym pays $6,000 a month for its lease. If its membership doubles from 300 to 600, the lease cost per member halves, from $20 to $10.", "answer": true, "why": "The lease is a fixed cost: it stays $6,000 a month however many members the gym has. Cost per member is $6,000 ÷ 300 = $20 with 300 members and $6,000 ÷ 600 = $10 with 600, so it halves. This is average fixed cost, and it always falls as output rises because the same fixed cost is spread over more units.", "key": "ch14-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Economic and accounting profit", "stem": "A firm can have a positive accounting profit and a negative economic profit at the same time.", "answer": true, "why": "Accounting profit subtracts only explicit costs from total revenue. Economic profit subtracts both explicit and implicit costs, such as the salary the owner gave up. If the implicit costs are larger than the accounting profit, the economic profit is negative even though the accounting profit is positive.", "key": "ch14-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Economic profit", "stem": "Priya leaves a job that paid $90,000 a year to run her own consulting firm. She starts the firm with $50,000 of her own savings, which would otherwise have earned 4 percent a year. In its first year the firm takes in $210,000 of revenue and pays $85,000 in rent, staff wages and software. What is the firm's economic profit for the year?", "options": ["$125,000", "$35,000", "$123,000", "$33,000"], "answer": 3, "why": "Economic profit is total revenue minus explicit and implicit costs. Explicit costs are $85,000, so accounting profit is $210,000 − $85,000 = $125,000. Implicit costs are the $90,000 salary she gave up plus the interest her savings would have earned, 4% × $50,000 = $2,000, for a total of $92,000. Economic profit is $125,000 − $92,000 = $33,000. $125,000 ignores the implicit costs, $35,000 leaves out the forgone interest, and $123,000 leaves out the forgone salary.", "reasons": ["$125,000 is accounting profit. It leaves out the implicit costs: the salary and the interest she gave up.", "$35,000 subtracts the $90,000 salary she gave up but leaves out the interest her savings would have earned.", "$123,000 subtracts the forgone interest but leaves out the $90,000 salary she gave up.", ""], "key": "ch14-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Average total cost", "stem": "The table shows a firm's total cost at each level of output. At which quantity is average total cost lowest?", "table": {"header": ["Output (units)", "Total cost"], "rows": [["0", "$100"], ["1", "$140"], ["2", "$170"], ["3", "$210"], ["4", "$270"], ["5", "$350"]]}, "options": ["2 units", "3 units", "4 units", "5 units"], "answer": 2, "why": "Average total cost is total cost divided by output: $140 at 1 unit, $170 ÷ 2 = $85 at 2 units, $210 ÷ 3 = $70 at 3 units, $270 ÷ 4 = $67.50 at 4 units, and $350 ÷ 5 = $70 at 5 units. The lowest is $67.50, at 4 units. The marginal costs confirm it. The 4th unit costs $270 − $210 = $60, which is below the $70 average at 3 units, so the average falls. The 5th unit costs $350 − $270 = $80, which is above the $67.50 average at 4 units, so the average rises.", "reasons": ["At 2 units average total cost is $170 ÷ 2 = $85, and it is lower at another output.", "At 3 units average total cost is $210 ÷ 3 = $70, and it is lower at another output.", "", "At 5 units average total cost is $350 ÷ 5 = $70, and it is lower at another output."], "key": "ch14-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Marginal cost and average total cost", "stem": "Producing 20 units costs a firm $300 in total, an average of $15 a unit. Making a 21st unit adds $12 to total cost. With 21 units, the firm's average total cost", "options": ["rises above $15.", "falls below $15.", "stays at exactly $15.", "falls to $12."], "answer": 1, "why": "Total cost at 20 units is 20 × $15 = $300. Adding the 21st unit at $12 makes total cost $312, so average total cost is $312 ÷ 21 ≈ $14.86, which is below $15. The general rule: when marginal cost is below average total cost, producing one more unit pulls the average down. It does not fall all the way to $12, because the $12 unit is averaged with the 20 units that came before it.", "reasons": ["The 21st unit costs $12, less than the $15 average, so adding it cannot raise the average.", "", "The average stays the same only if the extra unit costs exactly the average, $15. This one costs $12.", "The $12 unit is averaged with the 20 units already made, so the average does not fall all the way to $12."], "key": "ch14-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Diminishing marginal product", "stem": "A restaurant hires a sixth cook and its meals served per night rise, but by less than they rose when it hired the fifth cook. The restaurant's total output must therefore be falling.", "answer": false, "why": "The sixth cook still adds to output, because meals served rise. What falls is the marginal product: the sixth cook adds fewer meals than the fifth did. That is diminishing marginal product. Total output keeps rising as long as marginal product is positive; it falls only if an extra cook adds a negative amount.", "key": "ch14-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Economies of scale", "stem": "In the long run, a furniture maker's total cost is $40,000 to make 100 tables and $72,000 to make 200 tables. Over this range of output, the firm has", "options": ["economies of scale, because long-run average total cost falls from $400 to $360 per table.", "diseconomies of scale, because long-run total cost rises from $40,000 to $72,000.", "constant returns to scale, because output doubles.", "diseconomies of scale, because the extra 100 tables add $32,000 to total cost."], "answer": 0, "why": "Economies of scale are judged by long-run average total cost, not total cost. Average cost is $40,000 ÷ 100 = $400 per table at 100 tables and $72,000 ÷ 200 = $360 per table at 200 tables. Average cost falls as output rises, so the firm has economies of scale. Total cost always rises when output rises, so a rising total cost says nothing about scale. Constant returns would require average cost to stay the same, which it does not.", "reasons": ["", "Scale is judged by average cost, not total cost. Total cost always rises when output rises.", "Constant returns would need average cost to stay the same. Compare $40,000 ÷ 100 with $72,000 ÷ 200.", "The extra 100 tables cost $32,000 ÷ 100 = $320 each, less than the $400 average before, so they pull the average down, not up."], "key": "ch14-M5"}]}, {"chapter": 15, "title": "Firms in Competitive Markets", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Price takers", "stem": "A wheat farmer is one of thousands of sellers of identical wheat. If she set her price above the market price, she would", "options": ["sell the same amount, because her regular buyers would stay with her.", "lose all her sales, because buyers can get identical wheat from other farmers at the market price.", "raise her total revenue, because each bushel would bring in more.", "push the market price up."], "reasons": ["Her wheat is identical to everyone else's, so buyers have no reason to pay her more than the market price.", "", "Each bushel would bring in more only if someone bought it. At a price above the market price no one does.", "She is one seller among thousands. Her output is too small a part of the market to move the market price."], "answer": 1, "why": "In a competitive market the product is identical and there are many sellers, so each firm is a price taker. Buyers can get the same wheat from other farmers at the market price. A farmer who asks more than that sells nothing.", "key": "ch15-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Marginal revenue", "stem": "A firm in a competitive market sells T-shirts at the market price of $12 each. Its marginal revenue from selling one more T-shirt is", "options": ["$0.", "less than $12, because selling more lowers the price.", "$12.", "more than $12 if demand is strong."], "reasons": ["Each extra T-shirt sold brings in the $12 price, so the extra revenue is not zero.", "A competitive firm is a price taker. It can sell more without lowering the price, so the extra revenue is the full $12.", "", "The firm cannot charge more than the market price, so one more T-shirt cannot bring in more than $12."], "answer": 2, "why": "Marginal revenue is the change in total revenue from selling one more unit. A competitive firm can sell as much as it wants at the market price, so each extra T-shirt adds exactly the price, $12, to total revenue. For a competitive firm, marginal revenue equals the price.", "key": "ch15-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Shutdown rule", "stem": "In the short run, a competitive firm should shut down if the price is below its", "options": ["average variable cost.", "average total cost.", "marginal cost at its current output.", "average fixed cost."], "reasons": ["", "A price below average total cost but above average variable cost means a loss, yet staying open covers the variable cost and part of the fixed cost. Shutting down would lose more.", "A price below marginal cost at the current output means the firm should produce less, not that it should close.", "Fixed cost must be paid in the short run whether the firm operates or not, so it plays no part in the decision to shut down."], "answer": 0, "why": "If the firm shuts down in the short run, it still pays its fixed cost but saves its variable cost. Staying open is worth it only if revenue covers variable cost, that is, if the price is at least average variable cost. When the price is below average variable cost, each unit sold loses money beyond the fixed cost, so the firm shuts down.", "key": "ch15-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Long-run equilibrium", "stem": "When entry and exit are free, competition drives the economic profit of a typical firm in a competitive industry to zero once the market has fully adjusted.", "answer": true, "why": "If firms earn positive profit, new firms enter, market supply rises and the price falls. If they make losses, firms exit and the price rises. Entry and exit stop only when profit is zero, which happens when the price equals the minimum of average total cost.", "key": "ch15-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Profit maximization", "stem": "To get the most profit, a price-taking firm should aim for the output level where its cost per unit is at its minimum.", "answer": false, "why": "A competitive firm maximizes profit by producing the quantity at which marginal cost equals the price. If the price is above the minimum of average total cost, that quantity is larger than the one where average total cost is lowest. The two coincide only in long-run equilibrium, when the price equals the minimum of average total cost.", "key": "ch15-E5"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Profit-maximizing quantity", "stem": "A firm in a competitive market can sell as many units as it wants at $8 each. Its total cost is shown in the table. What quantity maximizes its profit?", "table": {"header": ["Quantity", "Total cost"], "rows": [["0", "$10"], ["1", "$13"], ["2", "$17"], ["3", "$22"], ["4", "$29"], ["5", "$38"], ["6", "$49"]]}, "options": ["3 units", "5 units", "6 units", "4 units"], "reasons": ["The 4th unit adds $8 to revenue and $29 − $22 = $7 to cost, so producing it raises profit by $1. Stopping at 3 units is too few.", "The 5th unit adds $8 to revenue but $38 − $29 = $9 to cost, so producing it lowers profit by $1.", "At 6 units revenue is $48 and cost is $49, a loss of $1. The 6th unit costs $11 and brings in only $8.", ""], "answer": 3, "why": "The marginal cost of each unit is the rise in total cost: $3, $4, $5, $7, $9 and $11. The firm produces each unit whose marginal cost is no more than the $8 price. Units 1 to 4 pass; the 5th, at $9, does not. Profit at 4 units is $32 − $29 = $3, more than at 3 units ($24 − $22 = $2) or at 5 units ($40 − $38 = $2).", "key": "ch15-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Measuring profit", "stem": "A price-taking firm produces 500 units and sells them for $20 apiece. Counting all its costs, each unit costs it $16 on average. How much profit does it make?", "options": ["$10,000.", "$2,000.", "$8,000.", "$4."], "reasons": ["$10,000 is total revenue, 500 × $20. Profit subtracts total cost.", "", "$8,000 is total cost, 500 × $16. Profit is revenue minus that cost.", "$4 is the profit on each unit, $20 − $16. Total profit multiplies it by the 500 units sold."], "answer": 1, "why": "Profit is (price − average total cost) × quantity. Here that is ($20 − $16) × 500 = $2,000. Put another way, total revenue is $10,000 and total cost is $8,000, so profit is $2,000.", "key": "ch15-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Shutdown decision", "stem": "A bakery in a competitive market has fixed costs of $3,000 a month, which it must pay even if it closes for the month. If it stays open, its revenue will be $9,000 and its variable costs $8,000. In the short run, the bakery should", "options": ["stay open, because revenue covers variable costs and leaves $1,000 toward fixed costs.", "shut down, because it would lose money by staying open.", "shut down, because revenue is less than the total cost of $11,000.", "stay open, because it earns a profit of $1,000."], "reasons": ["", "Staying open loses $2,000, but closing loses the whole $3,000 of fixed costs. Staying open loses less.", "The $3,000 of fixed costs is paid whether the bakery opens or not, so comparing revenue with total cost is the wrong test in the short run.", "Its profit is $9,000 − $8,000 − $3,000 = −$2,000, a loss. The $1,000 is what is left after variable costs only."], "answer": 0, "why": "If the bakery closes, it loses its $3,000 of fixed costs. If it stays open, it loses $9,000 − $8,000 − $3,000 = $2,000. Staying open loses $1,000 less, because revenue more than covers variable cost. In the short run a firm stays open when revenue is at least variable cost.", "key": "ch15-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Entry in the long run", "stem": "Existing firms in a competitive industry are making positive economic profit, and nothing stops new firms from joining. Over time,", "options": ["the market price rises and profits grow.", "the market price stays the same and profits stay positive.", "market supply rises, the price falls, and profits fall toward zero.", "the number of firms in the market falls."], "reasons": ["Entry adds to market supply, which pushes the price down, not up.", "Profits attract new firms, and their extra output lowers the price. Positive profits cannot last.", "", "Positive profits attract firms into the market. Firms leave only when they make losses."], "answer": 2, "why": "Positive profits draw new firms into the market. Their output shifts the market supply curve to the right, so the price falls. Entry continues until the price has fallen to the minimum of average total cost and economic profit is zero.", "key": "ch15-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "The firm's supply curve", "stem": "In the short run, the quantity a competitive firm supplies at each price is read off its marginal-cost curve, but only at prices at or above its average variable cost.", "answer": true, "why": "At any price, the firm produces where marginal cost equals the price, so the marginal-cost curve shows how much it supplies. Below average variable cost, the firm shuts down and supplies nothing. So the short-run supply curve is the marginal-cost curve above average variable cost.", "key": "ch15-M5"}]}, {"chapter": 16, "title": "Monopoly", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Barriers to entry", "stem": "Which of the following can keep rival firms out of a market and so let a single firm be its only seller?", "options": ["A patent that gives the firm the sole right to sell a new drug.", "Many firms selling an identical product.", "Low costs of setting up a new firm.", "Buyers who know the price charged by every seller."], "reasons": ["", "Many firms selling the same product is the opposite of a monopoly. It describes a competitive market.", "Low setup costs make it easy for new firms to enter, so they work against a monopoly.", "Well-informed buyers make it harder for a seller to charge more than its rivals. This is not a barrier to entry."], "answer": 0, "why": "A monopoly lasts only if other firms cannot enter the market. A patent is a legal barrier: for its term, no other firm may sell the drug. That lets the patent holder be the only seller.", "key": "ch16-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Profit maximization", "stem": "A profit-maximizing monopolist produces the quantity at which", "options": ["price equals marginal cost.", "average total cost is lowest.", "total revenue is as large as possible.", "marginal revenue equals marginal cost."], "reasons": ["Price equals marginal cost in a competitive market. A monopolist charges a price above marginal cost.", "The quantity where average total cost is lowest is the efficient scale. A monopolist has no reason to produce there.", "Total revenue is largest where marginal revenue is zero. Producing there ignores what the extra units cost.", ""], "answer": 3, "why": "Profit rises when a unit adds more to revenue than to cost, that is, when marginal revenue exceeds marginal cost. A monopolist expands output until marginal revenue equals marginal cost. It then charges the highest price the demand curve allows for that quantity.", "key": "ch16-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Natural monopoly", "stem": "Economists use the term natural monopoly for a market in which", "options": ["one firm controls a key natural resource, such as a mineral spring.", "one firm can serve the entire market at a lower cost per unit than several firms sharing it.", "the government sets
